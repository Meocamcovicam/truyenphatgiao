<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tủ Sách Điện Tử - Flipbook Reader</title>
  
  <!-- Thư viện PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- Thư viện lật trang StPageFlip -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131d31;
      --card-hover: #1e2c47;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    header {
      padding: 0.9rem 1.5rem;
      background: rgba(19, 29, 49, 0.9);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e293b;
      z-index: 10;
    }
    h1 { font-size: 1.25rem; font-weight: 700; color: var(--accent); }
    
    /* Giao diện Kệ Sách */
    #shelf-view {
      padding: 1.5rem;
      max-width: 1300px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-top: 1.25rem;
    }
    .book-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.1rem;
      display: flex;
      flex-direction: column;
      border: 1px solid #1e293b;
      transition: all 0.25s ease;
      cursor: pointer;
    }
    .book-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.5);
      border-color: var(--accent);
      background: var(--card-hover);
    }
    .book-cover {
      height: 170px;
      background: linear-gradient(135deg, #0284c7, #1e3a8a);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      margin-bottom: 0.9rem;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.4);
    }
    .book-title {
      font-size: 0.92rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 0.5rem;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .book-meta { font-size: 0.78rem; color: var(--text-muted); margin-top: auto; }

    /* Giao diện Trình đọc Lật Sách */
    #reader-view {
      display: none;
      flex-direction: column;
      align-items: center;
      flex: 1;
      height: 100vh;
      overflow: hidden;
      padding: 0.5rem;
    }
    .reader-toolbar {
      width: 100%;
      max-width: 1300px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.4rem 0.5rem;
      gap: 0.5rem;
      font-size: 0.9rem;
    }
    .btn {
      background: #1e293b;
      color: white;
      border: 1px solid #334155;
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      transition: all 0.2s;
    }
    .btn:hover { background: #334155; border-color: var(--accent); }
    .btn-active { background: var(--accent); color: #090d16; font-weight: 600; border-color: var(--accent); }

    /* Vùng chứa Sách Co Giãn Linh Hoạt */
    #book-wrapper {
      flex: 1;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      margin: 0.2rem 0;
    }

    /* Khung sách PageFlip */
    .flip-container {
      margin: auto;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.75);
    }

    /* Từng trang sách */
    .page {
      background-color: #fff;
      position: relative;
      overflow: hidden;
    }
    .page-canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      object-fit: contain;
    }
    .page-loader {
      position: absolute;
      inset: 0;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #64748b;
      font-size: 0.85rem;
      gap: 0.5rem;
    }

    /* Hiệu ứng tải trang */
    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
      padding: 2.5rem;
      color: var(--text-muted);
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3.5px solid #1e293b;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .spinner-sm {
      width: 22px;
      height: 22px;
      border-width: 2.5px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Điều khiển chân trang */
    .reader-footer {
      display: flex;
      gap: 1.5rem;
      align-items: center;
      padding: 0.4rem;
    }

    @media (max-width: 768px) {
      #shelf-view { padding: 1rem; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; }
      .book-cover { height: 130px; font-size: 2.2rem; }
      .hide-mobile { display: none !important; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Tủ Sách Điện Tử</h1>
    <div id="status-tag" style="font-size: 0.8rem; color: var(--text-muted);">Đang kết nối...</div>
  </header>

  <!-- MÀN HÌNH 1: KỆ SÁCH -->
  <main id="shelf-view">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <h2 style="font-size: 1.2rem;">Danh mục sách</h2>
      <span id="file-counter" style="color: var(--text-muted); font-size: 0.9rem;"></span>
    </div>
    <div id="loading-shelf" class="loader">
      <div class="spinner"></div>
      <div>Đang đọc dữ liệu từ Google Drive...</div>
    </div>
    <div id="shelf-grid" class="grid"></div>
  </main>

  <!-- MÀN HÌNH 2: TRÌNH ĐỌC LẬT SÁCH -->
  <div id="reader-view">
    <div class="reader-toolbar">
      <button class="btn" onclick="backToShelf()">← Kệ sách</button>
      <span id="current-book-name" style="font-weight: 600; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></span>
      
      <div style="display: flex; align-items: center; gap: 0.6rem;">
        <!-- Nút đổi 1 trang / 2 trang trên máy tính -->
        <button id="view-mode-btn" class="btn hide-mobile" onclick="toggleViewMode()">📖 Chế độ: 2 trang</button>
        <span style="font-size: 0.85rem; color: var(--text-muted);">
          Trang <b id="current-page" style="color: var(--accent);">1</b> / <span id="total-pages">--</span>
        </span>
      </div>
    </div>

    <!-- Spinner khi đang kéo file từ Drive -->
    <div id="loading-book" class="loader" style="margin: auto;">
      <div class="spinner"></div>
      <div id="loading-progress">Đang tải sách từ máy chủ...</div>
    </div>

    <!-- Vùng lật sách được cấp phát động -->
    <div id="book-wrapper"></div>

    <div class="reader-footer">
      <button class="btn" onclick="prevPage()">‹ Trang trước</button>
      <button class="btn" onclick="nextPage()">Trang sau ›</button>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxOwmO8RSpnp9xgWBCBvBkPyVDmtjtuon9nWWNibD_E8FalOFEf7zRQPeeVVTtrM03D-g/exec";
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";

    // Quản lý bộ nhớ đệm và phiên làm việc
    const pdfDataCache = new Map();
    let currentSessionId = 0;
    let pageFlipInstance = null;
    let currentPdfDoc = null;
    let currentViewMode = window.innerWidth <= 768 ? "single" : "double"; // Mobile: 1 trang, PC: 2 trang
    let currentBookInfo = null;

    // 1. Tải danh sách sách từ Google Apps Script
    async function fetchBookList() {
      const shelfStatus = document.getElementById("loading-shelf");
      try {
        const response = await fetch(GOOGLE_SCRIPT_URL);
        const res = await response.json();
        shelfStatus.style.display = "none";

        if (!res.success) throw new Error(res.error);

        const files = res.files || [];
        document.getElementById("file-counter").innerText = `Tổng cộng: ${files.length} cuốn`;
        document.getElementById("status-tag").innerText = "Đã kết nối Drive";

        const shelfGrid = document.getElementById("shelf-grid");
        shelfGrid.innerHTML = "";

        files.forEach(file => {
          const card = document.createElement("div");
          card.className = "book-card";
          card.innerHTML = `
            <div class="book-cover">📖</div>
            <div class="book-title" title="${file.name}">${file.name.replace(/\.pdf$/i, '')}</div>
            <div class="book-meta">Dung lượng: ${file.size}</div>
          `;
          card.onclick = () => openBook(file.id, file.name);
          shelfGrid.appendChild(card);
        });
      } catch (err) {
        shelfStatus.innerHTML = `<div style="color:#ef4444; text-align:center;">Lỗi kết nối Drive: ${err.message}</div>`;
      }
    }

    // 2. Mở sách & Dựng trang siêu tốc
    async function openBook(fileId, fileName) {
      currentSessionId++;
      const thisSession = currentSessionId;
      currentBookInfo = { fileId, fileName };

      // Chuyển màn hình
      document.getElementById("shelf-view").style.display = "none";
      document.getElementById("reader-view").style.display = "flex";
      document.getElementById("current-book-name").innerText = fileName;
      document.getElementById("loading-book").style.display = "flex";
      document.getElementById("loading-progress").innerText = "Đang tải dữ liệu...";

      // Hủy phiên lật trang cũ nếu có
      destroyCurrentFlipbook();

      try {
        let uint8Array;
        // Kiểm tra cache đã lưu chưa để mở ngay
        if (pdfDataCache.has(fileId)) {
          uint8Array = pdfDataCache.get(fileId);
        } else {
          const res = await fetch(`${GOOGLE_SCRIPT_URL}?id=${fileId}`);
          const json = await res.json();
          if (!json.success) throw new Error(json.error);

          const raw = atob(json.data);
          uint8Array = new Uint8Array(raw.length);
          for (let i = 0; i < raw.length; i++) uint8Array[i] = raw.charCodeAt(i);
          pdfDataCache.set(fileId, uint8Array);
        }

        if (thisSession !== currentSessionId) return; // Người dùng đã thoát ra

        document.getElementById("loading-progress").innerText = "Đang chuẩn bị trang sách...";
        const loadingTask = pdfjsLib.getDocument({ data: uint8Array });
        currentPdfDoc = await loadingTask.promise;
        const total = currentPdfDoc.numPages;
        document.getElementById("total-pages").innerText = total;

        // Tính toán kích thước tối ưu theo màn hình
        await setupAndRenderFlipbook(currentPdfDoc, thisSession);

      } catch (err) {
        if (thisSession === currentSessionId) {
          alert("Lỗi mở sách: " + err.message);
          backToShelf();
        }
      }
    }

    // 3. Khởi tạo và Dựng Flipbook lũy tiến (Load trước 2 trang đầu)
    async function setupAndRenderFlipbook(pdf, sessionId) {
      const wrapper = document.getElementById("book-wrapper");
      wrapper.innerHTML = ""; // Xóa sạch khung cũ, chống lỗi null style

      const flipDiv = document.createElement("div");
      flipDiv.className = "flip-container";
      wrapper.appendChild(flipDiv);

      const total = pdf.numPages;

      // Lấy kích thước chuẩn từ trang đầu tiên
      const firstPage = await pdf.getPage(1);
      const viewport = firstPage.getViewport({ scale: 1 });
      const pageRatio = viewport.width / viewport.height; // Tỷ lệ chiều rộng / chiều cao trang

      // Tính kích thước hiển thị lớn và vừa vặn nhất trên màn hình
      const availWidth = wrapper.clientWidth - 20;
      const availHeight = wrapper.clientHeight - 20;

      let bookWidth, bookHeight;
      const isMobile = window.innerWidth <= 768;
      const isSingleMode = isMobile || currentViewMode === "single";

      if (isSingleMode) {
        // Chế độ 1 trang (Khớp theo chiều cao hoặc chiều rộng khung nhìn)
        bookHeight = Math.min(availHeight, availWidth / pageRatio);
        bookWidth = bookHeight * pageRatio;
      } else {
        // Chế độ 2 trang song song trên PC
        bookHeight = Math.min(availHeight, (availWidth / 2) / pageRatio);
        bookWidth = bookHeight * pageRatio; // Bề rộng của 1 trang
      }

      // Tạo cấu trúc khung rỗng cho tất cả các trang
      for (let i = 1; i <= total; i++) {
        const pageEl = document.createElement("div");
        pageEl.className = "page";
        pageEl.id = `page-container-${i}`;
        pageEl.innerHTML = `
          <canvas class="page-canvas" id="canvas-p-${i}"></canvas>
          <div class="page-loader" id="loader-p-${i}">
            <div class="spinner spinner-sm"></div>
            <span>Trang ${i}</span>
          </div>
        `;
        flipDiv.appendChild(pageEl);
      }

      // Render ngay lập tức 2 trang đầu để mở sách trong 1 giây
      await renderPageCanvas(pdf, 1, bookWidth, bookHeight);
      if (total >= 2) await renderPageCanvas(pdf, 2, bookWidth, bookHeight);

      if (sessionId !== currentSessionId) return;

      document.getElementById("loading-book").style.display = "none";

      // Khởi tạo thư viện lật sách
      pageFlipInstance = new St.PageFlip(flipDiv, {
        width: Math.round(bookWidth),
        height: Math.round(bookHeight),
        size: "stretch",
        minWidth: 280,
        maxWidth: 1400,
        minHeight: 400,
        maxHeight: 1800,
        maxShadowOpacity: 0.4,
        showCover: true,
        usePortrait: isSingleMode,
        mobileScrollSupport: false
      });

      pageFlipInstance.loadFromHTML(flipDiv.querySelectorAll(".page"));

      pageFlipInstance.on("flip", (e) => {
        const pageNum = e.data + 1;
        document.getElementById("current-page").innerText = pageNum;
        // Tải ưu tiên các trang tiếp theo khi người dùng lật sách
        prioritizePages(pdf, pageNum, total, bookWidth, bookHeight, sessionId);
      });

      // Tải ngầm các trang còn lại dưới nền
      loadRemainingPagesInBackground(pdf, total, bookWidth, bookHeight, sessionId);
    }

    // Vẽ từng trang PDF lên Canvas
    async function renderPageCanvas(pdf, pageNumber, width, height) {
      const container = document.getElementById(`page-container-${pageNumber}`);
      if (!container || container.dataset.rendered === "true") return;

      try {
        const page = await pdf.getPage(pageNumber);
        const canvas = document.getElementById(`canvas-p-${pageNumber}`);
        if (!canvas) return;

        // Render độ nét gấp đôi (DPR 2) để trang chữ/truyện tranh không bị vỡ nét
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const unscaledViewport = page.getViewport({ scale: 1 });
        const scale = (height / unscaledViewport.height) * dpr;
        const viewport = page.getViewport({ scale });

        canvas.width = viewport.width;
        canvas.height = viewport.height;

        const ctx = canvas.getContext("2d");
        await page.render({ canvasContext: ctx, viewport }).promise;

        const loader = document.getElementById(`loader-p-${pageNumber}`);
        if (loader) loader.style.display = "none";
        container.dataset.rendered = "true";
      } catch (e) {
        // Bỏ qua nếu trang bị hủy giữa chừng
      }
    }

    // Tải ngầm tuần tự không gây nghẽn trình duyệt
    async function loadRemainingPagesInBackground(pdf, total, w, h, sessionId) {
      for (let p = 3; p <= total; p++) {
        if (sessionId !== currentSessionId) break;
        await renderPageCanvas(pdf, p, w, h);
        await new Promise(r => setTimeout(r, 60)); // Giãn cách 60ms cho CPU nghỉ
      }
    }

    // Ưu tiên dựng các trang sát bên khi đang lật
    function prioritizePages(pdf, curPage, total, w, h, sessionId) {
      const targetPages = [curPage, curPage + 1, curPage + 2, curPage - 1];
      targetPages.forEach(p => {
        if (p >= 1 && p <= total && sessionId === currentSessionId) {
          renderPageCanvas(pdf, p, w, h);
        }
      });
    }

    // Chuyển đổi giữa 1 trang và 2 trang (Dành cho PC)
    function toggleViewMode() {
      if (!currentBookInfo || !currentPdfDoc) return;
      currentViewMode = currentViewMode === "single" ? "double" : "single";
      
      const btn = document.getElementById("view-mode-btn");
      btn.innerText = currentViewMode === "single" ? "📄 Chế độ: 1 trang" : "📖 Chế độ: 2 trang";

      document.getElementById("loading-book").style.display = "flex";
      destroyCurrentFlipbook();
      setupAndRenderFlipbook(currentPdfDoc, currentSessionId);
    }

    function destroyCurrentFlipbook() {
      if (pageFlipInstance) {
        try { pageFlipInstance.destroy(); } catch (e) {}
        pageFlipInstance = null;
      }
      document.getElementById("book-wrapper").innerHTML = "";
    }

    function prevPage() {
      if (pageFlipInstance) pageFlipInstance.flipPrev();
    }

    function nextPage() {
      if (pageFlipInstance) pageFlipInstance.flipNext();
    }

    function backToShelf() {
      currentSessionId++;
      document.getElementById("reader-view").style.display = "none";
      document.getElementById("shelf-view").style.display = "block";
      destroyCurrentFlipbook();
      currentPdfDoc = null;
      currentBookInfo = null;
    }

    window.addEventListener("DOMContentLoaded", fetchBookList);
  </script>
</body>
</html>
