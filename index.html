<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tủ Sách Điện Tử - Flipbook Reader</title>
  
  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- PageFlip (Hiệu ứng lật trang 3D) -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1.25rem 2rem;
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    h1 { font-size: 1.4rem; font-weight: 600; color: var(--accent); }
    
    /* Giao diện Kệ Sách */
    #shelf-view {
      padding: 2.5rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.8rem;
      margin-top: 1.5rem;
    }
    .book-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      border: 1px solid #334155;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .book-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      border-color: var(--accent);
    }
    .book-cover {
      height: 180px;
      background: linear-gradient(135deg, #1e3a8a, #0369a1);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      margin-bottom: 1rem;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
    }
    .book-title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 0.5rem;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .book-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: auto;
    }

    /* Giao diện Trình đọc Lật sách */
    #reader-view {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 1rem;
    }
    .reader-toolbar {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .btn {
      background: #334155;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
    }
    .btn:hover { background: #475569; }
    .btn-accent { background: var(--accent); color: #0f172a; font-weight: 600; }
    .btn-accent:hover { opacity: 0.9; }

    #book-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 1rem;
    }
    #flipbook {
      display: none;
      box-shadow: 0 12px 30px rgba(0,0,0,0.7);
    }
    .page-canvas {
      width: 100%;
      height: 100%;
      background: #fff;
    }

    /* Loading Spinner */
    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding: 3rem;
      color: var(--text-muted);
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #334155;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <h1>Tủ Sách Trực Tuyến</h1>
    <div id="status-tag" style="font-size: 0.85rem; color: var(--text-muted);">Đang kết nối...</div>
  </header>

  <!-- MÀN HÌNH 1: KỆ SÁCH -->
  <main id="shelf-view">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <h2>Danh mục sách PDF</h2>
      <span id="file-counter" style="color: var(--text-muted);"></span>
    </div>
    <div id="loading-shelf" class="loader">
      <div class="spinner"></div>
      <div>Đang đọc dữ liệu từ Google Drive...</div>
    </div>
    <div id="shelf-grid" class="grid"></div>
  </main>

  <!-- MÀN HÌNH 2: TRÌNH ĐỌC LẬT SÁCH -->
  <div id="reader-view">
    <div class="reader-toolbar">
      <button class="btn" onclick="backToShelf()">← Quay lại kệ sách</button>
      <span id="current-book-name" style="font-weight: 600; max-width: 50%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></span>
      <div style="font-size: 0.9rem;">
        Trang <span id="current-page">1</span> / <span id="total-pages">--</span>
      </div>
    </div>

    <div id="loading-book" class="loader">
      <div class="spinner"></div>
      <div id="loading-progress">Đang tải và dựng trang sách...</div>
    </div>

    <div id="book-wrapper">
      <div id="flipbook"></div>
    </div>

    <div class="reader-toolbar" style="justify-content: center; gap: 1rem;">
      <button class="btn" onclick="prevPage()">‹ Trang trước</button>
      <button class="btn" onclick="nextPage()">Trang sau ›</button>
    </div>
  </div>

  <script>
    // Dán URL Web App triển khai từ Google Apps Script của bạn vào đây:
    const GOOGLE_SCRIPT_URL = "DIEN_WEB_APP_URL_CUA_BAN_VAO_DAY";

    // Khởi tạo PDF.js Worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    let pageFlipInstance = null;

    // 1. Tải danh sách file PDF từ Google Apps Script khi mở trang
    async function fetchBookList() {
      try {
        const response = await fetch(GOOGLE_SCRIPT_URL);
        const res = await response.json();

        document.getElementById("loading-shelf").style.display = "none";

        if (!res.success) {
          alert("Lỗi khi đọc file: " + res.error);
          return;
        }

        const files = res.files || [];
        document.getElementById("file-counter").innerText = `Tổng cộng: ${files.length} cuốn`;
        document.getElementById("status-tag").innerText = "Đã đồng bộ Drive";

        const shelfGrid = document.getElementById("shelf-grid");
        shelfGrid.innerHTML = "";

        files.forEach(file => {
          const card = document.createElement("div");
          card.className = "book-card";
          card.innerHTML = `
            <div class="book-cover">📖</div>
            <div class="book-title" title="${file.name}">${file.name.replace(/\.pdf$/i, '')}</div>
            <div class="book-meta">Dung lượng: ${file.size}</div>
          `;
          card.onclick = () => openBook(file.id, file.name);
          shelfGrid.appendChild(card);
        });

      } catch (err) {
        document.getElementById("loading-shelf").innerHTML = `<div style="color:#ef4444;">Không thể kết nối tới Google Drive. Vui lòng kiểm tra lại Web App URL.</div>`;
      }
    }

    // 2. Tải nội dung PDF và dựng Flipbook
    async function openBook(fileId, fileName) {
      document.getElementById("shelf-view").style.display = "none";
      document.getElementById("reader-view").style.display = "flex";
      document.getElementById("current-book-name").innerText = fileName;
      document.getElementById("loading-book").style.display = "flex";
      document.getElementById("flipbook").style.display = "none";

      if (pageFlipInstance) {
        pageFlipInstance.destroy();
        pageFlipInstance = null;
      }

      try {
        // Tải Base64 PDF qua Web App
        const res = await fetch(`${GOOGLE_SCRIPT_URL}?id=${fileId}`);
        const data = await res.json();
        
        if (!data.success) throw new Error(data.error);

        // Chuyển Base64 sang nhị phân
        const rawData = atob(data.data);
        const uint8Array = new Uint8Array(rawData.length);
        for (let i = 0; i < rawData.length; i++) {
          uint8Array[i] = rawData.charCodeAt(i);
        }

        // Đọc dữ liệu qua PDF.js
        const loadingTask = pdfjsLib.getDocument({ data: uint8Array });
        const pdf = await loadingTask.promise;
        const total = pdf.numPages;
        document.getElementById("total-pages").innerText = total;

        const flipbookContainer = document.getElementById("flipbook");
        flipbookContainer.innerHTML = "";

        // Dựng từng trang thành canvas
        for (let num = 1; num <= total; num++) {
          document.getElementById("loading-progress").innerText = `Đang xử lý trang ${num}/${total}...`;
          const page = await pdf.getPage(num);
          const viewport = page.getViewport({ scale: 1.4 });

          const pageDiv = document.createElement("div");
          pageDiv.className = "page";

          const canvas = document.createElement("canvas");
          canvas.className = "page-canvas";
          canvas.width = viewport.width;
          canvas.height = viewport.height;

          const renderContext = {
            canvasContext: canvas.getContext("2d"),
            viewport: viewport
          };
          await page.render(renderContext).promise;

          pageDiv.appendChild(canvas);
          flipbookContainer.appendChild(pageDiv);
        }

        document.getElementById("loading-book").style.display = "none";
        flipbookContainer.style.display = "block";

        // Khởi tạo trình lật trang PageFlip
        pageFlipInstance = new St.PageFlip(flipbookContainer, {
          width: 480,
          height: 680,
          size: "stretch",
          minWidth: 320,
          maxWidth: 900,
          minHeight: 450,
          maxHeight: 1200,
          maxShadowOpacity: 0.5,
          showCover: true,
          mobileScrollSupport: false
        });

        pageFlipInstance.loadFromHTML(document.querySelectorAll(".page"));
        
        pageFlipInstance.on("flip", (e) => {
          document.getElementById("current-page").innerText = e.data + 1;
        });

      } catch (err) {
        alert("Lỗi tải sách: " + err.message);
        backToShelf();
      }
    }

    function prevPage() {
      if (pageFlipInstance) pageFlipInstance.flipPrev();
    }

    function nextPage() {
      if (pageFlipInstance) pageFlipInstance.flipNext();
    }

    function backToShelf() {
      document.getElementById("reader-view").style.display = "none";
      document.getElementById("shelf-view").style.display = "block";
      if (pageFlipInstance) {
        pageFlipInstance.destroy();
        pageFlipInstance = null;
      }
    }

    // Chạy khi khởi động trang
    window.addEventListener("DOMContentLoaded", fetchBookList);
  </script>
</body>
</html>
