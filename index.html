<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tủ Sách Điện Tử - Flipbook Reader</title>
  
  <!-- PageFlip Engine -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    header {
      height: 50px;
      padding: 0 1.2rem;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      z-index: 20;
    }
    header h1 { 
      font-size: 1.15rem; 
      font-weight: 600; 
      color: var(--accent); 
      cursor: pointer;
      user-select: none;
      transition: opacity 0.2s;
    }
    header h1:hover { opacity: 0.8; text-decoration: underline; }
    
    /* GIAO DIỆN 1: KỆ SÁCH (HOME) */
    #shelf-view {
      padding: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.2rem;
      margin-top: 1.2rem;
    }
    .book-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      border: 1px solid #334155;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .book-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      border-color: var(--accent);
    }
    
    .book-cover {
      height: 230px;
      background: #090e1a;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.8rem;
      overflow: hidden;
      position: relative;
      border: 1px solid #334155;
    }
    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
      transition: transform 0.3s ease;
    }
    .book-card:hover .cover-img { transform: scale(1.04); }

    .book-title {
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 0.4rem;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .book-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: auto;
    }

    /* GIAO DIỆN 2: CHI TIẾT TRUYỆN & CHỌN CHAP */
    #detail-view {
      display: none;
      padding: 1.5rem;
      max-width: 950px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
      flex-direction: column;
      gap: 1.5rem;
    }
    .detail-card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid #334155;
      padding: 1.5rem;
      display: flex;
      gap: 1.8rem;
      box-shadow: 0 15px 30px rgba(0,0,0,0.3);
    }
    .detail-cover-box {
      width: 220px;
      min-width: 220px;
      height: 310px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #475569;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      background: #090e1a;
    }
    .detail-cover-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }
    .detail-info {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
    }
    .detail-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.35;
      margin-bottom: 0.8rem;
    }
    .detail-meta-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
    }
    .meta-tag {
      background: #334155;
      color: var(--accent);
      padding: 0.35rem 0.8rem;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 500;
    }
    .btn-read-start {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #0f172a;
      border: none;
      padding: 0.8rem 1.8rem;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      width: fit-content;
      transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
    }
    .btn-read-start:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.45);
    }

    .chap-section {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid #334155;
      padding: 1.5rem;
    }
    .chap-section-header {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
      padding-bottom: 0.8rem;
    }
    .chap-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 0.75rem;
    }
    .chap-item {
      padding: 0.75rem 0.5rem;
      border-radius: 8px;
      border: 1px solid #334155;
      text-align: center;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      transition: all 0.2s;
      user-select: none;
    }
    .chap-item.unread {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }
    .chap-item.unread:hover { background: #0369a1; transform: translateY(-2px); }
    .chap-item.read {
      background: #1e293b;
      color: #94a3b8;
      border-color: #334155;
    }
    .chap-item.read:hover { background: #334155; color: #ffffff; }

    /* GIAO DIỆN 3: TRÌNH ĐỌC LẬT SÁCH (CANVAS) */
    #reader-view {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: calc(100vh - 50px);
      padding: 0.3rem 0.5rem;
      box-sizing: border-box;
      overflow: hidden;
      position: relative;
    }
    .reader-toolbar {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.2rem 0;
      flex-shrink: 0;
      z-index: 5;
      gap: 0.5rem;
    }
    .btn {
      background: #334155;
      color: white;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: background 0.2s, transform 0.1s;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      white-space: nowrap;
    }
    .btn:hover { background: #475569; }
    .btn-accent { background: var(--accent-hover); }
    .btn-accent:hover { background: #0369a1; }

    /* THANH TRƯỢT ZOOM CHUNG (HỖ TRỢ CẢ MOBILE & PC) */
    .zoom-toolbar {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background: #1e293b;
      padding: 0.25rem 0.6rem;
      border-radius: 8px;
      border: 1px solid #334155;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .zoom-toolbar input[type="range"] {
      width: 90px;
      height: 5px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .zoom-toolbar span {
      font-size: 0.8rem;
      min-width: 40px;
      text-align: center;
      color: var(--accent);
      font-weight: 600;
    }
    .btn-icon {
      background: #334155;
      color: white;
      border: none;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      line-height: 1;
      transition: background 0.2s;
    }
    .btn-icon:hover { background: #475569; }

    /* THANH ĐIỀU HƯỚNG DƯỚI */
    .bottom-bar {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.8rem;
      padding: 0.2rem 0;
      flex-shrink: 0;
      flex-wrap: wrap;
      z-index: 5;
    }

    #book-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1;
      width: 100%;
      min-height: 0;
      overflow: hidden;
      user-select: none;
      touch-action: pan-y;
    }

    #flipbook {
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transform-origin: center center;
      transition: transform 0.05s linear;
    }

    /* Modal Chọn Chapter Nhanh */
    #chap-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(6px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-content {
      background: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 12px;
      width: 100%;
      max-width: 550px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
    }
    .modal-header {
      padding: 1rem 1.2rem;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-body {
      padding: 1rem;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 0.6rem;
    }

    /* Progress UI */
    .progress-box {
      width: 100%;
      max-width: 380px;
      background: #1e293b;
      padding: 1.25rem;
      border-radius: 12px;
      border: 1px solid #334155;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }
    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .progress-track {
      width: 100%;
      height: 8px;
      background: #334155;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      border-radius: 999px;
      transition: width 0.15s ease-out;
    }

    #loading-book-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(8px);
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    @media (max-width: 768px) {
      .detail-card {
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 1.2rem;
      }
      .detail-cover-box {
        width: 180px;
        min-width: 180px;
        height: 250px;
      }
      .detail-info { align-items: center; }
      .detail-meta-tags { justify-content: center; }
      .btn-read-start { width: 100%; justify-content: center; }
    }

    @media (max-width: 600px) {
      header { height: 46px; padding: 0 0.8rem; }
      header h1 { font-size: 1rem; }
      #reader-view { height: calc(100vh - 46px); }
      #current-book-name { max-width: 35% !important; font-size: 0.8rem !important; }
      .reader-toolbar { font-size: 0.8rem !important; }
      .btn { padding: 0.35rem 0.65rem; font-size: 0.78rem; }
      .zoom-toolbar input[type="range"] { width: 65px; }
      .book-cover { height: 190px; }
      .chap-grid, .modal-body { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
    }
  </style>
</head>
<body>

  <header>
    <h1 onclick="backToShelf()" title="Bấm để quay về danh mục sách">Tủ Sách Trực Tuyến</h1>
    <div id="status-tag" style="font-size: 0.8rem; color: var(--text-muted);">Đang kết nối...</div>
  </header>

  <!-- MÀN HÌNH 1: KỆ SÁCH (HOME) -->
  <main id="shelf-view">
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 0.8rem; margin-bottom: 0.5rem;">
      <h2>Danh mục truyện tranh</h2>
      <span id="file-counter" style="color: var(--text-muted); font-size: 0.9rem;"></span>
    </div>

    <div id="loading-shelf" style="display: flex; justify-content: center; padding: 3rem 1rem;">
      <div class="progress-box">
        <div class="progress-header">
          <span id="shelf-prog-text">Đang đồng bộ Google Drive...</span>
          <span id="shelf-prog-pct" style="color: var(--accent);">0%</span>
        </div>
        <div class="progress-track">
          <div id="shelf-prog-bar" class="progress-fill"></div>
        </div>
      </div>
    </div>

    <div id="shelf-grid" class="grid"></div>
  </main>

  <!-- MÀN HÌNH 2: CHI TIẾT TRUYỆN & DANH SÁCH CHAP -->
  <div id="detail-view">
    <div style="display: flex; justify-content: flex-start;">
      <button class="btn" onclick="backToShelf()">← Quay lại kệ sách</button>
    </div>

    <div class="detail-card">
      <div class="detail-cover-box">
        <img id="detail-cover-img" src="" alt="Thumbnail" />
      </div>
      <div class="detail-info">
        <div>
          <div class="detail-title" id="detail-book-title">Tên truyện</div>
          <div class="detail-meta-tags">
            <span class="meta-tag" id="detail-pages-tag">-- trang</span>
            <span class="meta-tag" id="detail-chaps-tag">-- Chap</span>
          </div>
        </div>
        
        <button class="btn-read-start" onclick="readFromBeginning()">
          📖 Đọc từ đầu
        </button>
      </div>
    </div>

    <div class="chap-section">
      <div class="chap-section-header">
        <span>Danh sách Chapter</span>
        <span style="font-size: 0.8rem; color: var(--text-muted); font-weight: 400;">(Mỗi Chap 20 trang)</span>
      </div>
      <div class="chap-grid" id="detail-chap-grid"></div>
    </div>
  </div>

  <!-- MÀN HÌNH 3: TRÌNH ĐỌC LẬT SÁCH (CANVAS ENGINE) -->
  <div id="reader-view">
    <div class="reader-toolbar">
      <button class="btn" onclick="backToDetail()">← Danh mục chap</button>
      <span id="current-book-name" style="font-weight: 600; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></span>
      
      <button class="btn btn-accent" onclick="openChapModal()">
        📚 <span id="current-chap-label">Chap 1</span> ▾
      </button>

      <div style="font-size: 0.85rem;">
        Trang <span id="current-page">1</span>
      </div>
    </div>

    <div id="loading-book-overlay">
      <div class="progress-box">
        <div class="progress-header">
          <span id="book-prog-text">Đang chuẩn bị trang truyện...</span>
          <span id="book-prog-pct" style="color: var(--accent);">0%</span>
        </div>
        <div class="progress-track">
          <div id="book-prog-bar" class="progress-fill"></div>
        </div>
      </div>
    </div>

    <div id="book-wrapper"></div>

    <!-- THANH ĐIỀU HƯỚNG DƯỚI TÍCH HỢP SLIDE ZOOM TIỆN DỤNG -->
    <div class="bottom-bar">
      <button class="btn" onclick="prevPage()">‹ Trang trước</button>
      
      <!-- THANH TRƯỢT ZOOM (SLIDE ZOOM) HOẠT ĐỘNG HOÀN HẢO CẢ MOBILE & PC -->
      <div class="zoom-toolbar">
        <button class="btn-icon" onclick="stepZoom(-0.2)" title="Thu nhỏ">−</button>
        <input type="range" id="zoom-slider" min="1" max="2.5" step="0.05" value="1" oninput="onZoomSlider(this.value)">
        <button class="btn-icon" onclick="stepZoom(0.2)" title="Phóng to">+</button>
        <span id="zoom-val">100%</span>
        <button class="btn-icon" onclick="resetZoom()" title="Về 100%">↺</button>
      </div>

      <button class="btn" onclick="nextPage()">Trang sau ›</button>
    </div>
  </div>

  <!-- POPUP CHỌN CHAPTER NHANH -->
  <div id="chap-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="font-size: 1rem;">Chuyển nhanh Chapter</h3>
        <button class="btn" onclick="closeChapModal()">✕ Đóng</button>
      </div>
      <div class="modal-body" id="modal-chap-grid"></div>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxOwmO8RSpnp9xgWBCBvBkPyVDmtjtuon9nWWNibD_E8FalOFEf7zRQPeeVVTtrM03D-g/exec";
    const PAGES_PER_CHAP = 20;

    let pageFlipInstance = null;
    let currentSessionId = 0;
    let selectedBook = null;
    let allBookPages = [];
    let currentChapImages = [];
    let currentChapIndex = 0;
    let isFlipping = false;

    // Quản lý Zoom & Pan
    let currentZoom = 1;
    let currentPanX = 0;
    let currentPanY = 0;
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;

    // HÀM LẤY ẢNH: KHÔNG GIỚI HẠN SIZE (=s0) ĐỂ ĐẠT CHẤT LƯỢNG NÉT GỐC 100%
    function getDriveImageUrl(fileId, size = 0) {
      if (!size || size === 0) {
        // =s0: Trả về ảnh gốc nguyên bản, không bị nén hay giảm độ phân giải
        return `https://lh3.googleusercontent.com/d/${fileId}=s0`;
      }
      return `https://lh3.googleusercontent.com/d/${fileId}=w${size}`;
    }

    function setShelfProgress(pct, text) {
      document.getElementById("shelf-prog-bar").style.width = pct + "%";
      document.getElementById("shelf-prog-pct").innerText = Math.round(pct) + "%";
      if (text) document.getElementById("shelf-prog-text").innerText = text;
    }

    function setBookProgress(pct, text) {
      document.getElementById("book-prog-bar").style.width = pct + "%";
      document.getElementById("book-prog-pct").innerText = Math.round(pct) + "%";
      if (text) document.getElementById("book-prog-text").innerText = text;
    }

    function getReadChapters(bookId) {
      try {
        const data = localStorage.getItem(`read_chaps_${bookId}`);
        return data ? JSON.parse(data) : [];
      } catch (e) { return []; }
    }

    function markChapAsRead(bookId, chapIndex) {
      if (!bookId) return;
      const readList = getReadChapters(bookId);
      if (!readList.includes(chapIndex)) {
        readList.push(chapIndex);
        try {
          localStorage.setItem(`read_chaps_${bookId}`, JSON.stringify(readList));
        } catch (e) {}
      }
    }

    function preloadSingleImage(url) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = resolve;
        img.onerror = resolve;
        img.src = url;
      });
    }

    // 1. TẢI KỆ SÁCH (MỖI LẦN RELOAD LUÔN QUÉT DRIVE ĐỂ CẬP NHẬT TRUYỆN MỚI)
    async function fetchBookList() {
      document.getElementById("loading-shelf").style.display = "flex";
      setShelfProgress(35, "Đang đồng bộ từ Google Drive...");
      document.getElementById("status-tag").innerText = "Đang kiểm tra Drive...";

      try {
        const fetchUrl = `${GOOGLE_SCRIPT_URL}?refresh=1&t=${Date.now()}`;
        const response = await fetch(fetchUrl);
        const res = await response.json();

        if (!res.success) throw new Error(res.error);

        const books = res.books || [];
        renderBookGrid(books);
        
        document.getElementById("loading-shelf").style.display = "none";
        document.getElementById("status-tag").innerText = "Đã cập nhật mới nhất";

      } catch (err) {
        document.getElementById("loading-shelf").innerHTML = `<div style="color:#ef4444; text-align:center;">Lỗi nạp danh mục: ${err.message}</div>`;
      }
    }

    function renderBookGrid(books) {
      document.getElementById("file-counter").innerText = `Tổng cộng: ${books.length} bộ`;
      const shelfGrid = document.getElementById("shelf-grid");
      shelfGrid.innerHTML = "";

      books.forEach(book => {
        const card = document.createElement("div");
        card.className = "book-card";
        const thumbSrc = book.thumbId ? getDriveImageUrl(book.thumbId, 600) : "";

        card.innerHTML = `
          <div class="book-cover">
            ${book.thumbId ? `
              <img id="shelf-thumb-${book.id}"
                   src="${thumbSrc}" 
                   alt="${book.name}" 
                   class="cover-img" 
                   loading="lazy" 
                   onerror="this.style.display='none';" />
            ` : ''}
          </div>
          <div class="book-title" title="${book.name}">${book.name}</div>
          <div class="book-meta">${book.pageCount} trang • ${Math.ceil(book.pageCount / PAGES_PER_CHAP)} Chap</div>
        `;
        card.onclick = () => openBookDetail(book);
        shelfGrid.appendChild(card);
      });
    }

    // 2. Chi tiết truyện
    function openBookDetail(book) {
      selectedBook = book;

      document.getElementById("shelf-view").style.display = "none";
      document.getElementById("reader-view").style.display = "none";
      document.getElementById("detail-view").style.display = "flex";

      document.getElementById("detail-book-title").innerText = book.name;
      document.getElementById("detail-pages-tag").innerText = `${book.pageCount} trang`;
      
      const totalChaps = Math.max(1, Math.ceil(book.pageCount / PAGES_PER_CHAP));
      document.getElementById("detail-chaps-tag").innerText = `${totalChaps} Chap`;

      const coverImg = document.getElementById("detail-cover-img");
      if (book.thumbId) {
        coverImg.src = getDriveImageUrl(book.thumbId, 0); // Ảnh bìa chất lượng gốc
        coverImg.style.display = "block";
      } else {
        coverImg.style.display = "none";
      }

      renderDetailChapGrid(book.id, totalChaps, book.pageCount);
      window.scrollTo(0, 0);

      prefetchBookPages(book);
    }

    async function prefetchBookPages(book) {
      try {
        const res = await fetch(`${GOOGLE_SCRIPT_URL}?folderId=${book.id}&t=${Date.now()}`);
        const data = await res.json();
        if (data.success && data.pages && data.pages.length > 0) {
          const trueFirstThumbId = data.pages[0].id;
          const trueThumbUrl = getDriveImageUrl(trueFirstThumbId, 0);
          
          const coverImg = document.getElementById("detail-cover-img");
          if (coverImg) {
            coverImg.src = trueThumbUrl;
            coverImg.style.display = "block";
          }
          const shelfImg = document.getElementById(`shelf-thumb-${book.id}`);
          if (shelfImg) {
            shelfImg.src = getDriveImageUrl(trueFirstThumbId, 600);
          }
        }
      } catch (e) {}
    }

    function renderDetailChapGrid(bookId, totalChaps, totalPages) {
      const grid = document.getElementById("detail-chap-grid");
      grid.innerHTML = "";
      const readList = getReadChapters(bookId);

      for (let c = 0; c < totalChaps; c++) {
        const startP = c * PAGES_PER_CHAP + 1;
        const endP = Math.min(totalPages, (c + 1) * PAGES_PER_CHAP);
        const isRead = readList.includes(c);

        const btn = document.createElement("div");
        btn.className = `chap-item ${isRead ? 'read' : 'unread'}`;
        btn.innerHTML = `
          <div>Chap ${c + 1}</div>
          <div style="font-size: 0.72rem; opacity: 0.85; margin-top:3px; font-weight:400;">(Trang ${startP}-${endP})</div>
        `;
        btn.onclick = () => startReadingChapter(c);
        grid.appendChild(btn);
      }
    }

    function readFromBeginning() {
      startReadingChapter(0);
    }

    // 3. Mở đọc truyện với ảnh chất lượng cao
    async function startReadingChapter(chapIdx = 0) {
      if (!selectedBook) return;

      const sessionId = ++currentSessionId;
      currentChapIndex = chapIdx;
      isFlipping = false;
      resetZoom();

      document.getElementById("detail-view").style.display = "none";
      document.getElementById("reader-view").style.display = "flex";
      document.getElementById("current-book-name").innerText = selectedBook.name;
      document.getElementById("current-chap-label").innerText = `Chap ${chapIdx + 1}`;

      const overlay = document.getElementById("loading-book-overlay");
      overlay.style.display = "flex";

      const bookWrapper = document.getElementById("book-wrapper");
      bookWrapper.innerHTML = "";
      if (pageFlipInstance) {
        try { pageFlipInstance.destroy(); } catch (e) {}
        pageFlipInstance = null;
      }

      setBookProgress(30, "Đang nạp cấu trúc trang tranh...");

      try {
        const response = await fetch(`${GOOGLE_SCRIPT_URL}?folderId=${selectedBook.id}&t=${Date.now()}`);
        if (!response.ok) throw new Error("HTTP " + response.status);
        const res = await response.json();
        if (!res.success) throw new Error(res.error);

        if (sessionId !== currentSessionId) return;

        allBookPages = res.pages || [];
        const totalAll = allBookPages.length;
        if (totalAll === 0) throw new Error("Thư mục truyện không có ảnh nào.");

        const startGlobal = chapIdx * PAGES_PER_CHAP;
        const endGlobal = Math.min(totalAll, (chapIdx + 1) * PAGES_PER_CHAP);
        const chapSlice = allBookPages.slice(startGlobal, endGlobal);

        // NẠP ẢNH CHẤT LƯỢNG GỐC (=s0) KHÔNG BỊ BÓP SIZE
        currentChapImages = chapSlice.map(p => getDriveImageUrl(p.id, 0));
        const chapTotal = currentChapImages.length;

        setBookProgress(70, "Đang mở trang sách...");

        let pageRatio = 0.707;
        const thumbImg = document.getElementById("detail-cover-img");
        if (thumbImg && thumbImg.naturalWidth && thumbImg.naturalHeight) {
          pageRatio = thumbImg.naturalWidth / thumbImg.naturalHeight;
        }

        const isMobile = (window.innerWidth < 768) || (window.innerWidth < window.innerHeight);
        const headerH = 50;
        const toolbarsH = 80;
        const availH = Math.max(window.innerHeight - headerH - toolbarsH - 12, 280);
        const availW = Math.max(window.innerWidth - 16, 260);

        let singlePageW, singlePageH;
        if (isMobile) {
          if (availW / availH > pageRatio) {
            singlePageH = Math.floor(availH);
            singlePageW = Math.floor(singlePageH * pageRatio);
          } else {
            singlePageW = Math.floor(availW);
            singlePageH = Math.floor(singlePageW / pageRatio);
          }
        } else {
          const spreadRatio = 2 * pageRatio;
          let spreadW, spreadH;
          if (availW / availH > spreadRatio) {
            spreadH = Math.floor(availH);
            spreadW = Math.floor(spreadH * spreadRatio);
          } else {
            spreadW = Math.floor(availW);
            spreadH = Math.floor(spreadW / spreadRatio);
          }
          singlePageW = Math.floor(spreadW / 2);
          singlePageH = Math.floor(spreadH);
        }

        const flipbookContainer = document.createElement("div");
        flipbookContainer.id = "flipbook";
        
        if (isMobile) {
          flipbookContainer.style.width = singlePageW + "px";
          flipbookContainer.style.height = singlePageH + "px";
        } else {
          flipbookContainer.style.width = (singlePageW * 2) + "px";
          flipbookContainer.style.height = singlePageH + "px";
        }
        bookWrapper.appendChild(flipbookContainer);

        const initialLoads = [preloadSingleImage(currentChapImages[0])];
        if (chapTotal > 1) initialLoads.push(preloadSingleImage(currentChapImages[1]));
        await Promise.all(initialLoads);

        if (sessionId !== currentSessionId) return;
        setBookProgress(100, "Sẵn sàng!");

        pageFlipInstance = new St.PageFlip(flipbookContainer, {
          width: singlePageW,
          height: singlePageH,
          size: "fixed",
          minWidth: 150,
          maxWidth: 2500,
          minHeight: 150,
          maxHeight: 2500,
          maxShadowOpacity: 0.35,
          showCover: false,
          mobileScrollSupport: false,
          usePortrait: isMobile,
          startPage: 0
        });

        pageFlipInstance.loadFromImages(currentChapImages);
        updatePageUI(0, isMobile);
        markChapAsRead(selectedBook.id, chapIdx);

        pageFlipInstance.on("changeState", (e) => {
          if (e.data === "read") {
            isFlipping = false;
          } else if (e.data === "flipping" || e.data === "user_fold") {
            isFlipping = true;
          }
        });

        pageFlipInstance.on("flip", (e) => {
          const curIndex = e.data;
          updatePageUI(curIndex, isMobile);
        });

        setTimeout(() => {
          if (sessionId === currentSessionId) {
            overlay.style.display = "none";
          }
        }, 120);

        (async () => {
          for (let i = 2; i < chapTotal; i++) {
            if (sessionId !== currentSessionId) break;
            const img = new Image();
            img.src = currentChapImages[i];
            await new Promise(r => setTimeout(r, 150));
          }
        })();

      } catch (err) {
        if (sessionId === currentSessionId) {
          alert("Lỗi tải truyện: " + err.message);
          backToDetail();
        }
      }
    }

    function updatePageUI(curIndex, isMobile) {
      const pageSpan = document.getElementById("current-page");
      const globalStart = currentChapIndex * PAGES_PER_CHAP;
      const totalAll = allBookPages.length;

      if (isMobile) {
        const globalPage = globalStart + curIndex + 1;
        pageSpan.innerText = `${curIndex + 1}/${currentChapImages.length} (Trang gốc: ${globalPage}/${totalAll})`;
      } else {
        const leftP = curIndex + 1;
        const rightP = curIndex + 2;
        const globalLeft = globalStart + leftP;
        const globalRight = globalStart + rightP;

        if (rightP <= currentChapImages.length) {
          pageSpan.innerText = `${leftP}-${rightP}/${currentChapImages.length} (Trang gốc: ${globalLeft}-${globalRight}/${totalAll})`;
        } else {
          pageSpan.innerText = `${leftP}/${currentChapImages.length} (Trang gốc: ${globalLeft}/${totalAll})`;
        }
      }
    }

    // ==============================================================
    // CƠ CHẾ SLIDE ZOOM (THANH TRƯỢT) & KÉO ẢNH (KHÔNG NHẦM VỚI TOUCH)
    // ==============================================================
    function applyZoomTransform() {
      const flipbook = document.getElementById("flipbook");
      if (!flipbook) return;

      clampPan();

      if (currentZoom <= 1.02) {
        currentZoom = 1;
        currentPanX = 0;
        currentPanY = 0;
        flipbook.style.transform = "";
        flipbook.style.cursor = "";
      } else {
        flipbook.style.transform = `translate(${currentPanX}px, ${currentPanY}px) scale(${currentZoom})`;
        flipbook.style.cursor = isDragging ? "grabbing" : "grab";
      }

      const slider = document.getElementById("zoom-slider");
      const label = document.getElementById("zoom-val");
      if (slider) slider.value = currentZoom;
      if (label) label.innerText = Math.round(currentZoom * 100) + "%";
    }

    function clampPan() {
      if (currentZoom <= 1) {
        currentPanX = 0;
        currentPanY = 0;
        return;
      }
      const flipbook = document.getElementById("flipbook");
      if (!flipbook) return;
      const maxPanX = (flipbook.offsetWidth * (currentZoom - 1)) / 2 + 100;
      const maxPanY = (flipbook.offsetHeight * (currentZoom - 1)) / 2 + 100;
      currentPanX = Math.max(-maxPanX, Math.min(maxPanX, currentPanX));
      currentPanY = Math.max(-maxPanY, Math.min(maxPanY, currentPanY));
    }

    // Điều khiển bằng thanh kéo Slider
    function onZoomSlider(val) {
      currentZoom = parseFloat(val);
      applyZoomTransform();
    }

    function stepZoom(delta) {
      currentZoom = Math.max(1, Math.min(2.5, currentZoom + delta));
      applyZoomTransform();
    }

    function resetZoom() {
      currentZoom = 1;
      currentPanX = 0;
      currentPanY = 0;
      applyZoomTransform();
    }

    // XỬ LÝ CHUỘT TRÊN PC KHI ZOOM
    const bookWrapper = document.getElementById("book-wrapper");

    bookWrapper.addEventListener("mousedown", (e) => {
      if (currentZoom > 1.02) {
        isDragging = true;
        dragStartX = e.clientX - currentPanX;
        dragStartY = e.clientY - currentPanY;
        applyZoomTransform();
        e.preventDefault();
      }
    });

    window.addEventListener("mousemove", (e) => {
      if (isDragging && currentZoom > 1.02) {
        currentPanX = e.clientX - dragStartX;
        currentPanY = e.clientY - dragStartY;
        applyZoomTransform();
      }
    });

    window.addEventListener("mouseup", () => {
      if (isDragging) {
        isDragging = false;
        applyZoomTransform();
      }
    });

    // XỬ LÝ CẢM ỨNG TRÊN MOBILE:
    // - Khi Zoom = 100%: 1 ngón chạm / vuốt là LẬT TRANG (Hoàn toàn không nhầm với Zoom)
    // - Khi Zoom > 100%: 1 ngón tay dùng để KÉO TRANH (Pan) để đọc chữ chi tiết
    let touchStartX = 0, touchStartY = 0, touchStartTime = 0, touchMoved = false;

    bookWrapper.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        if (currentZoom > 1.02) {
          isDragging = true;
          dragStartX = e.touches[0].clientX - currentPanX;
          dragStartY = e.touches[0].clientY - currentPanY;
        } else {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          touchStartTime = Date.now();
          touchMoved = false;
        }
      }
    }, { passive: false });

    bookWrapper.addEventListener("touchmove", (e) => {
      if (e.touches.length === 1) {
        if (currentZoom > 1.02 && isDragging) {
          currentPanX = e.touches[0].clientX - dragStartX;
          currentPanY = e.touches[0].clientY - dragStartY;
          applyZoomTransform();
          e.preventDefault();
        } else {
          const diffX = e.touches[0].clientX - touchStartX;
          const diffY = e.touches[0].clientY - touchStartY;
          if (Math.abs(diffX) > 10 || Math.abs(diffY) > 10) touchMoved = true;
        }
      }
    }, { passive: false });

    bookWrapper.addEventListener("touchend", (e) => {
      if (currentZoom > 1.02) {
        isDragging = false;
        return;
      }

      // Xử lý lật trang khi ở tỉ lệ 100%
      if (e.changedTouches.length === 1 && touchStartTime > 0) {
        const touchEndX = e.changedTouches[0].clientX;
        const touchEndY = e.changedTouches[0].clientY;
        const diffX = touchEndX - touchStartX;
        const diffY = touchEndY - touchStartY;
        const duration = Date.now() - touchStartTime;
        touchStartTime = 0;

        // 1. Vuốt ngang (Swipe)
        if (Math.abs(diffX) > 35 && Math.abs(diffX) > Math.abs(diffY) && duration < 500) {
          if (diffX < 0) nextPage();
          else prevPage();
          return;
        }

        // 2. Chạm nhẹ (Tap)
        if (!touchMoved || (Math.abs(diffX) < 15 && Math.abs(diffY) < 15 && duration < 400)) {
          const rect = bookWrapper.getBoundingClientRect();
          const tapX = touchEndX - rect.left;
          if (tapX < rect.width * 0.3) prevPage();
          else nextPage();
        }
      }
    });

    // ==========================================
    // ĐIỀU HƯỚNG TRANG & CHAPTER
    // ==========================================
    function openChapModal() {
      if (!allBookPages.length) return;
      const totalChaps = Math.ceil(allBookPages.length / PAGES_PER_CHAP);
      const readList = getReadChapters(selectedBook.id);

      const grid = document.getElementById("modal-chap-grid");
      grid.innerHTML = "";

      for (let c = 0; c < totalChaps; c++) {
        const startP = c * PAGES_PER_CHAP + 1;
        const endP = Math.min(allBookPages.length, (c + 1) * PAGES_PER_CHAP);
        const isRead = readList.includes(c);
        const isActive = (c === currentChapIndex);

        const btn = document.createElement("div");
        btn.className = `chap-item ${isRead ? 'read' : 'unread'} ${isActive ? 'active' : ''}`;
        btn.innerHTML = `
          <div>Chap ${c + 1}</div>
          <div style="font-size: 0.72rem; opacity: 0.85; margin-top:3px; font-weight:400;">(Trang ${startP}-${endP})</div>
        `;
        btn.onclick = () => {
          closeChapModal();
          startReadingChapter(c);
        };
        grid.appendChild(btn);
      }

      document.getElementById("chap-modal").style.display = "flex";
    }

    function closeChapModal() {
      document.getElementById("chap-modal").style.display = "none";
    }

    function prevPage() {
      if (!pageFlipInstance || isFlipping) return;
      if (document.getElementById("reader-view").style.display === "flex") {
        try {
          isFlipping = true;
          pageFlipInstance.flipPrev();
          setTimeout(() => { isFlipping = false; }, 400);
        } catch (e) { isFlipping = false; }
      }
    }

    function nextPage() {
      if (!pageFlipInstance || isFlipping) return;
      if (document.getElementById("reader-view").style.display === "flex") {
        try {
          const cur = pageFlipInstance.getCurrentPageIndex();
          const isMobile = window.innerWidth < 768;
          const isAtEnd = isMobile ? (cur >= currentChapImages.length - 1) : (cur >= currentChapImages.length - 2);

          if (isAtEnd) {
            const totalChaps = Math.ceil(allBookPages.length / PAGES_PER_CHAP);
            if (currentChapIndex + 1 < totalChaps) {
              if (confirm(`Bạn đã đọc hết Chap ${currentChapIndex + 1}. Chuyển sang Chap ${currentChapIndex + 2}?`)) {
                startReadingChapter(currentChapIndex + 1);
              }
              return;
            }
          }

          isFlipping = true;
          pageFlipInstance.flipNext();
          setTimeout(() => { isFlipping = false; }, 400);
        } catch (e) { isFlipping = false; }
      }
    }

    window.addEventListener("keydown", (e) => {
      if (document.getElementById("reader-view").style.display === "flex") {
        if (e.key === "ArrowLeft") prevPage();
        if (e.key === "ArrowRight") nextPage();
      }
    });

    function backToDetail() {
      currentSessionId++;
      isFlipping = false;
      resetZoom();
      document.getElementById("reader-view").style.display = "none";
      
      const bookWrapper = document.getElementById("book-wrapper");
      bookWrapper.innerHTML = "";

      if (pageFlipInstance) {
        try { pageFlipInstance.destroy(); } catch (e) {}
        pageFlipInstance = null;
      }
      currentChapImages = [];

      if (selectedBook) {
        openBookDetail(selectedBook);
      } else {
        backToShelf();
      }
    }

    function backToShelf() {
      currentSessionId++;
      isFlipping = false;
      resetZoom();
      document.getElementById("reader-view").style.display = "none";
      document.getElementById("detail-view").style.display = "none";
      document.getElementById("shelf-view").style.display = "block";

      const bookWrapper = document.getElementById("book-wrapper");
      bookWrapper.innerHTML = "";

      if (pageFlipInstance) {
        try { pageFlipInstance.destroy(); } catch (e) {}
        pageFlipInstance = null;
      }
      currentChapImages = [];
      selectedBook = null;
    }

    // Tự động kiểm tra và làm mới từ Drive mỗi lần mở hoặc reload trang web
    window.addEventListener("DOMContentLoaded", fetchBookList);
  </script>
