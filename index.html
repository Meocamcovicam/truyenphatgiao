<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tủ Sách Điện Tử - Flipbook Reader</title>
  
  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- PageFlip -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    header {
      height: 52px;
      padding: 0 1.5rem;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      z-index: 20;
    }
    /* Tiêu đề có thể click để quay về kệ sách */
    header h1 { 
      font-size: 1.25rem; 
      font-weight: 600; 
      color: var(--accent); 
      cursor: pointer;
      user-select: none;
      transition: opacity 0.2s;
    }
    header h1:hover {
      opacity: 0.8;
      text-decoration: underline;
    }
    
    /* Giao diện Kệ Sách */
    #shelf-view {
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.5rem;
      margin-top: 1.2rem;
    }
    .book-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      border: 1px solid #334155;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .book-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      border-color: var(--accent);
    }
    .book-cover {
      height: 180px;
      background: linear-gradient(135deg, #1e3a8a, #0369a1);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      margin-bottom: 1rem;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
    }
    .book-title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 0.5rem;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .book-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: auto;
    }

    /* Giao diện Trình đọc Lật sách */
    #reader-view {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: calc(100vh - 52px);
      padding: 0.4rem 1rem 0.6rem;
      box-sizing: border-box;
      overflow: hidden;
    }
    .reader-toolbar {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.2rem 0;
      flex-shrink: 0;
      z-index: 5;
    }
    .btn {
      background: #334155;
      color: white;
      border: none;
      padding: 0.45rem 1.1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
    }
    .btn:hover { background: #475569; }

    /* Khung chứa sách - Tự động co giãn theo chiều dọc */
    #book-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1;
      width: 100%;
      min-height: 0; /* Ngăn chặn flex con làm tràn chiều cao */
      overflow: hidden;
    }
    
    .page-box {
      background-color: #ffffff;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .page-box canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .page-skeleton {
      color: #64748b;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0.5rem;
    }

    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding: 3rem;
      color: var(--text-muted);
    }
    .spinner {
      width: 38px;
      height: 38px;
      border: 4px solid #334155;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <!-- Nhấp vào tiêu đề để trở lại kệ sách -->
    <h1 onclick="backToShelf()" title="Bấm để quay về danh mục sách">Tủ Sách Trực Tuyến</h1>
    <div id="status-tag" style="font-size: 0.85rem; color: var(--text-muted);">Đang kết nối...</div>
  </header>

  <!-- MÀN HÌNH 1: KỆ SÁCH -->
  <main id="shelf-view">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <h2>Danh mục sách PDF</h2>
      <span id="file-counter" style="color: var(--text-muted);"></span>
    </div>
    <div id="loading-shelf" class="loader">
      <div class="spinner"></div>
      <div>Đang đọc dữ liệu từ Google Drive...</div>
    </div>
    <div id="shelf-grid" class="grid"></div>
  </main>

  <!-- MÀN HÌNH 2: TRÌNH ĐỌC LẬT SÁCH -->
  <div id="reader-view">
    <div class="reader-toolbar">
      <button class="btn" onclick="backToShelf()">← Quay lại kệ sách</button>
      <span id="current-book-name" style="font-weight: 600; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></span>
      <div style="font-size: 0.9rem;">
        Trang <span id="current-page">1</span> / <span id="total-pages">--</span>
      </div>
    </div>

    <!-- Spinner khi đang tải dữ liệu sách -->
    <div id="loading-book" class="loader" style="flex: 1; justify-content: center;">
      <div class="spinner"></div>
      <div id="loading-progress">Đang nạp dữ liệu cuốn sách...</div>
    </div>

    <!-- Vùng hiển thị sách -->
    <div id="book-wrapper"></div>

    <div class="reader-toolbar" style="justify-content: center; gap: 1.5rem;">
      <button class="btn" onclick="prevPage()">‹ Trang trước</button>
      <button class="btn" onclick="nextPage()">Trang sau ›</button>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxOwmO8RSpnp9xgWBCBvBkPyVDmtjtuon9nWWNibD_E8FalOFEf7zRQPeeVVTtrM03D-g/exec";
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    let pageFlipInstance = null;
    let currentSessionId = 0;
    let currentPdfDoc = null;
    let renderedPageSet = new Set();

    // 1. Tải danh mục sách từ Google Apps Script
    async function fetchBookList() {
      try {
        const response = await fetch(GOOGLE_SCRIPT_URL);
        const res = await response.json();

        document.getElementById("loading-shelf").style.display = "none";
        if (!res.success) {
          alert("Lỗi từ Drive: " + res.error);
          return;
        }

        const files = res.files || [];
        document.getElementById("file-counter").innerText = `Tổng cộng: ${files.length} cuốn`;
        document.getElementById("status-tag").innerText = "Đã đồng bộ Drive";

        const shelfGrid = document.getElementById("shelf-grid");
        shelfGrid.innerHTML = "";

        files.forEach(file => {
          const card = document.createElement("div");
          card.className = "book-card";
          card.innerHTML = `
            <div class="book-cover">📖</div>
            <div class="book-title" title="${file.name}">${file.name.replace(/\.pdf$/i, '')}</div>
            <div class="book-meta">Dung lượng: ${file.size}</div>
          `;
          card.onclick = () => openBook(file.id, file.name);
          shelfGrid.appendChild(card);
        });

      } catch (err) {
        document.getElementById("loading-shelf").innerHTML = `<div style="color:#ef4444;">Không thể nạp dữ liệu. Vui lòng kiểm tra lại kết nối mạng.</div>`;
      }
    }

    // 2. Render từng trang độc lập (Tối ưu độ nét theo đúng kích thước hiển thị)
    async function renderSinglePage(pdf, pageNum, containerDiv, targetPageH, sessionId) {
      if (sessionId !== currentSessionId || renderedPageSet.has(pageNum)) return;
      renderedPageSet.add(pageNum);

      try {
        const page = await pdf.getPage(pageNum);
        const baseVp = page.getViewport({ scale: 1 });
        
        // Scale nét gấp đôi (2x) để chống mờ trên màn hình Retina / Full HD
        const scale = (targetPageH / baseVp.height) * 2.0;
        const viewport = page.getViewport({ scale: Math.max(scale, 1.5) });

        const canvas = document.createElement("canvas");
        canvas.width = viewport.width;
        canvas.height = viewport.height;

        const renderContext = {
          canvasContext: canvas.getContext("2d"),
          viewport: viewport
        };

        await page.render(renderContext).promise;

        if (sessionId === currentSessionId) {
          containerDiv.innerHTML = "";
          containerDiv.appendChild(canvas);
        }
      } catch (e) {
        console.error("Lỗi dựng trang:", pageNum, e);
      }
    }

    // 3. Mở sách & Tính toán kích thước vừa vặn 100% không mất hình
    async function openBook(fileId, fileName) {
      const sessionId = ++currentSessionId;
      renderedPageSet.clear();

      document.getElementById("shelf-view").style.display = "none";
      document.getElementById("reader-view").style.display = "flex";
      document.getElementById("current-book-name").innerText = fileName;
      document.getElementById("loading-book").style.display = "flex";
      document.getElementById("loading-progress").innerText = "Đang tải dữ liệu...";

      const bookWrapper = document.getElementById("book-wrapper");
      bookWrapper.innerHTML = "";
      if (pageFlipInstance) {
        try { pageFlipInstance.destroy(); } catch (e) {}
        pageFlipInstance = null;
      }

      try {
        const res = await fetch(`${GOOGLE_SCRIPT_URL}?id=${fileId}`);
        const data = await res.json();
        if (sessionId !== currentSessionId) return;
        if (!data.success) throw new Error(data.error);

        // Chuyển Base64 sang binary
        const rawData = atob(data.data);
        const uint8Array = new Uint8Array(rawData.length);
        for (let i = 0; i < rawData.length; i++) {
          uint8Array[i] = rawData.charCodeAt(i);
        }

        const loadingTask = pdfjsLib.getDocument({ data: uint8Array });
        currentPdfDoc = await loadingTask.promise;
        const total = currentPdfDoc.numPages;
        document.getElementById("total-pages").innerText = total;

        // Lấy tỷ lệ gốc của trang PDF
        const firstPage = await currentPdfDoc.getPage(1);
        const defaultVp = firstPage.getViewport({ scale: 1 });
        const pageRatio = defaultVp.width / defaultVp.height;

        // Đo khoảng trống thực tế trong #book-wrapper
        const wrapperRect = bookWrapper.getBoundingClientRect();
        const maxAvailW = Math.max(wrapperRect.width - 24, 300);
        const maxAvailH = Math.max(wrapperRect.height - 16, 300);

        // Kiểm tra xem là màn hình điện thoại (đơn trang) hay máy tính (đôi trang)
        const isMobile = window.innerWidth < 768;
        const pagesVisible = isMobile ? 1 : 2;
        const spreadRatio = pagesVisible * pageRatio;

        let finalSpreadW, finalSpreadH;

        // Khóa tỷ lệ để sách không bao giờ tràn chiều cao hoặc chiều ngang
        if (maxAvailW / maxAvailH > spreadRatio) {
          // Chiều cao là giới hạn chính -> khống chế theo chiều cao
          finalSpreadH = maxAvailH;
          finalSpreadW = finalSpreadH * spreadRatio;
        } else {
          // Chiều rộng là giới hạn chính -> khống chế theo chiều rộng
          finalSpreadW = maxAvailW;
          finalSpreadH = finalSpreadW / spreadRatio;
        }

        const singlePageW = Math.floor(finalSpreadW / pagesVisible);
        const singlePageH = Math.floor(finalSpreadH);

        // Tạo thẻ chứa lật sách
        const flipbookContainer = document.createElement("div");
        flipbookContainer.id = "flipbook";
        bookWrapper.appendChild(flipbookContainer);

        // Tạo khung placeholder cho tất cả các trang
        const pageDivs = [];
        for (let i = 1; i <= total; i++) {
          const pDiv = document.createElement("div");
          pDiv.className = "page-box";
          pDiv.innerHTML = `<div class="page-skeleton"><div class="spinner" style="width:20px;height:20px;border-width:2px;"></div>Trang ${i}</div>`;
          flipbookContainer.appendChild(pDiv);
          pageDivs.push(pDiv);
        }

        // Tải trước 2 trang đầu để mở ngay lập tức
        document.getElementById("loading-progress").innerText = "Chuẩn bị trang sách...";
        await renderSinglePage(currentPdfDoc, 1, pageDivs[0], singlePageH, sessionId);
        if (total >= 2) {
          await renderSinglePage(currentPdfDoc, 2, pageDivs[1], singlePageH, sessionId);
        }

        if (sessionId !== currentSessionId) return;

        document.getElementById("loading-book").style.display = "none";

        // Khởi tạo Flipbook với kích thước cố định đã được tính chuẩn xác
        pageFlipInstance = new St.PageFlip(flipbookContainer, {
          width: singlePageW,
          height: singlePageH,
          size: "fixed", // Cố định kích thước chuẩn xác, triệt tiêu lỗi mất hình
          minWidth: 200,
          maxWidth: 2000,
          minHeight: 200,
          maxHeight: 2000,
          maxShadowOpacity: 0.4,
          showCover: true,
          mobileScrollSupport: false,
          usePortrait: isMobile
        });

        pageFlipInstance.loadFromHTML(pageDivs);

        // Lật trang: Render trước các trang liền kề
        pageFlipInstance.on("flip", (e) => {
          const currentPageIndex = e.data;
          document.getElementById("current-page").innerText = currentPageIndex + 1;

          for (let p = Math.max(1, currentPageIndex - 1); p <= Math.min(total, currentPageIndex + 4); p++) {
            renderSinglePage(currentPdfDoc, p, pageDivs[p - 1], singlePageH, sessionId);
          }
        });

        // Hàng đợi render ngầm các trang còn lại
        (async () => {
          for (let p = 3; p <= total; p++) {
            if (sessionId !== currentSessionId) break;
            await renderSinglePage(currentPdfDoc, p, pageDivs[p - 1], singlePageH, sessionId);
          }
        })();

      } catch (err) {
        if (sessionId === currentSessionId) {
          alert("Lỗi tải sách: " + err.message);
          backToShelf();
        }
      }
    }

    function prevPage() {
      if (pageFlipInstance) pageFlipInstance.flipPrev();
    }

    function nextPage() {
      if (pageFlipInstance) pageFlipInstance.flipNext();
    }

    // Điều hướng bằng mũi tên trái / phải trên bàn phím
    window.addEventListener("keydown", (e) => {
      if (document.getElementById("reader-view").style.display === "flex") {
        if (e.key === "ArrowLeft") prevPage();
        if (e.key === "ArrowRight") nextPage();
      }
    });

    // Quay lại màn hình kệ sách
    function backToShelf() {
      currentSessionId++;
      document.getElementById("reader-view").style.display = "none";
      document.getElementById("shelf-view").style.display = "block";

      const bookWrapper = document.getElementById("book-wrapper");
      bookWrapper.innerHTML = "";

      if (pageFlipInstance) {
        try { pageFlipInstance.destroy(); } catch (e) {}
        pageFlipInstance = null;
      }
      currentPdfDoc = null;
    }

    window.addEventListener("DOMContentLoaded", fetchBookList);
  </script>
</body>
</html>
