<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tủ Sách Điện Tử - Flipbook Reader</title>
  
  <!-- PageFlip (Hiệu ứng lật sách 3D) -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    header {
      height: 50px;
      padding: 0 1.2rem;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      z-index: 20;
    }
    header h1 { 
      font-size: 1.15rem; 
      font-weight: 600; 
      color: var(--accent); 
      cursor: pointer;
      user-select: none;
      transition: opacity 0.2s;
    }
    header h1:hover {
      opacity: 0.8;
      text-decoration: underline;
    }
    
    /* Giao diện Kệ Sách */
    #shelf-view {
      padding: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.4rem;
      margin-top: 1.2rem;
    }
    .book-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      border: 1px solid #334155;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .book-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      border-color: var(--accent);
    }
    
    /* Thumbnail ảnh đầu tiên */
    .book-cover {
      height: 250px;
      background: #090e1a;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.8rem;
      overflow: hidden;
      position: relative;
      border: 1px solid #334155;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
      transition: transform 0.3s ease;
    }
    .book-card:hover .cover-img {
      transform: scale(1.04);
    }
    .cover-placeholder {
      display: none;
      font-size: 2.8rem;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1e3a8a, #0369a1);
    }

    .book-title {
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 0.4rem;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .book-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: auto;
    }

    /* Giao diện Trình đọc Lật sách */
    #reader-view {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: calc(100vh - 50px);
      padding: 0.3rem 0.5rem;
      box-sizing: border-box;
      overflow: hidden;
      position: relative;
    }
    .reader-toolbar {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.2rem 0;
      flex-shrink: 0;
      z-index: 5;
    }
    .btn {
      background: #334155;
      color: white;
      border: none;
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: background 0.2s;
    }
    .btn:hover { background: #475569; }

    /* Khung chứa sách */
    #book-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1;
      width: 100%;
      min-height: 0;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: pan-y;
    }
    
    .page-box {
      background-color: #0b1120;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .page-img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      pointer-events: none;
    }

    .page-skeleton {
      color: #64748b;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0.5rem;
      position: absolute;
      inset: 0;
      background: #0b1120;
      transition: opacity 0.2s;
    }

    /* Khung tiến trình */
    .progress-box {
      width: 100%;
      max-width: 380px;
      background: #1e293b;
      padding: 1.25rem;
      border-radius: 12px;
      border: 1px solid #334155;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }
    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .progress-track {
      width: 100%;
      height: 8px;
      background: #334155;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      border-radius: 999px;
      transition: width 0.2s ease-out;
    }

    #loading-book-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(8px);
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .spinner {
      width: 22px;
      height: 22px;
      border: 2px solid #334155;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 600px) {
      header { height: 46px; padding: 0 0.8rem; }
      header h1 { font-size: 1rem; }
      #reader-view { height: calc(100vh - 46px); }
      #current-book-name { max-width: 40% !important; font-size: 0.8rem !important; }
      .reader-toolbar { font-size: 0.8rem !important; }
      .btn { padding: 0.35rem 0.75rem; font-size: 0.8rem; }
      .book-cover { height: 200px; }
    }
  </style>
</head>
<body>

  <header>
    <h1 onclick="backToShelf()" title="Bấm để quay về danh mục sách">Tủ Sách Trực Tuyến</h1>
    <div id="status-tag" style="font-size: 0.8rem; color: var(--text-muted);">Đang kết nối...</div>
  </header>

  <!-- MÀN HÌNH 1: KỆ SÁCH -->
  <main id="shelf-view">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <h2>Danh mục truyện tranh</h2>
      <span id="file-counter" style="color: var(--text-muted); font-size: 0.9rem;"></span>
    </div>

    <!-- Thanh tiến trình nạp kệ sách -->
    <div id="loading-shelf" style="display: flex; justify-content: center; padding: 3rem 1rem;">
      <div class="progress-box">
        <div class="progress-header">
          <span id="shelf-prog-text">Đang kết nối Google Drive...</span>
          <span id="shelf-prog-pct" style="color: var(--accent);">0%</span>
        </div>
        <div class="progress-track">
          <div id="shelf-prog-bar" class="progress-fill"></div>
        </div>
      </div>
    </div>

    <div id="shelf-grid" class="grid"></div>
  </main>

  <!-- MÀN HÌNH 2: TRÌNH ĐỌC LẬT SÁCH -->
  <div id="reader-view">
    <div class="reader-toolbar">
      <button class="btn" onclick="backToShelf()">← Kệ sách</button>
      <span id="current-book-name" style="font-weight: 600; max-width: 50%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></span>
      <div style="font-size: 0.85rem;">
        Trang <span id="current-page">1</span> / <span id="total-pages">--</span>
      </div>
    </div>

    <!-- Overlay tiến trình nạp sách -->
    <div id="loading-book-overlay">
      <div class="progress-box">
        <div class="progress-header">
          <span id="book-prog-text">Đang kết nối tải truyện...</span>
          <span id="book-prog-pct" style="color: var(--accent);">0%</span>
        </div>
        <div class="progress-track">
          <div id="book-prog-bar" class="progress-fill"></div>
        </div>
      </div>
    </div>

    <!-- Vùng lật sách -->
    <div id="book-wrapper"></div>

    <div class="reader-toolbar" style="justify-content: center; gap: 1rem;">
      <button class="btn" onclick="prevPage()">‹ Trang trước</button>
      <button class="btn" onclick="nextPage()">Trang sau ›</button>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxOwmO8RSpnp9xgWBCBvBkPyVDmtjtuon9nWWNibD_E8FalOFEf7zRQPeeVVTtrM03D-g/exec";

    let pageFlipInstance = null;
    let currentSessionId = 0;
    let currentPages = [];
    let loadedImageSet = new Set();
    let isFlipping = false;

    function getDriveImageUrl(fileId, size = 1600) {
      return `https://lh3.googleusercontent.com/d/${fileId}=w${size}`;
    }

    function setShelfProgress(pct, text) {
      document.getElementById("shelf-prog-bar").style.width = pct + "%";
      document.getElementById("shelf-prog-pct").innerText = Math.round(pct) + "%";
      if (text) document.getElementById("shelf-prog-text").innerText = text;
    }

    function setBookProgress(pct, text) {
      document.getElementById("book-prog-bar").style.width = pct + "%";
      document.getElementById("book-prog-pct").innerText = Math.round(pct) + "%";
      if (text) document.getElementById("book-prog-text").innerText = text;
    }

    function updatePageIndicator(curIndex, total, isMobile) {
      const pageSpan = document.getElementById("current-page");
      if (isMobile) {
        pageSpan.innerText = curIndex + 1;
      } else {
        if (curIndex === 0) {
          pageSpan.innerText = "1";
        } else {
          const leftP = curIndex + 1;
          const rightP = Math.min(total, curIndex + 2);
          pageSpan.innerText = (leftP >= rightP) ? leftP : `${leftP} - ${rightP}`;
        }
      }
    }

    // 1. Tải danh mục truyện từ Thư mục gốc Drive
    async function fetchBookList() {
      setShelfProgress(25, "Đang kết nối Google Drive...");
      let cur = 25;
      const timer = setInterval(() => {
        if (cur < 85) {
          cur += 15;
          setShelfProgress(cur, "Đang quét danh sách các bộ truyện...");
        }
      }, 200);

      try {
        const response = await fetch(GOOGLE_SCRIPT_URL);
        const res = await response.json();
        clearInterval(timer);

        if (!res.success) throw new Error(res.error);

        setShelfProgress(100, "Đồng bộ thành công!");
        setTimeout(() => {
          document.getElementById("loading-shelf").style.display = "none";
        }, 300);

        const books = res.books || [];
        document.getElementById("file-counter").innerText = `Tổng cộng: ${books.length} bộ`;
        document.getElementById("status-tag").innerText = "Đã đồng bộ Drive";

        const shelfGrid = document.getElementById("shelf-grid");
        shelfGrid.innerHTML = "";

        books.forEach(book => {
          const card = document.createElement("div");
          card.className = "book-card";
          const thumbSrc = book.thumbId ? getDriveImageUrl(book.thumbId, 600) : "";

          card.innerHTML = `
            <div class="book-cover">
              ${book.thumbId ? `
                <img src="${thumbSrc}" 
                     alt="${book.name}" 
                     class="cover-img" 
                     loading="lazy" 
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
              ` : ''}
              <div class="cover-placeholder" ${book.thumbId ? '' : 'style="display:flex;"'}>📖</div>
            </div>
            <div class="book-title" title="${book.name}">${book.name}</div>
            <div class="book-meta">${book.pageCount} trang</div>
          `;
          card.onclick = () => openComicBook(book.id, book.name);
          shelfGrid.appendChild(card);
        });

      } catch (err) {
        clearInterval(timer);
        document.getElementById("loading-shelf").innerHTML = `<div style="color:#ef4444; text-align:center;">Lỗi nạp danh mục: ${err.message}</div>`;
      }
    }

    // 2. Nạp ảnh từng trang (Trả về Promise để chờ ảnh tải xong)
    function loadPageImage(pageIndex, sessionId) {
      if (sessionId !== currentSessionId) return Promise.resolve();
      if (pageIndex < 0 || pageIndex >= currentPages.length) return Promise.resolve();
      if (loadedImageSet.has(pageIndex)) return Promise.resolve();

      loadedImageSet.add(pageIndex);
      const img = document.getElementById(`page-img-${pageIndex}`);
      const skel = document.getElementById(`page-skel-${pageIndex}`);

      if (!img || !skel) return Promise.resolve();

      return new Promise((resolve) => {
        const fileId = currentPages[pageIndex].id;
        img.src = getDriveImageUrl(fileId, 1600);
        
        img.onload = () => {
          if (sessionId === currentSessionId) {
            skel.style.display = "none";
            img.style.display = "block";
          }
          resolve();
        };
        img.onerror = () => {
          img.src = `https://drive.google.com/thumbnail?id=${fileId}&sz=w1600`;
          img.onload = () => {
            if (sessionId === currentSessionId) {
              skel.style.display = "none";
              img.style.display = "block";
            }
            resolve();
          };
          img.onerror = () => resolve();
        };
      });
    }

    // Tải trước một dải các trang tiếp theo
    function preloadPageRange(centerIndex, sessionId, isMobile) {
      const span = isMobile ? 3 : 6; // Trên PC luôn đón đầu trước 6 trang
      const start = Math.max(0, centerIndex - 2);
      const end = Math.min(currentPages.length - 1, centerIndex + span);
      for (let p = start; p <= end; p++) {
        loadPageImage(p, sessionId);
      }
    }

    // 3. Mở truyện tranh & Dựng Flipbook lật trang
    async function openComicBook(folderId, bookName) {
      const sessionId = ++currentSessionId;
      loadedImageSet.clear();
      isFlipping = false;

      document.getElementById("shelf-view").style.display = "none";
      document.getElementById("reader-view").style.display = "flex";
      document.getElementById("current-book-name").innerText = bookName;
      
      const overlay = document.getElementById("loading-book-overlay");
      overlay.style.display = "flex";
      setBookProgress(20, "Đang đọc danh sách trang ảnh...");

      const bookWrapper = document.getElementById("book-wrapper");
      bookWrapper.innerHTML = "";
      if (pageFlipInstance) {
        try { pageFlipInstance.destroy(); } catch (e) {}
        pageFlipInstance = null;
      }

      try {
        const response = await fetch(`${GOOGLE_SCRIPT_URL}?folderId=${folderId}`);
        if (!response.ok) throw new Error("HTTP " + response.status);

        const data = await response.json();
        if (sessionId !== currentSessionId) return;
        if (!data.success) throw new Error(data.error);

        currentPages = data.pages || [];
        const total = currentPages.length;
        document.getElementById("total-pages").innerText = total;

        if (total === 0) throw new Error("Thư mục truyện không có ảnh nào.");

        setBookProgress(50, "Đang đo tỷ lệ trang ảnh...");

        // Đo kích thước trang đầu tiên
        const firstImg = new Image();
        firstImg.src = getDriveImageUrl(currentPages[0].id, 1600);
        await new Promise((resolve) => {
          firstImg.onload = resolve;
          firstImg.onerror = () => {
            firstImg.src = `https://drive.google.com/thumbnail?id=${currentPages[0].id}&sz=w1600`;
            firstImg.onload = resolve;
            firstImg.onerror = resolve;
          };
        });

        const pageRatio = (firstImg.naturalWidth && firstImg.naturalHeight) 
          ? (firstImg.naturalWidth / firstImg.naturalHeight) 
          : 0.707;

        const isMobile = (window.innerWidth < 768) || (window.innerWidth < window.innerHeight);

        const headerH = 50;
        const toolbarsH = 80;
        const availH = Math.max(window.innerHeight - headerH - toolbarsH - 12, 280);
        const availW = Math.max(window.innerWidth - 16, 260);

        let singlePageW, singlePageH;

        if (isMobile) {
          if (availW / availH > pageRatio) {
            singlePageH = Math.floor(availH);
            singlePageW = Math.floor(singlePageH * pageRatio);
          } else {
            singlePageW = Math.floor(availW);
            singlePageH = Math.floor(singlePageW / pageRatio);
          }
        } else {
          const spreadRatio = 2 * pageRatio;
          let spreadW, spreadH;
          if (availW / availH > spreadRatio) {
            spreadH = Math.floor(availH);
            spreadW = Math.floor(spreadH * spreadRatio);
          } else {
            spreadW = Math.floor(availW);
            spreadH = Math.floor(spreadW / spreadRatio);
          }
          singlePageW = Math.floor(spreadW / 2);
          singlePageH = Math.floor(spreadH);
        }

        const flipbookContainer = document.createElement("div");
        flipbookContainer.id = "flipbook";
        
        if (isMobile) {
          flipbookContainer.style.width = singlePageW + "px";
          flipbookContainer.style.height = singlePageH + "px";
        } else {
          flipbookContainer.style.width = (singlePageW * 2) + "px";
          flipbookContainer.style.height = singlePageH + "px";
        }
        bookWrapper.appendChild(flipbookContainer);

        // Tạo sẵn thẻ cho tất cả các trang
        const pageDivs = [];
        for (let i = 0; i < total; i++) {
          const pDiv = document.createElement("div");
          pDiv.className = "page-box";
          pDiv.innerHTML = `
            <div class="page-skeleton" id="page-skel-${i}"><div class="spinner"></div>Trang ${i + 1}</div>
            <img class="page-img" id="page-img-${i}" alt="Trang ${i + 1}" style="display:none;" />
          `;
          flipbookContainer.appendChild(pDiv);
          pageDivs.push(pDiv);
        }

        // TẢI ĐÓN ĐẦU NGAY TỪ ĐẦU (Trang bìa và 2 lượt lật tiếp theo: 0, 1, 2, 3, 4)
        setBookProgress(80, "Đang tải sẵn các trang mở đầu...");
        const initialLoads = [loadPageImage(0, sessionId)];
        if (total > 1) initialLoads.push(loadPageImage(1, sessionId));
        if (total > 2) initialLoads.push(loadPageImage(2, sessionId));
        if (total > 3) initialLoads.push(loadPageImage(3, sessionId));
        if (total > 4) initialLoads.push(loadPageImage(4, sessionId));
        
        // Đợi ít nhất 3 trang đầu nạp xong vào RAM trước khi mở sách
        await Promise.all(initialLoads.slice(0, Math.min(3, total)));

        if (sessionId !== currentSessionId) return;
        setBookProgress(100, "Sẵn sàng!");

        // Khởi tạo trình lật sách PageFlip
        pageFlipInstance = new St.PageFlip(flipbookContainer, {
          width: singlePageW,
          height: singlePageH,
          size: "fixed",
          minWidth: 150,
          maxWidth: 2500,
          minHeight: 150,
          maxHeight: 2500,
          maxShadowOpacity: 0.35,
          showCover: !isMobile,
          mobileScrollSupport: false,
          usePortrait: isMobile
        });

        pageFlipInstance.loadFromHTML(pageDivs);
        updatePageIndicator(0, total, isMobile);

        // NGAY KHI BẮT ĐẦU CHẠM LẬT: Tải đón đầu ngay các trang tiếp theo
        pageFlipInstance.on("changeState", (e) => {
          if (e.data === "read") {
            isFlipping = false;
          } else if (e.data === "flipping" || e.data === "user_fold") {
            isFlipping = true;
            const cur = pageFlipInstance.getCurrentPageIndex();
            preloadPageRange(cur, sessionId, isMobile);
          }
        });

        // KHI LẬT XONG: Cập nhật số trang và tiếp tục tải đệm các trang sau
        pageFlipInstance.on("flip", (e) => {
          const curIndex = e.data;
          updatePageIndicator(curIndex, total, isMobile);
          preloadPageRange(curIndex, sessionId, isMobile);
        });

        setTimeout(() => {
          if (sessionId === currentSessionId) {
            overlay.style.display = "none";
          }
        }, 200);

        // TIẾN TRÌNH NỀN: Tự động tải dần tất cả các trang còn lại vào cache
        (async () => {
          for (let p = 5; p < total; p++) {
            if (sessionId !== currentSessionId) break;
            await new Promise(r => setTimeout(r, 200));
            loadPageImage(p, sessionId);
          }
        })();

      } catch (err) {
        if (sessionId === currentSessionId) {
          alert("Lỗi tải truyện: " + err.message);
          backToShelf();
        }
      }
    }

    function prevPage() {
      if (!pageFlipInstance || isFlipping) return;
      if (document.getElementById("reader-view").style.display === "flex") {
        try {
          isFlipping = true;
          // Kích hoạt preload trước khi gọi hàm flip
          const cur = pageFlipInstance.getCurrentPageIndex();
          preloadPageRange(Math.max(0, cur - 2), currentSessionId, window.innerWidth < 768);
          pageFlipInstance.flipPrev();
          setTimeout(() => { isFlipping = false; }, 450);
        } catch (e) {
          isFlipping = false;
        }
      }
    }

    function nextPage() {
      if (!pageFlipInstance || isFlipping) return;
      if (document.getElementById("reader-view").style.display === "flex") {
        try {
          isFlipping = true;
          // Kích hoạt preload trước khi gọi hàm flip
          const cur = pageFlipInstance.getCurrentPageIndex();
          preloadPageRange(cur + 2, currentSessionId, window.innerWidth < 768);
          pageFlipInstance.flipNext();
          setTimeout(() => { isFlipping = false; }, 450);
        } catch (e) {
          isFlipping = false;
        }
      }
    }

    window.addEventListener("keydown", (e) => {
      if (document.getElementById("reader-view").style.display === "flex") {
        if (e.key === "ArrowLeft") prevPage();
        if (e.key === "ArrowRight") nextPage();
      }
    });

    // Cử chỉ cảm ứng Mobile (Chạm & Vuốt)
    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;
    let touchMoved = false;

    const bookWrapper = document.getElementById("book-wrapper");

    bookWrapper.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchStartTime = Date.now();
        touchMoved = false;
      }
    }, { capture: true, passive: true });

    bookWrapper.addEventListener("touchmove", (e) => {
      if (e.touches.length === 1) {
        const diffX = e.touches[0].clientX - touchStartX;
        const diffY = e.touches[0].clientY - touchStartY;
        if (Math.abs(diffX) > 10 || Math.abs(diffY) > 10) {
          touchMoved = true;
        }
      }
    }, { capture: true, passive: true });

    bookWrapper.addEventListener("touchend", (e) => {
      if (touchStartTime === 0) return;

      const touchEndX = e.changedTouches[0].clientX;
      const touchEndY = e.changedTouches[0].clientY;
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;
      const duration = Date.now() - touchStartTime;

      touchStartTime = 0;

      if (Math.abs(diffX) > 35 && Math.abs(diffX) > Math.abs(diffY) && duration < 500) {
        if (diffX < 0) nextPage();
        else prevPage();
        return;
      }

      if (!touchMoved || (Math.abs(diffX) < 15 && Math.abs(diffY) < 15 && duration < 400)) {
        const rect = bookWrapper.getBoundingClientRect();
        const tapX = touchEndX - rect.left;
        const width = rect.width;

        if (tapX < width * 0.3) prevPage();
        else nextPage();
      }
    }, { capture: true, passive: true });

    // Click trên PC (Chỉ xử lý khi click ngoài lề tối)
    bookWrapper.addEventListener("click", (e) => {
      if (e.target.closest("#flipbook")) return;
      if (window.innerWidth < 768) return;

      const rect = bookWrapper.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      if (clickX < rect.width * 0.3) {
        prevPage();
      } else {
        nextPage();
      }
    });

    function backToShelf() {
      currentSessionId++;
      isFlipping = false;
      document.getElementById("reader-view").style.display = "none";
      document.getElementById("shelf-view").style.display = "block";

      const bookWrapper = document.getElementById("book-wrapper");
      bookWrapper.innerHTML = "";

      if (pageFlipInstance) {
        try { pageFlipInstance.destroy(); } catch (e) {}
        pageFlipInstance = null;
      }
      currentPages = [];
      loadedImageSet.clear();
    }

    window.addEventListener("DOMContentLoaded", fetchBookList);
  </script>
</body>
</html>
