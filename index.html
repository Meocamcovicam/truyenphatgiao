<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tủ Sách Điện Tử - Flipbook Reader</title>
  
  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- PageFlip -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    header {
      padding: 0.8rem 1.5rem;
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      z-index: 10;
    }
    h1 { font-size: 1.25rem; font-weight: 600; color: var(--accent); }
    
    /* Giao diện Kệ Sách */
    #shelf-view {
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.5rem;
      margin-top: 1.2rem;
    }
    .book-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      border: 1px solid #334155;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .book-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      border-color: var(--accent);
    }
    .book-cover {
      height: 180px;
      background: linear-gradient(135deg, #1e3a8a, #0369a1);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      margin-bottom: 1rem;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
    }
    .book-title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 0.5rem;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .book-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: auto;
    }

    /* Giao diện Trình đọc Lật sách */
    #reader-view {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: calc(100vh - 55px);
      padding: 0.5rem 1rem;
      box-sizing: border-box;
    }
    .reader-toolbar {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.4rem 0;
      z-index: 5;
    }
    .btn {
      background: #334155;
      color: white;
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
    }
    .btn:hover { background: #475569; }

    /* Khung sách toàn màn hình */
    #book-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1;
      width: 100%;
      overflow: hidden;
    }
    .page-box {
      background-color: #ffffff;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
    }
    .page-box canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Loading placeholder cho từng trang */
    .page-skeleton {
      color: #64748b;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0.5rem;
    }

    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding: 3rem;
      color: var(--text-muted);
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #334155;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <h1>Tủ Sách Trực Tuyến</h1>
    <div id="status-tag" style="font-size: 0.85rem; color: var(--text-muted);">Đang kết nối...</div>
  </header>

  <!-- MÀN HÌNH 1: KỆ SÁCH -->
  <main id="shelf-view">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <h2>Danh mục sách PDF</h2>
      <span id="file-counter" style="color: var(--text-muted);"></span>
    </div>
    <div id="loading-shelf" class="loader">
      <div class="spinner"></div>
      <div>Đang đọc dữ liệu từ Google Drive...</div>
    </div>
    <div id="shelf-grid" class="grid"></div>
  </main>

  <!-- MÀN HÌNH 2: TRÌNH ĐỌC LẬT SÁCH -->
  <div id="reader-view">
    <div class="reader-toolbar">
      <button class="btn" onclick="backToShelf()">← Quay lại kệ sách</button>
      <span id="current-book-name" style="font-weight: 600; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></span>
      <div style="font-size: 0.9rem;">
        Trang <span id="current-page">1</span> / <span id="total-pages">--</span>
      </div>
    </div>

    <!-- Loading lúc đang kéo file PDF -->
    <div id="loading-book" class="loader" style="flex: 1; justify-content: center;">
      <div class="spinner"></div>
      <div id="loading-progress">Đang nạp dữ liệu cuốn sách...</div>
    </div>

    <!-- Khu vực lật sách -->
    <div id="book-wrapper"></div>

    <div class="reader-toolbar" style="justify-content: center; gap: 1.5rem;">
      <button class="btn" onclick="prevPage()">‹ Trang trước</button>
      <button class="btn" onclick="nextPage()">Trang sau ›</button>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxOwmO8RSpnp9xgWBCBvBkPyVDmtjtuon9nWWNibD_E8FalOFEf7zRQPeeVVTtrM03D-g/exec";
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    let pageFlipInstance = null;
    let currentSessionId = 0; // Định danh phiên đọc chống conflict khi bấm ra vào nhiều lần
    let currentPdfDoc = null;
    let renderedPageSet = new Set();

    // 1. Tải danh mục sách từ Google Drive
    async function fetchBookList() {
      try {
        const response = await fetch(GOOGLE_SCRIPT_URL);
        const res = await response.json();

        document.getElementById("loading-shelf").style.display = "none";
        if (!res.success) {
          alert("Lỗi từ Drive: " + res.error);
          return;
        }

        const files = res.files || [];
        document.getElementById("file-counter").innerText = `Tổng cộng: ${files.length} cuốn`;
        document.getElementById("status-tag").innerText = "Đã đồng bộ Drive";

        const shelfGrid = document.getElementById("shelf-grid");
        shelfGrid.innerHTML = "";

        files.forEach(file => {
          const card = document.createElement("div");
          card.className = "book-card";
          card.innerHTML = `
            <div class="book-cover">📖</div>
            <div class="book-title" title="${file.name}">${file.name.replace(/\.pdf$/i, '')}</div>
            <div class="book-meta">Dung lượng: ${file.size}</div>
          `;
          card.onclick = () => openBook(file.id, file.name);
          shelfGrid.appendChild(card);
        });

      } catch (err) {
        document.getElementById("loading-shelf").innerHTML = `<div style="color:#ef4444;">Không thể nạp dữ liệu. Vui lòng kiểm tra lại kết nối mạng.</div>`;
      }
    }

    // 2. Hàm render từng trang độc lập (Lazy Load)
    async function renderSinglePage(pdf, pageNum, containerDiv, sessionId) {
      if (sessionId !== currentSessionId || renderedPageSet.has(pageNum)) return;
      renderedPageSet.add(pageNum);

      try {
        const page = await pdf.getPage(pageNum);
        // Tăng độ sắc nét (scale = 2)
        const viewport = page.getViewport({ scale: 2.0 });

        const canvas = document.createElement("canvas");
        canvas.width = viewport.width;
        canvas.height = viewport.height;

        const renderContext = {
          canvasContext: canvas.getContext("2d"),
          viewport: viewport
        };

        await page.render(renderContext).promise;

        if (sessionId === currentSessionId) {
          containerDiv.innerHTML = "";
          containerDiv.appendChild(canvas);
        }
      } catch (e) {
        console.error("Lỗi dựng trang:", pageNum, e);
      }
    }

    // 3. Mở sách & Thiết lập Flipbook
    async function openBook(fileId, fileName) {
      const sessionId = ++currentSessionId; // Tạo phiên đọc mới
      renderedPageSet.clear();

      document.getElementById("shelf-view").style.display = "none";
      document.getElementById("reader-view").style.display = "flex";
      document.getElementById("current-book-name").innerText = fileName;
      document.getElementById("loading-book").style.display = "flex";
      document.getElementById("loading-progress").innerText = "Đang tải dữ liệu...";

      // Dọn dẹp an toàn phiên đọc cũ
      const bookWrapper = document.getElementById("book-wrapper");
      bookWrapper.innerHTML = "";
      if (pageFlipInstance) {
        try { pageFlipInstance.destroy(); } catch (e) {}
        pageFlipInstance = null;
      }

      try {
        const res = await fetch(`${GOOGLE_SCRIPT_URL}?id=${fileId}`);
        const data = await res.json();
        if (sessionId !== currentSessionId) return; // Nếu người dùng đã bấm thoát
        if (!data.success) throw new Error(data.error);

        // Chuyển Base64 sang binary
        const rawData = atob(data.data);
        const uint8Array = new Uint8Array(rawData.length);
        for (let i = 0; i < rawData.length; i++) {
          uint8Array[i] = rawData.charCodeAt(i);
        }

        const loadingTask = pdfjsLib.getDocument({ data: uint8Array });
        currentPdfDoc = await loadingTask.promise;
        const total = currentPdfDoc.numPages;
        document.getElementById("total-pages").innerText = total;

        // Lấy kích thước trang đầu tiên để tính tỷ lệ hiển thị to nhất màn hình
        const firstPage = await currentPdfDoc.getPage(1);
        const defaultVp = firstPage.getViewport({ scale: 1 });
        const ratio = defaultVp.width / defaultVp.height;

        // Tính kích thước sách tự động vừa vặn 85% chiều cao màn hình
        const availableHeight = Math.max(window.innerHeight - 150, 480);
        const bookHeight = Math.min(availableHeight, 880);
        const bookWidth = Math.round(bookHeight * ratio);

        // Tạo thẻ flipbook mới tinh
        const flipbookContainer = document.createElement("div");
        flipbookContainer.id = "flipbook";
        bookWrapper.appendChild(flipbookContainer);

        // Tạo khung placeholder cho toàn bộ các trang
        const pageDivs = [];
        for (let i = 1; i <= total; i++) {
          const pDiv = document.createElement("div");
          pDiv.className = "page-box";
          pDiv.innerHTML = `<div class="page-skeleton"><div class="spinner" style="width:24px;height:24px;border-width:2px;"></div>Đang dựng trang ${i}...</div>`;
          flipbookContainer.appendChild(pDiv);
          pageDivs.push(pDiv);
        }

        // TẢI NHANH: Chỉ render trước 2 trang đầu để người đọc vào xem ngay
        document.getElementById("loading-progress").innerText = "Chuẩn bị trang sách...";
        await renderSinglePage(currentPdfDoc, 1, pageDivs[0], sessionId);
        if (total >= 2) {
          await renderSinglePage(currentPdfDoc, 2, pageDivs[1], sessionId);
        }

        if (sessionId !== currentSessionId) return;

        // Ẩn spinner loading tổng và hiện sách
        document.getElementById("loading-book").style.display = "none";

        // Khởi tạo Flipbook với kích thước đã tính toán tự động
        pageFlipInstance = new St.PageFlip(flipbookContainer, {
          width: bookWidth,
          height: bookHeight,
          size: "stretch",
          minWidth: 320,
          maxWidth: 1200,
          minHeight: 450,
          maxHeight: 1200,
          maxShadowOpacity: 0.5,
          showCover: true,
          mobileScrollSupport: false,
          usePortrait: true
        });

        pageFlipInstance.loadFromHTML(pageDivs);

        // Bắt sự kiện lật trang: Tự động render tiếp các trang liền kề
        pageFlipInstance.on("flip", (e) => {
          const currentPageIndex = e.data; // 0-based
          document.getElementById("current-page").innerText = currentPageIndex + 1;

          // Render trước 3 trang tiếp theo và 2 trang trước đó
          for (let p = Math.max(1, currentPageIndex - 1); p <= Math.min(total, currentPageIndex + 4); p++) {
            renderSinglePage(currentPdfDoc, p, pageDivs[p - 1], sessionId);
          }
        });

        // Bắt đầu tiến trình render nền tuần tự cho toàn bộ các trang còn lại
        (async () => {
          for (let p = 3; p <= total; p++) {
            if (sessionId !== currentSessionId) break;
            await renderSinglePage(currentPdfDoc, p, pageDivs[p - 1], sessionId);
          }
        })();

      } catch (err) {
        if (sessionId === currentSessionId) {
          alert("Lỗi tải sách: " + err.message);
          backToShelf();
        }
      }
    }

    function prevPage() {
      if (pageFlipInstance) pageFlipInstance.flipPrev();
    }

    function nextPage() {
      if (pageFlipInstance) pageFlipInstance.flipNext();
    }

    // Điều hướng bằng phím mũi tên trên bàn phím
    window.addEventListener("keydown", (e) => {
      if (document.getElementById("reader-view").style.display === "flex") {
        if (e.key === "ArrowLeft") prevPage();
        if (e.key === "ArrowRight") nextPage();
      }
    });

    function backToShelf() {
      currentSessionId++; // Hủy ngay các tác vụ render ngầm của cuốn sách hiện tại
      document.getElementById("reader-view").style.display = "none";
      document.getElementById("shelf-view").style.display = "block";

      const bookWrapper = document.getElementById("book-wrapper");
      bookWrapper.innerHTML = "";

      if (pageFlipInstance) {
        try { pageFlipInstance.destroy(); } catch (e) {}
        pageFlipInstance = null;
      }
      currentPdfDoc = null;
    }

    window.addEventListener("DOMContentLoaded", fetchBookList);
  </script>
</body>
</html>
