<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tủ Sách Điện Tử - Webtoon PDF Reader</title>
  
  <!-- PDF.js Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --reader-max-width: 820px;
      --reader-width: 100%;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    header {
      height: 50px;
      padding: 0 1.2rem;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      z-index: 20;
    }
    header h1 { 
      font-size: 1.15rem; 
      font-weight: 600; 
      color: var(--accent); 
      cursor: pointer;
      user-select: none;
      transition: opacity 0.2s;
    }
    header h1:hover { opacity: 0.8; text-decoration: underline; }
    
    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    /* GIAO DIỆN 1: KỆ SÁCH */
    #shelf-view {
      padding: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.2rem;
      margin-top: 1.2rem;
    }
    
    @keyframes cardFadeIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .book-card-animated {
      opacity: 0;
      animation: cardFadeIn 0.35s ease-out forwards;
    }

    .book-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      border: 1px solid #334155;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .book-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      border-color: var(--accent);
    }
    
    .book-cover {
      height: 230px;
      background: #090e1a;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.8rem;
      overflow: hidden;
      position: relative;
      border: 1px solid #334155;
    }
    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
      transition: transform 0.3s ease;
    }
    .book-card:hover .cover-img { transform: scale(1.04); }

    .book-title {
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 0.4rem;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .book-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: auto;
    }

    /* SKELETON CARDS */
    @keyframes skeletonPulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 0.25; }
    }
    .skeleton-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 0.85rem;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      animation: skeletonPulse 1.4s ease-in-out infinite;
    }
    .skeleton-cover {
      height: 230px;
      background: #0d1525;
      border-radius: 8px;
      margin-bottom: 0.8rem;
      border: 1px solid #334155;
    }
    .skeleton-line {
      height: 12px;
      background: #334155;
      border-radius: 4px;
      margin-bottom: 0.45rem;
    }
    .skeleton-line.short { width: 45%; }

    /* GIAO DIỆN 2: CHI TIẾT TRUYỆN */
    #detail-view {
      display: none;
      padding: 1.5rem;
      max-width: 950px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
      flex-direction: column;
      gap: 1.5rem;
    }
    .detail-card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid #334155;
      padding: 1.5rem;
      display: flex;
      gap: 1.8rem;
      box-shadow: 0 15px 30px rgba(0,0,0,0.3);
    }
    .detail-cover-box {
      width: 220px;
      min-width: 220px;
      height: 310px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #475569;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      background: #090e1a;
    }
    .detail-cover-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }
    .detail-info {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
    }
    .detail-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.35;
      margin-bottom: 0.8rem;
    }
    .detail-meta-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
    }
    .meta-tag {
      background: #334155;
      color: var(--accent);
      padding: 0.35rem 0.8rem;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 500;
    }
    .btn-read-start {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #0f172a;
      border: none;
      padding: 0.8rem 1.8rem;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      width: fit-content;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
    }
    .btn-read-start:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.45);
    }

    .chap-section {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid #334155;
      padding: 1.5rem;
    }
    .chap-section-header {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
      padding-bottom: 0.8rem;
    }
    .chap-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 0.75rem;
    }
    .chap-item {
      padding: 0.75rem 0.5rem;
      border-radius: 8px;
      border: 1px solid #334155;
      text-align: center;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      transition: all 0.2s;
      user-select: none;
    }
    .chap-item.unread {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }
    .chap-item.unread:hover { background: #0369a1; transform: translateY(-2px); }
    .chap-item.read {
      background: #1e293b;
      color: #94a3b8;
      border-color: #334155;
    }
    .chap-item.read:hover { background: #334155; color: #ffffff; }

    /* GIAO DIỆN 3: TRÌNH ĐỌC CUỘN DỌC */
    #reader-view {
      display: none;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      position: relative;
    }

    /* THANH CÔNG CỤ CỐ ĐỊNH Ở ĐẦU TRANG */
    .reader-toolbar {
      position: sticky;
      top: 0;
      left: 0;
      right: 0;
      z-index: 45;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #334155;
      display: flex;
      flex-direction: column;
      padding: 0.4rem 0.8rem;
      gap: 0.4rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.45);
      flex-shrink: 0;
    }

    .toolbar-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      width: 100%;
    }
    .toolbar-nav-group {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .toolbar-bottom-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
    }

    .btn {
      background: #334155;
      color: white;
      border: none;
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: background 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      white-space: nowrap;
    }
    .btn:hover { background: #475569; }
    .btn-accent { background: var(--accent-hover); }
    .btn-accent:hover { background: #0369a1; }

    .zoom-toolbar {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background: #1e293b;
      padding: 0.25rem 0.6rem;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .zoom-toolbar input[type="range"] {
      width: 110px;
      height: 6px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .zoom-toolbar span {
      font-size: 0.82rem;
      min-width: 42px;
      text-align: center;
      color: var(--accent);
      font-weight: 600;
    }
    .btn-icon {
      background: #334155;
      color: white;
      border: none;
      padding: 0.22rem 0.5rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn-icon:hover { background: #475569; }

    .page-badge {
      font-size: 0.85rem;
      color: var(--text);
      white-space: nowrap;
      background: #1e293b;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      border: 1px solid #334155;
    }

    /* VÙNG CUỘN ĐỌC DỌC (CUỘN BÊN DƯỚI THANH MENU) */
    #reader-scroll-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: auto;
      padding: 0.8rem 0 3rem 0;
      background: #090e17;
      position: relative;
      -webkit-overflow-scrolling: touch;
    }
    
    .scroll-pages-wrapper {
      width: var(--reader-width, 100%);
      max-width: var(--reader-max-width, 820px);
      margin-left: auto;
      margin-right: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: width 0.15s ease-out, max-width 0.15s ease-out;
    }

    .pdf-page-container {
      width: 100%;
      position: relative;
      background: #111827;
      box-shadow: 0 5px 18px rgba(0,0,0,0.45);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .pdf-page-container canvas {
      display: block;
      width: 100% !important;
      height: auto !important;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: high-quality;
    }
    .page-loading-skeleton {
      color: #64748b;
      font-size: 0.85rem;
      font-weight: 500;
      user-select: none;
    }

    .end-chap-nav {
      margin-top: 2rem;
      padding: 1.5rem;
      display: flex;
      justify-content: center;
      gap: 1rem;
      width: 100%;
      max-width: var(--reader-max-width);
      margin-left: auto;
      margin-right: auto;
      border-top: 1px solid #334155;
    }

    /* POPUP CHỌN NHANH CHAP */
    #chap-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(6px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-content {
      background: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 12px;
      width: 100%;
      max-width: 550px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
    }
    .modal-header {
      padding: 1rem 1.2rem;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-body {
      padding: 1rem;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 0.6rem;
    }

    /* ANIMATION LOADING & TIẾN TRÌNH */
    #loading-book-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(10px);
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      opacity: 1;
      visibility: visible;
    }
    #loading-book-overlay.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-ring {
      width: 52px;
      height: 52px;
      border: 3.5px solid rgba(56, 189, 248, 0.15);
      border-top: 3.5px solid var(--accent);
      border-right: 3.5px solid var(--accent);
      border-radius: 50%;
      animation: spinLoader 0.75s linear infinite;
      margin-bottom: 1.2rem;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
    }
    @keyframes spinLoader {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .progress-box {
      width: 100%;
      max-width: 420px;
      background: #1e293b;
      padding: 1.4rem;
      border-radius: 14px;
      border: 1px solid #334155;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 0.95rem;
      font-weight: 600;
    }
    .progress-header-pct {
      font-size: 1.15rem;
      color: var(--accent);
      font-weight: 700;
    }
    .progress-track {
      width: 100%;
      height: 9px;
      background: #0f172a;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid #334155;
    }
    @keyframes shimmerMove {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0284c7 0%, #38bdf8 45%, #a5f3fc 55%, #38bdf8 65%, #0284c7 100%);
      background-size: 200% 100%;
      animation: shimmerMove 1.8s infinite linear;
      border-radius: 999px;
      transition: width 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .progress-detail {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .progress-dot {
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      display: inline-block;
      animation: pulseDot 1.2s infinite ease-in-out;
    }
    @keyframes pulseDot {
      0%, 100% { transform: scale(0.8); opacity: 0.5; }
      50% { transform: scale(1.3); opacity: 1; }
    }

    /* BỐ TRÍ NỀN TẢNG PC & MOBILE */
    @media (min-width: 768px) {
      .reader-toolbar {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        height: 52px;
        padding: 0 1.2rem;
      }
      .toolbar-top-row {
        width: auto;
        justify-content: flex-start;
        gap: 0.8rem;
      }
      .toolbar-bottom-row {
        width: auto;
        justify-content: flex-end;
        gap: 0.8rem;
      }
      .zoom-toolbar input[type="range"] { width: 100px; }
    }

    @media (max-width: 767px) {
      .detail-card {
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 1.2rem;
      }
      .detail-cover-box {
        width: 180px;
        min-width: 180px;
        height: 250px;
      }
      .detail-info { align-items: center; }
      .detail-meta-tags { justify-content: center; }
      .btn-read-start { width: 100%; justify-content: center; }
      #reader-scroll-container { padding: 0.5rem 0 2rem 0; }
      .scroll-pages-wrapper { gap: 2px; }

      .btn { padding: 0.35rem 0.55rem; font-size: 0.76rem; }
      .zoom-toolbar { width: 100%; justify-content: center; padding: 0.2rem 0.5rem; }
      .zoom-toolbar input[type="range"] { flex: 1; max-width: 180px; }
      .page-badge { font-size: 0.78rem; padding: 0.2rem 0.45rem; }
    }

    @media (max-width: 600px) {
      header { height: 46px; padding: 0 0.8rem; }
      header h1 { font-size: 1rem; }
      .book-cover { height: 190px; }
      .chap-grid, .modal-body { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
    }
  </style>
</head>
<body>

  <header id="main-header">
    <h1 onclick="backToShelf()" title="Bấm để quay về danh mục sách">Tủ Sách Trực Tuyến</h1>
    <div class="header-actions">
      <div id="status-tag" style="font-size: 0.8rem; color: var(--text-muted);">Đang tải...</div>
      <button class="btn btn-icon" onclick="forceRefreshShelf()" title="Quét đồng bộ lại từ Google Drive">🔄</button>
    </div>
  </header>

  <!-- MÀN HÌNH 1: KỆ SÁCH -->
  <main id="shelf-view">
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 0.8rem; margin-bottom: 0.5rem;">
      <h2>Danh mục truyện tranh</h2>
      <span id="file-counter" style="color: var(--text-muted); font-size: 0.9rem;"></span>
    </div>

    <div id="shelf-grid" class="grid"></div>
  </main>

  <!-- MÀN HÌNH 2: CHI TIẾT TRUYỆN -->
  <div id="detail-view">
    <div style="display: flex; justify-content: flex-start;">
      <button class="btn" onclick="backToShelf()">← Quay lại kệ sách</button>
    </div>

    <div class="detail-card">
      <div class="detail-cover-box">
        <img id="detail-cover-img" src="" alt="Thumbnail" />
      </div>
      <div class="detail-info">
        <div>
          <div class="detail-title" id="detail-book-title">Tên truyện</div>
          <div class="detail-meta-tags">
            <span class="meta-tag" id="detail-chaps-tag">-- Chap</span>
          </div>
        </div>
        
        <button class="btn-read-start" onclick="readFromBeginning()">
          📖 Đọc từ đầu
        </button>
      </div>
    </div>

    <div class="chap-section">
      <div class="chap-section-header">
        <span>Danh sách Chapter (File PDF)</span>
      </div>
      <div class="chap-grid" id="detail-chap-grid"></div>
    </div>
  </div>

  <!-- MÀN HÌNH 3: TRÌNH ĐỌC CUỘN DỌC -->
  <div id="reader-view">
    <!-- THANH MENU & ZOOM LUÔN CỐ ĐỊNH Ở ĐẦU TRANG -->
    <div class="reader-toolbar">
      <div class="toolbar-top-row">
        <div class="toolbar-nav-group">
          <button class="btn" onclick="backToShelf()" title="Về trang chủ kệ sách">🏠 Trang chủ</button>
          <button class="btn" onclick="backToDetail()" title="Về danh sách chương">📋 Mục lục</button>
        </div>
        
        <button class="btn btn-accent" onclick="openChapModal()" title="Chuyển nhanh chương">
          📚 <span id="current-chap-label">Chap 1</span> ▾
        </button>

        <div class="page-badge">
          Trang <span id="current-page">1</span>/<span id="total-pages">1</span>
        </div>
      </div>

      <div class="toolbar-bottom-row">
        <div class="zoom-toolbar">
          <button class="btn-icon" onclick="stepZoom(-10)" title="Thu nhỏ">−</button>
          <input type="range" id="zoom-slider" min="60" max="220" step="5" value="100" oninput="onZoomSlider(this.value)">
          <button class="btn-icon" onclick="stepZoom(10)" title="Phóng to">+</button>
          <span id="zoom-val">100%</span>
          <button class="btn-icon" onclick="resetZoom()" title="Về 100%">↺</button>
        </div>
      </div>
    </div>

    <!-- OVERLAY LOADING TIẾN TRÌNH CHI TIẾT -->
    <div id="loading-book-overlay">
      <div class="loader-ring"></div>
      <div class="progress-box">
        <div class="progress-header">
          <span id="book-prog-title">Đang nạp Chap...</span>
          <span id="book-prog-pct" class="progress-header-pct">0%</span>
        </div>
        <div class="progress-track">
          <div id="book-prog-bar" class="progress-fill"></div>
        </div>
        <div class="progress-detail">
          <span class="progress-dot"></span>
          <span id="book-prog-detail">Đang khởi tạo kết nối...</span>
        </div>
      </div>
    </div>

    <!-- KHU VỰC CUỘN ĐỌC DỌC -->
    <div id="reader-scroll-container">
      <div class="scroll-pages-wrapper" id="scroll-pages-wrapper"></div>
      
      <div class="end-chap-nav" id="end-chap-nav" style="display: none;">
        <button class="btn" id="btn-prev-chap" onclick="prevChapter()">‹ Chap trước</button>
        <button class="btn" onclick="scrollToTop()">↑ Lên đầu</button>
        <button class="btn btn-accent" id="btn-next-chap" onclick="nextChapter()">Chap sau ›</button>
      </div>
    </div>
  </div>

  <!-- POPUP CHỌN CHAPTER NHANH -->
  <div id="chap-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="font-size: 1rem;">Chuyển nhanh Chapter</h3>
        <button class="btn" onclick="closeChapModal()">✕ Đóng</button>
      </div>
      <div class="modal-body" id="modal-chap-grid"></div>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxOwmO8RSpnp9xgWBCBvBkPyVDmtjtuon9nWWNibD_E8FalOFEf7zRQPeeVVTtrM03D-g/exec";

    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    let currentSessionId = 0;
    let selectedBook = null;
    let bookChapters = [];
    let currentChapIndex = 0;
    let currentPdfDoc = null;
    let currentNumPages = 0;
    let pageObserver = null;
    let scrollTrackerObserver = null;

    // Quản lý Zoom
    let currentZoomPercent = 100;
    const BASE_READER_WIDTH = 820;
    let zoomDebounceTimer = null;

    // Bộ nhớ đệm Memory & Request Deduplication
    const memoryPdfCache = new Map();
    const activeFetches = new Map();

    function yieldFrame() {
      return new Promise(resolve => requestAnimationFrame(() => setTimeout(resolve, 0)));
    }

    function openPdfDB() {
      return new Promise((resolve) => {
        const req = indexedDB.open("MangaPdfStore_v3", 1);
        req.onupgradeneeded = (e) => e.target.result.createObjectStore("chap_pdfs");
        req.onsuccess = (e) => resolve(e.target.result);
        req.onerror = () => resolve(null);
      });
    }

    async function getStoredPdf(pdfId) {
      if (memoryPdfCache.has(pdfId)) return memoryPdfCache.get(pdfId);
      try {
        const db = await openPdfDB();
        if (!db) return null;
        return new Promise((resolve) => {
          const tx = db.transaction("chap_pdfs", "readonly");
          const req = tx.objectStore("chap_pdfs").get(pdfId);
          req.onsuccess = () => {
            if (req.result) memoryPdfCache.set(pdfId, req.result);
            resolve(req.result || null);
          };
          req.onerror = () => resolve(null);
        });
      } catch (e) { return null; }
    }

    async function storePdf(pdfId, uint8Array) {
      memoryPdfCache.set(pdfId, uint8Array);
      try {
        const db = await openPdfDB();
        if (!db) return;
        const tx = db.transaction("chap_pdfs", "readwrite");
        tx.objectStore("chap_pdfs").put(uint8Array, pdfId);
      } catch (e) {}
    }

    function getDriveImageUrl(fileId, size = 800) {
      return `https://lh3.googleusercontent.com/d/${fileId}=w${size}`;
    }

    function setBookProgress(pct, title, detail) {
      const bar = document.getElementById("book-prog-bar");
      const pctEl = document.getElementById("book-prog-pct");
      const titleEl = document.getElementById("book-prog-title");
      const detailEl = document.getElementById("book-prog-detail");

      if (bar) bar.style.width = Math.min(100, Math.max(0, pct)) + "%";
      if (pctEl) pctEl.innerText = Math.round(pct) + "%";
      if (title && titleEl) titleEl.innerText = title;
      if (detail && detailEl) detailEl.innerText = detail;
    }

    function getReadChapters(bookId) {
      try {
        const data = localStorage.getItem(`read_chaps_${bookId}`);
        return data ? JSON.parse(data) : [];
      } catch (e) { return []; }
    }

    function markChapAsRead(bookId, chapIndex) {
      if (!bookId) return;
      const readList = getReadChapters(bookId);
      if (!readList.includes(chapIndex)) {
        readList.push(chapIndex);
        try {
          localStorage.setItem(`read_chaps_${bookId}`, JSON.stringify(readList));
        } catch (e) {}
      }
    }

    // ==========================================================
    // 1. TẢI KỆ SÁCH SIÊU TỐC
    // ==========================================================
    function renderSkeletonCards(count = 8) {
      const shelfGrid = document.getElementById("shelf-grid");
      shelfGrid.innerHTML = "";
      for (let i = 0; i < count; i++) {
        const skeleton = document.createElement("div");
        skeleton.className = "skeleton-card";
        skeleton.innerHTML = `
          <div class="skeleton-cover"></div>
          <div class="skeleton-line"></div>
          <div class="skeleton-line short"></div>
        `;
        shelfGrid.appendChild(skeleton);
      }
    }

    function renderBookGrid(books, animate = true) {
      document.getElementById("file-counter").innerText = `Tổng cộng: ${books.length} bộ`;
      const shelfGrid = document.getElementById("shelf-grid");
      shelfGrid.innerHTML = "";

      books.forEach((book, idx) => {
        const card = document.createElement("div");
        card.className = animate ? "book-card book-card-animated" : "book-card";
        if (animate) {
          card.style.animationDelay = `${Math.min(idx * 40, 800)}ms`;
        }

        const thumbSrc = book.thumbId ? getDriveImageUrl(book.thumbId, 600) : "";

        card.innerHTML = `
          <div class="book-cover">
            ${book.thumbId ? `
              <img id="shelf-thumb-${book.id}"
                   src="${thumbSrc}" 
                   alt="${book.name}" 
                   class="cover-img" 
                   loading="lazy" 
                   onerror="this.style.display='none';" />
            ` : ''}
          </div>
          <div class="book-title" title="${book.name}">${book.name}</div>
          <div class="book-meta">${book.chapCount} Chap</div>
        `;
        card.onclick = () => openBookDetail(book);
        shelfGrid.appendChild(card);
      });
    }

    async function initShelf() {
      const cached = localStorage.getItem("cached_shelf_books");
      let hasCache = false;

      if (cached) {
        try {
          const books = JSON.parse(cached);
          if (Array.isArray(books) && books.length > 0) {
            hasCache = true;
            renderBookGrid(books, false);
            document.getElementById("status-tag").innerText = "Đang kiểm tra cập nhật...";
          }
        } catch (e) {}
      }

      if (!hasCache) {
        renderSkeletonCards(8);
        document.getElementById("status-tag").innerText = "Đang kết nối Drive...";
      }

      fetchBookList(false, hasCache);
    }

    async function fetchBookList(forceRefresh = false, hasCache = false) {
      const statusTag = document.getElementById("status-tag");
      if (forceRefresh) {
        statusTag.innerText = "Đang quét lại Drive...";
        renderSkeletonCards(8);
      }

      try {
        const fetchUrl = forceRefresh 
          ? `${GOOGLE_SCRIPT_URL}?refresh=1&t=${Date.now()}` 
          : `${GOOGLE_SCRIPT_URL}?t=${Date.now()}`;

        const response = await fetch(fetchUrl);
        const res = await response.json();

        if (!res.success) throw new Error(res.error);

        const books = res.books || [];
        const oldCache = localStorage.getItem("cached_shelf_books");
        const newCache = JSON.stringify(books);

        localStorage.setItem("cached_shelf_books", newCache);

        if (!hasCache || oldCache !== newCache || forceRefresh) {
          renderBookGrid(books, true);
        }

        statusTag.innerText = "Đã cập nhật mới nhất";

      } catch (err) {
        if (!hasCache) {
          document.getElementById("shelf-grid").innerHTML = `<div style="color:#ef4444; text-align:center; grid-column: 1/-1; padding: 2rem;">Lỗi nạp danh mục: ${err.message}</div>`;
        }
        statusTag.innerText = "Không thể đồng bộ Drive";
      }
    }

    function forceRefreshShelf() {
      fetchBookList(true, false);
    }

    async function fetchAndCachePdf(pdfId, progressCallback) {
      let cached = await getStoredPdf(pdfId);
      if (cached) {
        if (progressCallback) progressCallback(60, "Đã có sẵn trong bộ nhớ đệm", "Mở trực tiếp từ IndexedDB");
        return cached;
      }

      if (activeFetches.has(pdfId)) {
        return activeFetches.get(pdfId);
      }

      const fetchPromise = (async () => {
        try {
          if (progressCallback) progressCallback(20, "Đang tải dữ liệu từ Google Drive...", "Đang kết nối API");
          
          const res = await fetch(`${GOOGLE_SCRIPT_URL}?pdfId=${pdfId}`);
          const data = await res.json();
          
          if (data.success && data.data) {
            if (progressCallback) progressCallback(55, "Đang giải mã luồng tệp tin...", "Chuyển đổi dữ liệu nhị phân");
            await yieldFrame();

            const resBlob = await fetch("data:application/pdf;base64," + data.data);
            const arrayBuf = await resBlob.arrayBuffer();
            const uint8 = new Uint8Array(arrayBuf);
            
            await storePdf(pdfId, uint8);
            return uint8;
          }
        } catch (e) {
          console.warn("Lỗi tải PDF:", e);
        } finally {
          activeFetches.delete(pdfId);
        }
        return null;
      })();

      activeFetches.set(pdfId, fetchPromise);
      return fetchPromise;
    }

    async function prefetchSequentially(chaps) {
      for (const chap of chaps) {
        if (!chap) continue;
        const exists = await getStoredPdf(chap.id);
        if (!exists) {
          await fetchAndCachePdf(chap.id);
        }
      }
    }

    // 2. CHI TIẾT TRUYỆN
    async function openBookDetail(book) {
      selectedBook = book;

      document.getElementById("shelf-view").style.display = "none";
      document.getElementById("reader-view").style.display = "none";
      document.getElementById("detail-view").style.display = "flex";
      document.getElementById("main-header").style.display = "flex";

      document.getElementById("detail-book-title").innerText = book.name;
      document.getElementById("detail-chaps-tag").innerText = `${book.chapCount} Chap`;

      const coverImg = document.getElementById("detail-cover-img");
      if (book.thumbId) {
        coverImg.src = getDriveImageUrl(book.thumbId, 800);
        coverImg.style.display = "block";
      } else {
        coverImg.style.display = "none";
      }

      window.scrollTo(0, 0);

      try {
        const res = await fetch(`${GOOGLE_SCRIPT_URL}?folderId=${book.id}&t=${Date.now()}`);
        const data = await res.json();
        if (data.success) {
          bookChapters = data.chaps || [];
          document.getElementById("detail-chaps-tag").innerText = `${bookChapters.length} Chap`;
          
          if (data.thumbId) {
            coverImg.src = getDriveImageUrl(data.thumbId, 800);
            coverImg.style.display = "block";
          }
          renderDetailChapGrid(book.id, bookChapters);

          prefetchSequentially([bookChapters[0], bookChapters[1]]);
        }
      } catch (e) {
        console.error("Lỗi lấy danh sách chap:", e);
      }
    }

    function renderDetailChapGrid(bookId, chaps) {
      const grid = document.getElementById("detail-chap-grid");
      grid.innerHTML = "";
      const readList = getReadChapters(bookId);

      chaps.forEach((chap, idx) => {
        const isRead = readList.includes(idx);
        const btn = document.createElement("div");
        btn.className = `chap-item ${isRead ? 'read' : 'unread'}`;
        btn.innerHTML = `<div>Chap ${idx + 1}</div>`;
        btn.onclick = () => startReadingChapter(idx);
        grid.appendChild(btn);
      });
    }

    function readFromBeginning() {
      startReadingChapter(0);
    }

    // ==========================================================
    // 3. MỞ ĐỌC DẠNG CUỘN DỌC - CHẤT LƯỢNG CAO
    // ==========================================================
    async function startReadingChapter(chapIdx = 0) {
      if (!selectedBook || !bookChapters[chapIdx]) return;

      const sessionId = ++currentSessionId;
      currentChapIndex = chapIdx;

      resetZoom();
      
      if (pageObserver) pageObserver.disconnect();
      if (scrollTrackerObserver) scrollTrackerObserver.disconnect();

      const chapFile = bookChapters[chapIdx];

      document.getElementById("main-header").style.display = "none";
      document.getElementById("detail-view").style.display = "none";
      document.getElementById("reader-view").style.display = "flex";
      document.getElementById("current-chap-label").innerText = `Chap ${chapIdx + 1}`;

      const overlay = document.getElementById("loading-book-overlay");
      overlay.classList.remove("hide");

      const wrapper = document.getElementById("scroll-pages-wrapper");
      wrapper.innerHTML = "";
      document.getElementById("end-chap-nav").style.display = "none";
      document.getElementById("reader-scroll-container").scrollTop = 0;

      setBookProgress(12, `Đang kết nối Chap ${chapIdx + 1}...`, "Giai đoạn 1/4: Thiết lập kênh truyền");
      await yieldFrame();

      let fakeProgress = 15;
      const progressTicker = setInterval(() => {
        if (fakeProgress < 48) {
          fakeProgress += 6;
          setBookProgress(fakeProgress, `Đang nhận dữ liệu Chap ${chapIdx + 1}...`, "Giai đoạn 1/4: Đang tải tệp tin");
        }
      }, 160);

      try {
        const pdfBytes = await fetchAndCachePdf(chapFile.id, (pct, title, detail) => {
          clearInterval(progressTicker);
          setBookProgress(pct, title, detail);
        });
        clearInterval(progressTicker);

        if (sessionId !== currentSessionId) return;
        if (!pdfBytes) throw new Error("Không thể tải file PDF Chap.");

        setBookProgress(68, "Khởi tạo công cụ đọc...", "Giai đoạn 2/4: Phân tích cấu trúc tệp PDF");
        await yieldFrame();

        currentPdfDoc = await pdfjsLib.getDocument({ data: pdfBytes }).promise;
        currentNumPages = currentPdfDoc.numPages;

        if (currentNumPages === 0) throw new Error("File PDF rỗng.");

        document.getElementById("current-page").innerText = "1";
        document.getElementById("total-pages").innerText = currentNumPages;

        setBookProgress(82, "Đang chuẩn bị khung trang...", `Giai đoạn 3/4: Đã xác nhận ${currentNumPages} trang`);
        await yieldFrame();

        const page1 = await currentPdfDoc.getPage(1);
        const vp1 = page1.getViewport({ scale: 1.0 });

        for (let p = 1; p <= currentNumPages; p++) {
          const container = document.createElement("div");
          container.className = "pdf-page-container";
          container.dataset.page = p;
          container.dataset.rendered = "false";
          container.style.aspectRatio = `${vp1.width} / ${vp1.height}`;

          const loadingTxt = document.createElement("div");
          loadingTxt.className = "page-loading-skeleton";
          loadingTxt.innerText = `Trang ${p}`;
          container.appendChild(loadingTxt);

          wrapper.appendChild(container);
        }

        pageObserver = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const el = entry.target;
              if (el.dataset.rendered === "false") {
                el.dataset.rendered = "true";
                renderSinglePage(parseInt(el.dataset.page), el);
              }
            }
          });
        }, {
          root: document.getElementById("reader-scroll-container"),
          rootMargin: "500px 0px"
        });

        scrollTrackerObserver = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              document.getElementById("current-page").innerText = entry.target.dataset.page;
            }
          });
        }, {
          root: document.getElementById("reader-scroll-container"),
          threshold: 0.3
        });

        const allContainers = wrapper.querySelectorAll(".pdf-page-container");
        allContainers.forEach(c => {
          pageObserver.observe(c);
          scrollTrackerObserver.observe(c);
        });

        setBookProgress(95, "Đang dựng trang bìa nét cao...", "Giai đoạn 4/4: Hoàn thiện chất lượng ảnh");
        await yieldFrame();

        const firstPageEl = allContainers[0];
        if (firstPageEl) {
          firstPageEl.dataset.rendered = "true";
          await renderSinglePage(1, firstPageEl);
        }

        const btnPrev = document.getElementById("btn-prev-chap");
        const btnNext = document.getElementById("btn-next-chap");
        btnPrev.style.display = (chapIdx > 0) ? "inline-flex" : "none";
        btnNext.style.display = (chapIdx + 1 < bookChapters.length) ? "inline-flex" : "none";
        document.getElementById("end-chap-nav").style.display = "flex";

        markChapAsRead(selectedBook.id, chapIdx);

        setBookProgress(100, "Sẵn sàng!", "Mời bạn thưởng thức truyện");
        await new Promise(r => setTimeout(r, 180));
        overlay.classList.add("hide");

        prefetchSequentially([bookChapters[chapIdx + 1], bookChapters[chapIdx + 2]]);

      } catch (err) {
        clearInterval(progressTicker);
        if (sessionId === currentSessionId) {
          alert("Lỗi tải Chap: " + err.message);
          backToDetail();
        }
      }
    }

    // VẼ TRANG ĐỘ NÉT CAO (ĐẢM BẢO KHÔNG BỊ VỠ NÉT TRÊN MOBILE VÀ KHI ZOOM)
    async function renderSinglePage(pageNum, container) {
      if (!currentPdfDoc) return;

      // Hủy task vẽ cũ nếu đang vẽ dở để tránh xung đột PDF.js
      if (container._renderTask) {
        try { container._renderTask.cancel(); } catch (e) {}
        container._renderTask = null;
      }

      try {
        const page = await currentPdfDoc.getPage(pageNum);
        const baseVp = page.getViewport({ scale: 1.0 });

        // Cân bằng pixel ratio cho màn hình di động Retina/OLED
        const dpr = Math.max(window.devicePixelRatio || 1, 2.0);
        const containerWidth = container.clientWidth || (window.innerWidth <= 768 ? window.innerWidth : BASE_READER_WIDTH);

        // Đảm bảo chiều rộng pixel vẽ ra luôn đạt tối thiểu 1600px để không bị vỡ hạt
        const targetPixelWidth = Math.max(Math.round(containerWidth * dpr), 1600);
        const scale = targetPixelWidth / baseVp.width;

        const viewport = page.getViewport({ scale: scale });

        let canvas = container.querySelector("canvas");
        if (!canvas) {
          canvas = document.createElement("canvas");
          container.innerHTML = "";
          container.appendChild(canvas);
        }
        
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        canvas.style.width = "100%";
        canvas.style.height = "auto";
        container.style.aspectRatio = "";

        const ctx = canvas.getContext("2d", { alpha: false });
        const renderTask = page.render({
          canvasContext: ctx,
          viewport: viewport
        });
        container._renderTask = renderTask;

        await renderTask.promise;
        container._renderTask = null;
        container.dataset.rendered = "true";

      } catch (e) {
        if (e.name !== "RenderingCancelledException") {
          console.error("Lỗi render trang " + pageNum, e);
        }
      }
    }

    // ==========================================================
    // 4. HỆ THỐNG ZOOM CHUNG (DEBOUNCED RE-RENDER CHỐNG MỜ)
    // ==========================================================
    function applyZoom(val) {
      currentZoomPercent = Math.max(60, Math.min(220, parseInt(val)));
      const slider = document.getElementById("zoom-slider");
      const valLabel = document.getElementById("zoom-val");
      
      if (slider) slider.value = currentZoomPercent;
      if (valLabel) valLabel.innerText = currentZoomPercent + "%";
      
      const isMobile = window.innerWidth <= 768;
      let targetWidth;

      if (isMobile) {
        const baseMobileWidth = window.innerWidth;
        targetWidth = Math.round(baseMobileWidth * (currentZoomPercent / 100));
      } else {
        targetWidth = Math.round(BASE_READER_WIDTH * (currentZoomPercent / 100));
      }

      document.documentElement.style.setProperty('--reader-max-width', `${targetWidth}px`);
      document.documentElement.style.setProperty('--reader-width', `${targetWidth}px`);

      // Tự động render lại các trang đang xem để cập nhật độ sắc nét
      clearTimeout(zoomDebounceTimer);
      zoomDebounceTimer = setTimeout(() => {
        reRenderVisiblePages();
      }, 280);
    }

    function reRenderVisiblePages() {
      const containers = document.querySelectorAll(".pdf-page-container");
      const scrollBox = document.getElementById("reader-scroll-container");
      if (!scrollBox || !containers.length) return;

      const boxRect = scrollBox.getBoundingClientRect();
      const buffer = 400; // Bao gồm các trang gần khung nhìn

      containers.forEach(container => {
        const rect = container.getBoundingClientRect();
        const isVisible = (rect.bottom >= boxRect.top - buffer && rect.top <= boxRect.bottom + buffer);

        if (isVisible) {
          const pageNum = parseInt(container.dataset.page);
          renderSinglePage(pageNum, container);
        } else {
          // Đánh dấu để IntersectionObserver vẽ lại nét cao khi cuộn tới
          container.dataset.rendered = "false";
        }
      });
    }

    function onZoomSlider(val) {
      applyZoom(val);
    }

    function stepZoom(delta) {
      applyZoom(currentZoomPercent + delta);
    }

    function resetZoom() {
      applyZoom(100);
    }

    window.addEventListener("resize", () => {
      if (document.getElementById("reader-view").style.display === "flex") {
        applyZoom(currentZoomPercent);
      }
    });

    // ==========================================
    // ĐIỀU HƯỚNG & PHÍM TẮT
    // ==========================================
    function scrollToTop() {
      document.getElementById("reader-scroll-container").scrollTo({ top: 0, behavior: "smooth" });
    }

    function prevChapter() {
      if (currentChapIndex > 0) {
        startReadingChapter(currentChapIndex - 1);
      }
    }

    function nextChapter() {
      if (currentChapIndex + 1 < bookChapters.length) {
        startReadingChapter(currentChapIndex + 1);
      }
    }

    function openChapModal() {
      if (!bookChapters.length) return;
      const readList = getReadChapters(selectedBook.id);
      const grid = document.getElementById("modal-chap-grid");
      grid.innerHTML = "";

      bookChapters.forEach((chap, c) => {
        const isRead = readList.includes(c);
        const isActive = (c === currentChapIndex);

        const btn = document.createElement("div");
        btn.className = `chap-item ${isRead ? 'read' : 'unread'} ${isActive ? 'active' : ''}`;
        btn.innerHTML = `<div>Chap ${c + 1}</div>`;
        btn.onclick = () => {
          closeChapModal();
          startReadingChapter(c);
        };
        grid.appendChild(btn);
      });

      document.getElementById("chap-modal").style.display = "flex";
    }

    function closeChapModal() {
      document.getElementById("chap-modal").style.display = "none";
    }

    function backToDetail() {
      currentSessionId++;
      resetZoom();
      if (pageObserver) pageObserver.disconnect();
      if (scrollTrackerObserver) scrollTrackerObserver.disconnect();

      document.getElementById("reader-view").style.display = "none";
      document.getElementById("scroll-pages-wrapper").innerHTML = "";

      if (selectedBook) {
        openBookDetail(selectedBook);
      } else {
        backToShelf();
      }
    }

    function backToShelf() {
      currentSessionId++;
      resetZoom();
      if (pageObserver) pageObserver.disconnect();
      if (scrollTrackerObserver) scrollTrackerObserver.disconnect();

      document.getElementById("reader-view").style.display = "none";
      document.getElementById("detail-view").style.display = "none";
      document.getElementById("shelf-view").style.display = "block";
      document.getElementById("main-header").style.display = "flex";

      document.getElementById("scroll-pages-wrapper").innerHTML = "";
      selectedBook = null;
    }

    window.addEventListener("keydown", (e) => {
      if (document.getElementById("reader-view").style.display === "flex") {
        if (e.key === "ArrowLeft") prevChapter();
        if (e.key === "ArrowRight") nextChapter();
      }
    });

    window.addEventListener("DOMContentLoaded", initShelf);
  </script>
</body>
