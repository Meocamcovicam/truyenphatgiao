<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tủ Sách Điện Tử - Flipbook Reader</title>
  
  <!-- PDF.js Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    header {
      height: 50px;
      padding: 0 1.2rem;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      z-index: 20;
    }
    header h1 { 
      font-size: 1.15rem; 
      font-weight: 600; 
      color: var(--accent); 
      cursor: pointer;
      user-select: none;
      transition: opacity 0.2s;
    }
    header h1:hover { opacity: 0.8; text-decoration: underline; }
    
    /* GIAO DIỆN 1: KỆ SÁCH (HOME) */
    #shelf-view {
      padding: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.2rem;
      margin-top: 1.2rem;
    }
    .book-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      border: 1px solid #334155;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .book-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      border-color: var(--accent);
    }
    
    .book-cover {
      height: 230px;
      background: #090e1a;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.8rem;
      overflow: hidden;
      position: relative;
      border: 1px solid #334155;
    }
    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
      transition: transform 0.3s ease;
    }
    .book-card:hover .cover-img { transform: scale(1.04); }

    .book-title {
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 0.4rem;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .book-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: auto;
    }

    /* GIAO DIỆN 2: CHI TIẾT TRUYỆN & CHỌN CHAP */
    #detail-view {
      display: none;
      padding: 1.5rem;
      max-width: 950px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
      flex-direction: column;
      gap: 1.5rem;
    }
    .detail-card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid #334155;
      padding: 1.5rem;
      display: flex;
      gap: 1.8rem;
      box-shadow: 0 15px 30px rgba(0,0,0,0.3);
    }
    .detail-cover-box {
      width: 220px;
      min-width: 220px;
      height: 310px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #475569;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      background: #090e1a;
    }
    .detail-cover-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }
    .detail-info {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
    }
    .detail-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.35;
      margin-bottom: 0.8rem;
    }
    .detail-meta-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
    }
    .meta-tag {
      background: #334155;
      color: var(--accent);
      padding: 0.35rem 0.8rem;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 500;
    }
    .btn-read-start {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #0f172a;
      border: none;
      padding: 0.8rem 1.8rem;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      width: fit-content;
      transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
    }
    .btn-read-start:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.45);
    }

    .chap-section {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid #334155;
      padding: 1.5rem;
    }
    .chap-section-header {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
      padding-bottom: 0.8rem;
    }
    .chap-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 0.75rem;
    }
    .chap-item {
      padding: 0.75rem 0.5rem;
      border-radius: 8px;
      border: 1px solid #334155;
      text-align: center;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      transition: all 0.2s;
      user-select: none;
    }
    .chap-item.unread {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }
    .chap-item.unread:hover { background: #0369a1; transform: translateY(-2px); }
    .chap-item.read {
      background: #1e293b;
      color: #94a3b8;
      border-color: #334155;
    }
    .chap-item.read:hover { background: #334155; color: #ffffff; }

    /* GIAO DIỆN 3: TRÌNH ĐỌC TRUYỆN SIÊU NÉT (DIRECT CANVAS) */
    #reader-view {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: calc(100vh - 50px);
      padding: 0.3rem 0.5rem;
      box-sizing: border-box;
      overflow: hidden;
      position: relative;
    }
    .reader-toolbar {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.2rem 0;
      flex-shrink: 0;
      z-index: 5;
      gap: 0.5rem;
    }
    .btn {
      background: #334155;
      color: white;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: background 0.2s, transform 0.1s;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      white-space: nowrap;
    }
    .btn:hover { background: #475569; }
    .btn-accent { background: var(--accent-hover); }
    .btn-accent:hover { background: #0369a1; }

    .zoom-toolbar {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background: #1e293b;
      padding: 0.25rem 0.6rem;
      border-radius: 8px;
      border: 1px solid #334155;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .zoom-toolbar input[type="range"] {
      width: 90px;
      height: 5px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .zoom-toolbar span {
      font-size: 0.8rem;
      min-width: 40px;
      text-align: center;
      color: var(--accent);
      font-weight: 600;
    }
    .btn-icon {
      background: #334155;
      color: white;
      border: none;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      line-height: 1;
      transition: background 0.2s;
    }
    .btn-icon:hover { background: #475569; }

    .bottom-bar {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.8rem;
      padding: 0.2rem 0;
      flex-shrink: 0;
      flex-wrap: wrap;
      z-index: 5;
    }

    #book-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1;
      width: 100%;
      min-height: 0;
      overflow: hidden;
      user-select: none;
      touch-action: pan-y;
    }

    /* KHUNG HIỂN THỊ TRANG CANVAS HI-DPI */
    #page-stage {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transform-origin: center center;
      transition: transform 0.05s linear;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .canvas-page-wrapper {
      background: #090e1a;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      border-radius: 4px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    /* Đảm bảo Canvas luôn được khử răng cưa và sắc nét tối đa */
    .canvas-page-wrapper canvas {
      display: block;
      object-fit: contain;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: high-quality;
    }

    #chap-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(6px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-content {
      background: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 12px;
      width: 100%;
      max-width: 550px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
    }
    .modal-header {
      padding: 1rem 1.2rem;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-body {
      padding: 1rem;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 0.6rem;
    }

    .progress-box {
      width: 100%;
      max-width: 380px;
      background: #1e293b;
      padding: 1.25rem;
      border-radius: 12px;
      border: 1px solid #334155;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }
    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .progress-track {
      width: 100%;
      height: 8px;
      background: #334155;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      border-radius: 999px;
      transition: width 0.12s ease-out;
    }

    #loading-book-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(8px);
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    @media (max-width: 768px) {
      .detail-card {
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 1.2rem;
      }
      .detail-cover-box {
        width: 180px;
        min-width: 180px;
        height: 250px;
      }
      .detail-info { align-items: center; }
      .detail-meta-tags { justify-content: center; }
      .btn-read-start { width: 100%; justify-content: center; }
    }

    @media (max-width: 600px) {
      header { height: 46px; padding: 0 0.8rem; }
      header h1 { font-size: 1rem; }
      #reader-view { height: calc(100vh - 46px); }
      #current-book-name { max-width: 35% !important; font-size: 0.8rem !important; }
      .reader-toolbar { font-size: 0.8rem !important; }
      .btn { padding: 0.35rem 0.65rem; font-size: 0.78rem; }
      .zoom-toolbar input[type="range"] { width: 65px; }
      .book-cover { height: 190px; }
      .chap-grid, .modal-body { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
    }
  </style>
</head>
<body>

  <header>
    <h1 onclick="backToShelf()" title="Bấm để quay về danh mục sách">Tủ Sách Trực Tuyến</h1>
    <div id="status-tag" style="font-size: 0.8rem; color: var(--text-muted);">Đang kết nối...</div>
  </header>

  <!-- MÀN HÌNH 1: KỆ SÁCH (HOME) -->
  <main id="shelf-view">
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 0.8rem; margin-bottom: 0.5rem;">
      <h2>Danh mục truyện tranh</h2>
      <span id="file-counter" style="color: var(--text-muted); font-size: 0.9rem;"></span>
    </div>

    <div id="loading-shelf" style="display: flex; justify-content: center; padding: 3rem 1rem;">
      <div class="progress-box">
        <div class="progress-header">
          <span id="shelf-prog-text">Đang đồng bộ Google Drive...</span>
          <span id="shelf-prog-pct" style="color: var(--accent);">0%</span>
        </div>
        <div class="progress-track">
          <div id="shelf-prog-bar" class="progress-fill"></div>
        </div>
      </div>
    </div>

    <div id="shelf-grid" class="grid"></div>
  </main>

  <!-- MÀN HÌNH 2: CHI TIẾT TRUYỆN & DANH SÁCH CHAP -->
  <div id="detail-view">
    <div style="display: flex; justify-content: flex-start;">
      <button class="btn" onclick="backToShelf()">← Quay lại kệ sách</button>
    </div>

    <div class="detail-card">
      <div class="detail-cover-box">
        <img id="detail-cover-img" src="" alt="Thumbnail" />
      </div>
      <div class="detail-info">
        <div>
          <div class="detail-title" id="detail-book-title">Tên truyện</div>
          <div class="detail-meta-tags">
            <span class="meta-tag" id="detail-chaps-tag">-- Chap</span>
          </div>
        </div>
        
        <button class="btn-read-start" onclick="readFromBeginning()">
          📖 Đọc từ đầu
        </button>
      </div>
    </div>

    <div class="chap-section">
      <div class="chap-section-header">
        <span>Danh sách Chapter (File PDF)</span>
      </div>
      <div class="chap-grid" id="detail-chap-grid"></div>
    </div>
  </div>

  <!-- MÀN HÌNH 3: TRÌNH ĐỌC TRUYỆN SIÊU NÉT (DIRECT CANVAS) -->
  <div id="reader-view">
    <div class="reader-toolbar">
      <button class="btn" onclick="backToDetail()">← Danh mục chap</button>
      <span id="current-book-name" style="font-weight: 600; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></span>
      
      <button class="btn btn-accent" onclick="openChapModal()">
        📚 <span id="current-chap-label">Chap 1</span> ▾
      </button>

      <div style="font-size: 0.85rem;">
        Trang <span id="current-page">1</span>
      </div>
    </div>

    <div id="loading-book-overlay">
      <div class="progress-box">
        <div class="progress-header">
          <span id="book-prog-text">Đang tải dữ liệu Chap...</span>
          <span id="book-prog-pct" style="color: var(--accent);">0%</span>
        </div>
        <div class="progress-track">
          <div id="book-prog-bar" class="progress-fill"></div>
        </div>
      </div>
    </div>

    <div id="book-wrapper">
      <div id="page-stage"></div>
    </div>

    <div class="bottom-bar">
      <button class="btn" onclick="prevPage()">‹ Trang trước</button>
      
      <div class="zoom-toolbar">
        <button class="btn-icon" onclick="stepZoom(-0.2)" title="Thu nhỏ">−</button>
        <input type="range" id="zoom-slider" min="1" max="2.5" step="0.05" value="1" oninput="onZoomSlider(this.value)">
        <button class="btn-icon" onclick="stepZoom(0.2)" title="Phóng to">+</button>
        <span id="zoom-val">100%</span>
        <button class="btn-icon" onclick="resetZoom()" title="Về 100%">↺</button>
      </div>

      <button class="btn" onclick="nextPage()">Trang sau ›</button>
    </div>
  </div>

  <!-- POPUP CHỌN CHAPTER NHANH -->
  <div id="chap-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="font-size: 1rem;">Chuyển nhanh Chapter</h3>
        <button class="btn" onclick="closeChapModal()">✕ Đóng</button>
      </div>
      <div class="modal-body" id="modal-chap-grid"></div>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxOwmO8RSpnp9xgWBCBvBkPyVDmtjtuon9nWWNibD_E8FalOFEf7zRQPeeVVTtrM03D-g/exec";

    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    let currentSessionId = 0;
    let selectedBook = null;
    let bookChapters = [];
    let currentChapIndex = 0;
    let currentPdfDoc = null;
    let currentNumPages = 0;
    let curPageNum = 1;
    let isRendering = false;

    // Quản lý Zoom & Pan
    let currentZoom = 1;
    let currentPanX = 0;
    let currentPanY = 0;
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;

    let singlePageW = 400;
    let singlePageH = 600;
    let isMobileView = false;

    const memoryPdfCache = new Map();

    function openPdfDB() {
      return new Promise((resolve) => {
        const req = indexedDB.open("MangaPdfStore_v4", 1);
        req.onupgradeneeded = (e) => e.target.result.createObjectStore("chap_pdfs");
        req.onsuccess = (e) => resolve(e.target.result);
        req.onerror = () => resolve(null);
      });
    }

    async function getStoredPdf(pdfId) {
      if (memoryPdfCache.has(pdfId)) return memoryPdfCache.get(pdfId);
      try {
        const db = await openPdfDB();
        if (!db) return null;
        return new Promise((resolve) => {
          const tx = db.transaction("chap_pdfs", "readonly");
          const req = tx.objectStore("chap_pdfs").get(pdfId);
          req.onsuccess = () => {
            if (req.result) memoryPdfCache.set(pdfId, req.result);
            resolve(req.result || null);
          };
          req.onerror = () => resolve(null);
        });
      } catch (e) { return null; }
    }

    async function storePdf(pdfId, uint8Array) {
      memoryPdfCache.set(pdfId, uint8Array);
      try {
        const db = await openPdfDB();
        if (!db) return;
        const tx = db.transaction("chap_pdfs", "readwrite");
        tx.objectStore("chap_pdfs").put(uint8Array, pdfId);
      } catch (e) {}
    }

    function getDriveImageUrl(fileId, size = 800) {
      return `https://lh3.googleusercontent.com/d/${fileId}=w${size}`;
    }

    function setShelfProgress(pct, text) {
      document.getElementById("shelf-prog-bar").style.width = pct + "%";
      document.getElementById("shelf-prog-pct").innerText = Math.round(pct) + "%";
      if (text) document.getElementById("shelf-prog-text").innerText = text;
    }

    function setBookProgress(pct, text) {
      document.getElementById("book-prog-bar").style.width = pct + "%";
      document.getElementById("book-prog-pct").innerText = Math.round(pct) + "%";
      if (text) document.getElementById("book-prog-text").innerText = text;
