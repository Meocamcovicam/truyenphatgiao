<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tủ Sách Điện Tử - Flipbook Reader</title>
  
  <!-- PageFlip (Hiệu ứng lật sách 3D) -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --chap-read: #334155;
      --chap-unread: #0284c7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    header {
      height: 50px;
      padding: 0 1.2rem;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      z-index: 20;
    }
    header h1 { 
      font-size: 1.15rem; 
      font-weight: 600; 
      color: var(--accent); 
      cursor: pointer;
      user-select: none;
      transition: opacity 0.2s;
    }
    header h1:hover { opacity: 0.8; text-decoration: underline; }
    
    /* Giao diện Kệ Sách */
    #shelf-view {
      padding: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.2rem;
      margin-top: 1.2rem;
    }
    .book-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      border: 1px solid #334155;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .book-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      border-color: var(--accent);
    }
    
    .book-cover {
      height: 230px;
      background: #090e1a;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.8rem;
      overflow: hidden;
      position: relative;
      border: 1px solid #334155;
    }
    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
      transition: transform 0.3s ease;
    }
    .book-card:hover .cover-img { transform: scale(1.04); }

    .book-title {
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 0.4rem;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .book-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: auto;
    }

    /* Giao diện Trình đọc Lật sách */
    #reader-view {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: calc(100vh - 50px);
      padding: 0.3rem 0.5rem;
      box-sizing: border-box;
      overflow: hidden;
      position: relative;
    }
    .reader-toolbar {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.2rem 0;
      flex-shrink: 0;
      z-index: 5;
      gap: 0.5rem;
    }
    .btn {
      background: #334155;
      color: white;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: background 0.2s, transform 0.1s;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      white-space: nowrap;
    }
    .btn:hover { background: #475569; }
    .btn-accent { background: var(--accent-hover); }
    .btn-accent:hover { background: #0369a1; }

    /* Khung chứa sách */
    #book-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1;
      width: 100%;
      min-height: 0;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      touch-action: pan-y;
    }
    
    .page-box {
      background-color: #0b1120;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .page-img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      pointer-events: none;
    }

    .page-skeleton {
      color: #64748b;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0.5rem;
      position: absolute;
      inset: 0;
      background: #0b1120;
    }

    /* Modal / Drawer Danh sách Chap */
    #chap-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(6px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-content {
      background: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 12px;
      width: 100%;
      max-width: 550px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
    }
    .modal-header {
      padding: 1rem 1.2rem;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-body {
      padding: 1rem;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 0.6rem;
    }
    
    /* Style Nút Chap (Màu khác nhau giữa đã đọc & chưa đọc) */
    .chap-btn {
      padding: 0.6rem;
      border-radius: 8px;
      border: 1px solid #334155;
      text-align: center;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s;
    }
    /* Chap CHƯA ĐỌC */
    .chap-btn.unread {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }
    .chap-btn.unread:hover {
      background: #0369a1;
    }
    /* Chap ĐÃ ĐỌC */
    .chap-btn.read {
      background: #1e293b;
      color: #94a3b8;
      border-color: #334155;
    }
    .chap-btn.read:hover {
      background: #334155;
      color: #ffffff;
    }
    /* Chap ĐANG ĐỌC HIỆN TẠI */
    .chap-btn.active {
      border: 2px solid var(--accent);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }

    /* Progress UI */
    .progress-box {
      width: 100%;
      max-width: 380px;
      background: #1e293b;
      padding: 1.25rem;
      border-radius: 12px;
      border: 1px solid #334155;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }
    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .progress-track {
      width: 100%;
      height: 8px;
      background: #334155;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      border-radius: 999px;
      transition: width 0.2s ease-out;
    }

    #loading-book-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(8px);
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid #334155;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 600px) {
      header { height: 46px; padding: 0 0.8rem; }
      header h1 { font-size: 1rem; }
      #reader-view { height: calc(100vh - 46px); }
      #current-book-name { max-width: 35% !important; font-size: 0.8rem !important; }
      .reader-toolbar { font-size: 0.8rem !important; }
      .btn { padding: 0.35rem 0.65rem; font-size: 0.78rem; }
      .book-cover { height: 190px; }
      .modal-body { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
    }
  </style>
</head>
<body>

  <header>
    <h1 onclick="backToShelf()" title="Bấm để quay về danh mục sách">Tủ Sách Trực Tuyến</h1>
    <div id="status-tag" style="font-size: 0.8rem; color: var(--text-muted);">Đang kết nối...</div>
  </header>

  <!-- MÀN HÌNH 1: KỆ SÁCH -->
  <main id="shelf-view">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <h2>Danh mục truyện tranh</h2>
      <span id="file-counter" style="color: var(--text-muted); font-size: 0.9rem;"></span>
    </div>

    <!-- Thanh tiến trình nạp kệ sách -->
    <div id="loading-shelf" style="display: flex; justify-content: center; padding: 3rem 1rem;">
      <div class="progress-box">
        <div class="progress-header">
          <span id="shelf-prog-text">Tải nhanh danh sách...</span>
          <span id="shelf-prog-pct" style="color: var(--accent);">0%</span>
        </div>
        <div class="progress-track">
          <div id="shelf-prog-bar" class="progress-fill"></div>
        </div>
      </div>
    </div>

    <div id="shelf-grid" class="grid"></div>
  </main>

  <!-- MÀN HÌNH 2: TRÌNH ĐỌC LẬT SÁCH -->
  <div id="reader-view">
    <div class="reader-toolbar">
      <button class="btn" onclick="backToShelf()">← Kệ sách</button>
      <span id="current-book-name" style="font-weight: 600; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></span>
      
      <button class="btn btn-accent" onclick="openChapModal()">
        📚 <span id="current-chap-label">Chap 1</span> ▾
      </button>

      <div style="font-size: 0.85rem;">
        Trang <span id="current-page">1</span> / <span id="total-pages">--</span>
      </div>
    </div>

    <!-- Overlay tiến trình nạp sách -->
    <div id="loading-book-overlay">
      <div class="progress-box">
        <div class="progress-header">
          <span id="book-prog-text">Đang kết nối...</span>
          <span id="book-prog-pct" style="color: var(--accent);">0%</span>
        </div>
        <div class="progress-track">
          <div id="book-prog-bar" class="progress-fill"></div>
        </div>
      </div>
    </div>

    <!-- Vùng lật sách -->
    <div id="book-wrapper"></div>

    <div class="reader-toolbar" style="justify-content: center; gap: 1rem;">
      <button class="btn" onclick="prevPage()">‹ Trang trước</button>
      <button class="btn" onclick="nextPage()">Trang sau ›</button>
    </div>
  </div>

  <!-- POPUP CHỌN CHAPTER -->
  <div id="chap-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="font-size: 1rem;">Danh mục Chapter</h3>
        <button class="btn" onclick="closeChapModal()">✕ Đóng</button>
      </div>
      <div class="modal-body" id="chap-list-grid"></div>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxOwmO8RSpnp9xgWBCBvBkPyVDmtjtuon9nWWNibD_E8FalOFEf7zRQPeeVVTtrM03D-g/exec";
    const PAGES_PER_CHAP = 20; // Cấu hình số trang mỗi Chap

    let pageFlipInstance = null;
    let currentSessionId = 0;
    let currentBookId = "";
    let currentPages = [];
    let loadedImageSet = new Set();
    let isFlipping = false;

    function getDriveImageUrl(fileId, size = 1600) {
      return `https://lh3.googleusercontent.com/d/${fileId}=w${size}`;
    }

    function setShelfProgress(pct, text) {
      document.getElementById("shelf-prog-bar").style.width = pct + "%";
      document.getElementById("shelf-prog-pct").innerText = Math.round(pct) + "%";
      if (text) document.getElementById("shelf-prog-text").innerText = text;
    }

    function setBookProgress(pct, text) {
      document.getElementById("book-prog-bar").style.width = pct + "%";
      document.getElementById("book-prog-pct").innerText = Math.round(pct) + "%";
      if (text) document.getElementById("book-prog-text").innerText = text;
    }

    /* Quản lý vết Chap đã đọc bằng LocalStorage */
    function getReadChapters(bookId) {
      try {
        const data = localStorage.getItem(`read_chaps_${bookId}`);
        return data ? JSON.parse(data) : [];
      } catch (e) { return []; }
    }

    function markChapAsRead(bookId, chapIndex) {
      if (!bookId) return;
      const readList = getReadChapters(bookId);
      if (!readList.includes(chapIndex)) {
        readList.push(chapIndex);
        try {
          localStorage.setItem(`read_chaps_${bookId}`, JSON.stringify(readList));
        } catch (e) {}
      }
    }

    // 1. Tải nhanh danh sách truyện (Tối ưu caching & render tức thì)
    async function fetchBookList() {
      // Kiếm tra cache trong localStorage
      const cachedBooks = localStorage.getItem("cached_book_list");
      if (cachedBooks) {
        try {
          const books = JSON.parse(cachedBooks);
          renderBookGrid(books);
          document.getElementById("loading-shelf").style.display = "none";
          document.getElementById("status-tag").innerText = "Đã tải từ Cache (Đang cập nhật...)";
        } catch(e) {}
      }

      setShelfProgress(40, "Đang đồng bộ từ Google Drive...");

      try {
        const response = await fetch(GOOGLE_SCRIPT_URL);
        const res = await response.json();

        if (!res.success) throw new Error(res.error);

        setShelfProgress(100, "Thành công!");
        setTimeout(() => {
          document.getElementById("loading-shelf").style.display = "none";
        }, 200);

        const books = res.books || [];
        localStorage.setItem("cached_book_list", JSON.stringify(books));
        
        renderBookGrid(books);
        document.getElementById("status-tag").innerText = "Đã đồng bộ Drive";

      } catch (err) {
        if (!cachedBooks) {
          document.getElementById("loading-shelf").innerHTML = `<div style="color:#ef4444; text-align:center;">Lỗi nạp danh mục: ${err.message}</div>`;
        }
      }
    }

    function renderBookGrid(books) {
      document.getElementById("file-counter").innerText = `Tổng cộng: ${books.length} bộ`;
      const shelfGrid = document.getElementById("shelf-grid");
      shelfGrid.innerHTML = "";

      books.forEach(book => {
        const card = document.createElement("div");
        card.className = "book-card";
        const thumbSrc = book.thumbId ? getDriveImageUrl(book.thumbId, 600) : "";

        card.innerHTML = `
          <div class="book-cover">
            ${book.thumbId ? `
              <img src="${thumbSrc}" 
                   alt="${book.name}" 
                   class="cover-img" 
                   loading="lazy" 
                   onerror="this.style.display='none';" />
            ` : ''}
          </div>
          <div class="book-title" title="${book.name}">${book.name}</div>
          <div class="book-meta">${book.pageCount} trang • ${Math.ceil(book.pageCount / PAGES_PER_CHAP)} Chap</div>
        `;
        card.onclick = () => openComicBook(book.id, book.name);
        shelfGrid.appendChild(card);
      });
    }

    // 2. Nạp ảnh đơn lẻ theo nhu cầu (Lazy Load)
    function loadPageImage(pageIndex, sessionId) {
      if (sessionId !== currentSessionId) return Promise.resolve();
      if (pageIndex < 0 || pageIndex >= currentPages.length) return Promise.resolve();
      if (loadedImageSet.has(pageIndex)) return Promise.resolve();

      loadedImageSet.add(pageIndex);
      const img = document.getElementById(`page-img-${pageIndex}`);
      const skel = document.getElementById(`page-skel-${pageIndex}`);

      if (!img || !skel) return Promise.resolve();

      return new Promise((resolve) => {
        const fileId = currentPages[pageIndex].id;
        img.src = getDriveImageUrl(fileId, 1600);
        
        img.onload = () => {
          if (sessionId === currentSessionId) {
            skel.style.display = "none";
            img.style.display = "block";
          }
          resolve();
        };
        img.onerror = () => {
          img.src = `https://drive.google.com/thumbnail?id=${fileId}&sz=w1600`;
          img.onload = () => {
            if (sessionId === currentSessionId) {
              skel.style.display = "none";
              img.style.display = "block";
            }
            resolve();
          };
          img.onerror = () => resolve();
        };
      });
    }

    /* CHỈ NẠP ẢNH TRONG PHẠM VI CHAP HIỆN TẠI (TRÁNH NẠP TRỒNG TẤT CẢ) */
    function loadCurrentChapterImages(pageIndex, sessionId) {
      const chapIndex = Math.floor(pageIndex / PAGES_PER_CHAP);
      const startPage = chapIndex * PAGES_PER_CHAP;
      const endPage = Math.min(currentPages.length - 1, startPage + PAGES_PER_CHAP - 1);

      // Đánh dấu Chap hiện tại là ĐÃ ĐỌC
      markChapAsRead(currentBookId, chapIndex);
      document.getElementById("current-chap-label").innerText = `Chap ${chapIndex + 1}`;

      // Nạp từ từ các trang thuộc Chap này
      for (let p = startPage; p <= endPage; p++) {
        loadPageImage(p, sessionId);
      }

      // Nạp đệm thêm 2 trang của chap tiếp theo để lật không bị khựng
      if (endPage + 1 < currentPages.length) loadPageImage(endPage + 1, sessionId);
      if (endPage + 2 < currentPages.length) loadPageImage(endPage + 2, sessionId);
    }

    // 3. Mở truyện tranh & Dựng Flipbook lật trang
    async function openComicBook(folderId, bookName) {
      const sessionId = ++currentSessionId;
      currentBookId = folderId;
      loadedImageSet.clear();
      isFlipping = false;

      document.getElementById("shelf-view").style.display = "none";
      document.getElementById("reader-view").style.display = "flex";
      document.getElementById("current-book-name").innerText = bookName;
      
      const overlay = document.getElementById("loading-book-overlay");
      overlay.style.display = "flex";
      setBookProgress(30, "Đang lấy cấu trúc trang...");

      const bookWrapper = document.getElementById("book-wrapper");
      bookWrapper.innerHTML = "";
      if (pageFlipInstance) {
        try { pageFlipInstance.destroy(); } catch (e) {}
        pageFlipInstance = null;
      }

      try {
        const response = await fetch(`${GOOGLE_SCRIPT_URL}?folderId=${folderId}`);
        if (!response.ok) throw new Error("HTTP " + response.status);

        const data = await response.json();
        if (sessionId !== currentSessionId) return;
        if (!data.success) throw new Error(data.error);

        currentPages = data.pages || [];
        const total = currentPages.length;
        document.getElementById("total-pages").innerText = total;

        if (total === 0) throw new Error("Thư mục truyện không có ảnh nào.");

        setBookProgress(60, "Khởi tạo khung lật sách...");

        // Đo tỷ lệ trang đầu
        const firstImg = new Image();
        firstImg.src = getDriveImageUrl(currentPages[0].id, 1600);
        await new Promise((resolve) => {
          firstImg.onload = resolve;
          firstImg.onerror = resolve;
        });

        const pageRatio = (firstImg.naturalWidth && firstImg.naturalHeight) 
          ? (firstImg.naturalWidth / firstImg.naturalHeight) 
          : 0.707;

        const isMobile = (window.innerWidth < 768) || (window.innerWidth < window.innerHeight);

        const headerH = 50;
        const toolbarsH = 80;
        const availH = Math.max(window.innerHeight - headerH - toolbarsH - 12, 280);
        const availW = Math.max(window.innerWidth - 16, 260);

        let singlePageW, singlePageH;

        if (isMobile) {
          if (availW / availH > pageRatio) {
            singlePageH = Math.floor(availH);
            singlePageW = Math.floor(singlePageH * pageRatio);
          } else {
            singlePageW = Math.floor(availW);
            singlePageH = Math.floor(singlePageW / pageRatio);
          }
        } else {
          const spreadRatio = 2 * pageRatio;
          let spreadW, spreadH;
          if (availW / availH > spreadRatio) {
            spreadH = Math.floor(availH);
            spreadW = Math.floor(spreadH * spreadRatio);
          } else {
            spreadW = Math.floor(availW);
            spreadH = Math.floor(spreadW / spreadRatio);
          }
          singlePageW = Math.floor(spreadW / 2);
          singlePageH = Math.floor(spreadH);
        }

        const flipbookContainer = document.createElement("div");
        flipbookContainer.id = "flipbook";
        
        if (isMobile) {
          flipbookContainer.style.width = singlePageW + "px";
          flipbookContainer.style.height = singlePageH + "px";
        } else {
          flipbookContainer.style.width = (singlePageW * 2) + "px";
          flipbookContainer.style.height = singlePageH + "px";
        }
        bookWrapper.appendChild(flipbookContainer);

        // Tạo sẵn thẻ DOM cho các trang
        const pageDivs = [];
        for (let i = 0; i < total; i++) {
          const pDiv = document.createElement("div");
          pDiv.className = "page-box";
          pDiv.innerHTML = `
            <div class="page-skeleton" id="page-skel-${i}"><div class="spinner"></div>Trang ${i + 1}</div>
            <img class="page-img" id="page-img-${i}" alt="Trang ${i + 1}" style="display:none;" />
          `;
          flipbookContainer.appendChild(pDiv);
          pageDivs.push(pDiv);
        }

        // TẢI CHỈ CHAP 1 TRƯỚC KHI HIỂN THỊ
        setBookProgress(85, "Nạp Chap 1...");
        await loadPageImage(0, sessionId);
        if (total > 1) await loadPageImage(1, sessionId);

        if (sessionId !== currentSessionId) return;
        setBookProgress(100, "Sẵn sàng!");

        pageFlipInstance = new St.PageFlip(flipbookContainer, {
          width: singlePageW,
          height: singlePageH,
          size: "fixed",
          minWidth: 150,
          maxWidth: 2500,
          minHeight: 150,
          maxHeight: 2500,
          maxShadowOpacity: 0.35,
          showCover: !isMobile,
          mobileScrollSupport: false,
          usePortrait: isMobile
        });

        pageFlipInstance.loadFromHTML(pageDivs);
        updatePageUI(0, total, isMobile);

        // Nạp nấc Chap 1
        loadCurrentChapterImages(0, sessionId);

        pageFlipInstance.on("changeState", (e) => {
          if (e.data === "read") {
            isFlipping = false;
          } else if (e.data === "flipping" || e.data === "user_fold") {
            isFlipping = true;
          }
        });

        pageFlipInstance.on("flip", (e) => {
          const curIndex = e.data;
          updatePageUI(curIndex, total, isMobile);
          loadCurrentChapterImages(curIndex, sessionId);
        });

        setTimeout(() => {
          if (sessionId === currentSessionId) {
            overlay.style.display = "none";
          }
        }, 200);

      } catch (err) {
        if (sessionId === currentSessionId) {
          alert("Lỗi tải truyện: " + err.message);
          backToShelf();
        }
      }
    }

    function updatePageUI(curIndex, total, isMobile) {
      const pageSpan = document.getElementById("current-page");
      if (isMobile) {
        pageSpan.innerText = curIndex + 1;
      } else {
        if (curIndex === 0) {
          pageSpan.innerText = "1";
        } else {
          const leftP = curIndex + 1;
          const rightP = Math.min(total, curIndex + 2);
          pageSpan.innerText = (leftP >= rightP) ? leftP : `${leftP} - ${rightP}`;
        }
      }
    }

    /* ĐỔI CHAP & NHẢY ĐẾN CHAPTER ĐƯỢC CHỌN */
    function openChapModal() {
      if (!currentPages.length) return;
      
      const totalChaps = Math.ceil(currentPages.length / PAGES_PER_CHAP);
      const readList = getReadChapters(currentBookId);
      const curChapIndex = pageFlipInstance ? Math.floor(pageFlipInstance.getCurrentPageIndex() / PAGES_PER_CHAP) : 0;

      const grid = document.getElementById("chap-list-grid");
      grid.innerHTML = "";

      for (let c = 0; c < totalChaps; c++) {
        const startP = c * PAGES_PER_CHAP + 1;
        const endP = Math.min(currentPages.length, (c + 1) * PAGES_PER_CHAP);
        
        const isRead = readList.includes(c);
        const isActive = (c === curChapIndex);

        const btn = document.createElement("div");
        btn.className = `chap-btn ${isRead ? 'read' : 'unread'} ${isActive ? 'active' : ''}`;
        btn.innerHTML = `
          <div>Chap ${c + 1}</div>
          <div style="font-size: 0.7rem; opacity: 0.8; margin-top:2px;">(Trang ${startP}-${endP})</div>
        `;

        btn.onclick = () => {
          closeChapModal();
          jumpToChapter(c);
        };

        grid.appendChild(btn);
      }

      document.getElementById("chap-modal").style.display = "flex";
    }

    function closeChapModal() {
      document.getElementById("chap-modal").style.display = "none";
    }

    function jumpToChapter(chapIndex) {
      if (!pageFlipInstance) return;
      const targetPageIndex = chapIndex * PAGES_PER_CHAP;
      
      // Tải trước các trang của Chap này lập tức
      loadCurrentChapterImages(targetPageIndex, currentSessionId);
      
      // Chuyển trang
      pageFlipInstance.turnToPage(targetPageIndex);
    }

    function prevPage() {
      if (!pageFlipInstance || isFlipping) return;
      if (document.getElementById("reader-view").style.display === "flex") {
        try {
          isFlipping = true;
          pageFlipInstance.flipPrev();
          setTimeout(() => { isFlipping = false; }, 400);
        } catch (e) { isFlipping = false; }
      }
    }

    function nextPage() {
      if (!pageFlipInstance || isFlipping) return;
      if (document.getElementById("reader-view").style.display === "flex") {
        try {
          isFlipping = true;
          pageFlipInstance.flipNext();
          setTimeout(() => { isFlipping = false; }, 400);
        } catch (e) { isFlipping = false; }
      }
    }

    window.addEventListener("keydown", (e) => {
      if (document.getElementById("reader-view").style.display === "flex") {
        if (e.key === "ArrowLeft") prevPage();
        if (e.key === "ArrowRight") nextPage();
      }
    });

    // Vuốt / Chạm di động
    let touchStartX = 0, touchStartY = 0, touchStartTime = 0, touchMoved = false;
    const bookWrapper = document.getElementById("book-wrapper");

    bookWrapper.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchStartTime = Date.now();
        touchMoved = false;
      }
    }, { capture: true, passive: true });

    bookWrapper.addEventListener("touchmove", (e) => {
      if (e.touches.length === 1) {
        const diffX = e.touches[0].clientX - touchStartX;
        const diffY = e.touches[0].clientY - touchStartY;
        if (Math.abs(diffX) > 10 || Math.abs(diffY) > 10) touchMoved = true;
      }
    }, { capture: true, passive: true });

    bookWrapper.addEventListener("touchend", (e) => {
      if (touchStartTime === 0) return;
      const touchEndX = e.changedTouches[0].clientX;
      const touchEndY = e.changedTouches[0].clientY;
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;
      const duration = Date.now() - touchStartTime;

      touchStartTime = 0;

      if (Math.abs(diffX) > 35 && Math.abs(diffX) > Math.abs(diffY) && duration < 500) {
        if (diffX < 0) nextPage();
        else prevPage();
        return;
      }

      if (!touchMoved || (Math.abs(diffX) < 15 && Math.abs(diffY) < 15 && duration < 400)) {
        const rect = bookWrapper.getBoundingClientRect();
        const tapX = touchEndX - rect.left;
        if (tapX < rect.width * 0.3) prevPage();
        else nextPage();
      }
    }, { capture: true, passive: true });

    function backToShelf() {
      currentSessionId++;
      isFlipping = false;
      document.getElementById("reader-view").style.display = "none";
      document.getElementById("shelf-view").style.display = "block";

      const bookWrapper = document.getElementById("book-wrapper");
      bookWrapper.innerHTML = "";

      if (pageFlipInstance) {
        try { pageFlipInstance.destroy(); } catch (e) {}
        pageFlipInstance = null;
      }
      currentPages = [];
      loadedImageSet.clear();
    }

    window.addEventListener("DOMContentLoaded", fetchBookList);
  </script>
</body>
