<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tủ Sách Điện Tử - Webtoon PDF Reader</title>
  
  <!-- PDF.js Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --reader-max-width: 820px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    header {
      height: 50px;
      padding: 0 1.2rem;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      z-index: 20;
    }
    header h1 { 
      font-size: 1.15rem; 
      font-weight: 600; 
      color: var(--accent); 
      cursor: pointer;
      user-select: none;
      transition: opacity 0.2s;
    }
    header h1:hover { opacity: 0.8; text-decoration: underline; }
    
    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    /* GIAO DIỆN 1: KỆ SÁCH */
    #shelf-view {
      padding: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.2rem;
      margin-top: 1.2rem;
    }
    
    /* HIỆU ỨNG XUẤT HIỆN TỪNG TRUYỆN MỘT (STAGGERED) */
    @keyframes cardFadeIn {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .book-card-animated {
      opacity: 0;
      animation: cardFadeIn 0.35s ease-out forwards;
    }

    .book-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      border: 1px solid #334155;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .book-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      border-color: var(--accent);
    }
    
    .book-cover {
      height: 230px;
      background: #090e1a;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.8rem;
      overflow: hidden;
      position: relative;
      border: 1px solid #334155;
    }
    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
      transition: transform 0.3s ease;
    }
    .book-card:hover .cover-img { transform: scale(1.04); }

    .book-title {
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 0.4rem;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .book-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: auto;
    }

    /* KHUNG XƯƠNG GIỮ CHỖ (SKELETON CARDS) */
    @keyframes skeletonPulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 0.25; }
    }
    .skeleton-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 0.85rem;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      animation: skeletonPulse 1.4s ease-in-out infinite;
    }
    .skeleton-cover {
      height: 230px;
      background: #0d1525;
      border-radius: 8px;
      margin-bottom: 0.8rem;
      border: 1px solid #334155;
    }
    .skeleton-line {
      height: 12px;
      background: #334155;
      border-radius: 4px;
      margin-bottom: 0.45rem;
    }
    .skeleton-line.short { width: 45%; }

    /* GIAO DIỆN 2: CHI TIẾT TRUYỆN */
    #detail-view {
      display: none;
      padding: 1.5rem;
      max-width: 950px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
      flex-direction: column;
      gap: 1.5rem;
    }
    .detail-card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid #334155;
      padding: 1.5rem;
      display: flex;
      gap: 1.8rem;
      box-shadow: 0 15px 30px rgba(0,0,0,0.3);
    }
    .detail-cover-box {
      width: 220px;
      min-width: 220px;
      height: 310px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #475569;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      background: #090e1a;
    }
    .detail-cover-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }
    .detail-info {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
    }
    .detail-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.35;
      margin-bottom: 0.8rem;
    }
    .detail-meta-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
    }
    .meta-tag {
      background: #334155;
      color: var(--accent);
      padding: 0.35rem 0.8rem;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 500;
    }
    .btn-read-start {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #0f172a;
      border: none;
      padding: 0.8rem 1.8rem;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      width: fit-content;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
    }
    .btn-read-start:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.45);
    }

    .chap-section {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid #334155;
      padding: 1.5rem;
    }
    .chap-section-header {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
      padding-bottom: 0.8rem;
    }
    .chap-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 0.75rem;
    }
    .chap-item {
      padding: 0.75rem 0.5rem;
      border-radius: 8px;
      border: 1px solid #334155;
      text-align: center;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      transition: all 0.2s;
      user-select: none;
    }
    .chap-item.unread {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }
    .chap-item.unread:hover { background: #0369a1; transform: translateY(-2px); }
    .chap-item.read {
      background: #1e293b;
      color: #94a3b8;
      border-color: #334155;
    }
    .chap-item.read:hover { background: #334155; color: #ffffff; }

    /* GIAO DIỆN 3: TRÌNH ĐỌC CUỘN DỌC */
    #reader-view {
      display: none;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }
    .reader-toolbar {
      height: 50px;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 1rem;
      flex-shrink: 0;
      z-index: 30;
      gap: 0.6rem;
    }
    .btn {
      background: #334155;
      color: white;
      border: none;
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: background 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      white-space: nowrap;
    }
    .btn:hover { background: #475569; }
    .btn-accent { background: var(--accent-hover); }
    .btn-accent:hover { background: #0369a1; }

    /* THANH ZOOM PC */
    .pc-zoom-toolbar {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: #1e293b;
      padding: 0.25rem 0.6rem;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .pc-zoom-toolbar input[type="range"] {
      width: 85px;
      height: 5px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .pc-zoom-toolbar span {
      font-size: 0.8rem;
      min-width: 38px;
      text-align: center;
      color: var(--accent);
      font-weight: 600;
    }
    .btn-icon {
      background: #334155;
      color: white;
      border: none;
      padding: 0.2rem 0.45rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn-icon:hover { background: #475569; }

    /* VÙNG CUỘN ĐỌC DỌC & CẢM ỨNG PINCH-TO-ZOOM */
    #reader-scroll-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.8rem 0 3rem 0;
      background: #090e17;
      position: relative;
      touch-action: pan-y pinch-zoom;
    }
    
    .scroll-pages-wrapper {
      width: 100%;
      max-width: var(--reader-max-width);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transform-origin: top center;
      transition: transform 0.05s linear;
      will-change: transform;
    }

    .pdf-page-container {
      width: 100%;
      position: relative;
      background: #111827;
      box-shadow: 0 5px 18px rgba(0,0,0,0.45);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .pdf-page-container canvas {
      display: block;
      width: 100% !important;
      height: auto !important;
    }
    .page-loading-skeleton {
      color: #64748b;
      font-size: 0.85rem;
      font-weight: 500;
      user-select: none;
    }

    .end-chap-nav {
      margin-top: 2rem;
      padding: 1.5rem;
      display: flex;
      justify-content: center;
      gap: 1rem;
      width: 100%;
      max-width: var(--reader-max-width);
      border-top: 1px solid #334155;
    }

    /* POPUP CHỌN NHANH CHAP */
    #chap-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(6px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-content {
      background: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 12px;
      width: 100%;
      max-width: 550px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
    }
    .modal-header {
      padding: 1rem 1.2rem;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-body {
      padding: 1rem;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 0.6rem;
    }

    /* PROGRESS BOX */
    .progress-box {
      width: 100%;
      max-width: 380px;
      background: #1e293b;
      padding: 1.25rem;
      border-radius: 12px;
      border: 1px solid #334155;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }
    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .progress-track {
      width: 100%;
      height: 8px;
      background: #334155;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      border-radius: 999px;
      transition: width 0.12s ease-out;
    }

    #loading-book-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    @media (max-width: 768px) {
      .detail-card {
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 1.2rem;
      }
      .detail-cover-box {
        width: 180px;
        min-width: 180px;
        height: 250px;
      }
      .detail-info { align-items: center; }
      .detail-meta-tags { justify-content: center; }
      .btn-read-start { width: 100%; justify-content: center; }
      #reader-scroll-container { padding: 0 0 2rem 0; }
      .scroll-pages-wrapper { gap: 2px; }
      .pc-zoom-toolbar { display: none; }
    }

    @media (max-width: 600px) {
      header { height: 46px; padding: 0 0.8rem; }
      header h1 { font-size: 1rem; }
      #current-book-name { max-width: 25% !important; font-size: 0.8rem !important; }
      .reader-toolbar { font-size: 0.8rem !important; padding: 0 0.5rem; }
      .btn { padding: 0.35rem 0.6rem; font-size: 0.78rem; }
      .book-cover { height: 190px; }
      .chap-grid, .modal-body { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
    }
  </style>
</head>
<body>

  <header id="main-header">
    <h1 onclick="backToShelf()" title="Bấm để quay về danh mục sách">Tủ Sách Trực Tuyến</h1>
    <div class="header-actions">
      <div id="status-tag" style="font-size: 0.8rem; color: var(--text-muted);">Đang tải...</div>
      <button class="btn btn-icon" onclick="forceRefreshShelf()" title="Quét đồng bộ lại từ Google Drive">🔄</button>
    </div>
  </header>

  <!-- MÀN HÌNH 1: KỆ SÁCH -->
  <main id="shelf-view">
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 0.8rem; margin-bottom: 0.5rem;">
      <h2>Danh mục truyện tranh</h2>
      <span id="file-counter" style="color: var(--text-muted); font-size: 0.9rem;"></span>
    </div>

    <div id="shelf-grid" class="grid"></div>
  </main>

  <!-- MÀN HÌNH 2: CHI TIẾT TRUYỆN -->
  <div id="detail-view">
    <div style="display: flex; justify-content: flex-start;">
      <button class="btn" onclick="backToShelf()">← Quay lại kệ sách</button>
    </div>

    <div class="detail-card">
      <div class="detail-cover-box">
        <img id="detail-cover-img" src="" alt="Thumbnail" />
      </div>
      <div class="detail-info">
        <div>
          <div class="detail-title" id="detail-book-title">Tên truyện</div>
          <div class="detail-meta-tags">
            <span class="meta-tag" id="detail-chaps-tag">-- Chap</span>
          </div>
        </div>
        
        <button class="btn-read-start" onclick="readFromBeginning()">
          📖 Đọc từ đầu
        </button>
      </div>
    </div>

    <div class="chap-section">
      <div class="chap-section-header">
        <span>Danh sách Chapter (File PDF)</span>
      </div>
      <div class="chap-grid" id="detail-chap-grid"></div>
    </div>
  </div>

  <!-- MÀN HÌNH 3: TRÌNH ĐỌC CUỘN DỌC -->
  <div id="reader-view">
    <div class="reader-toolbar">
      <button class="btn" onclick="backToDetail()">← Mục lục</button>
      <span id="current-book-name" style="font-weight: 600; max-width: 30%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></span>
      
      <button class="btn btn-accent" onclick="openChapModal()">
        📚 <span id="current-chap-label">Chap 1</span> ▾
      </button>

      <!-- THANH ĐIỀU KHIỂN ZOOM CHO PC -->
      <div class="pc-zoom-toolbar">
        <button class="btn-icon" onclick="stepPcZoom(-10)" title="Thu nhỏ">−</button>
        <input type="range" id="pc-zoom-slider" min="60" max="180" step="5" value="100" oninput="onPcZoomSlider(this.value)">
        <button class="btn-icon" onclick="stepPcZoom(10)" title="Phóng to">+</button>
        <span id="pc-zoom-val">100%</span>
        <button class="btn-icon" onclick="resetPcZoom()" title="Về 100%">↺</button>
      </div>

      <div style="font-size: 0.85rem; white-space: nowrap;">
        Trang <span id="current-page">1</span>/<span id="total-pages">1</span>
      </div>
    </div>

    <div id="loading-book-overlay">
      <div class="progress-box">
        <div class="progress-header">
          <span id="book-prog-text">Đang nạp Chap...</span>
          <span id="book-prog-pct" style="color: var(--accent);">0%</span>
        </div>
        <div class="progress-track">
          <div id="book-prog-bar" class="progress-fill"></div>
        </div>
      </div>
    </div>

    <!-- KHU VỰC CUỘN ĐỌC DỌC -->
    <div id="reader-scroll-container">
      <div class="scroll-pages-wrapper" id="scroll-pages-wrapper"></div>
      
      <div class="end-chap-nav" id="end-chap-nav" style="display: none;">
        <button class="btn" id="btn-prev-chap" onclick="prevChapter()">‹ Chap trước</button>
        <button class="btn" onclick="scrollToTop()">↑ Lên đầu</button>
        <button class="btn btn-accent" id="btn-next-chap" onclick="nextChapter()">Chap sau ›</button>
      </div>
    </div>
  </div>

  <!-- POPUP CHỌN CHAPTER NHANH -->
  <div id="chap-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="font-size: 1rem;">Chuyển nhanh Chapter</h3>
        <button class="btn" onclick="closeChapModal()">✕ Đóng</button>
      </div>
      <div class="modal-body" id="modal-chap-grid"></div>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxOwmO8RSpnp9xgWBCBvBkPyVDmtjtuon9nWWNibD_E8FalOFEf7zRQPeeVVTtrM03D-g/exec";

    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    let currentSessionId = 0;
    let selectedBook = null;
    let bookChapters = [];
    let currentChapIndex = 0;
    let currentPdfDoc = null;
    let currentNumPages = 0;
    let pageObserver = null;
    let scrollTrackerObserver = null;

    // Quản lý Zoom PC
    let pcZoomPercent = 100;
    const BASE_READER_WIDTH = 820;

    // Quản lý Pinch-to-zoom Mobile
    let mobileScale = 1;
    let mobileStartDist = 0;
    let mobileStartScale = 1;
    let mobilePanX = 0, mobilePanY = 0;
    let mobileStartX = 0, mobileStartY = 0;
    let lastTapTime = 0;
    let isPinching = false;

    // Bộ nhớ đệm Memory & Request Deduplication
    const memoryPdfCache = new Map();
    const activeFetches = new Map();

    function openPdfDB() {
      return new Promise((resolve) => {
        const req = indexedDB.open("MangaPdfStore_v3", 1);
        req.onupgradeneeded = (e) => e.target.result.createObjectStore("chap_pdfs");
        req.onsuccess = (e) => resolve(e.target.result);
        req.onerror = () => resolve(null);
      });
    }

    async function getStoredPdf(pdfId) {
      if (memoryPdfCache.has(pdfId)) return memoryPdfCache.get(pdfId);
      try {
        const db = await openPdfDB();
        if (!db) return null;
        return new Promise((resolve) => {
          const tx = db.transaction("chap_pdfs", "readonly");
          const req = tx.objectStore("chap_pdfs").get(pdfId);
          req.onsuccess = () => {
            if (req.result) memoryPdfCache.set(pdfId, req.result);
            resolve(req.result || null);
          };
          req.onerror = () => resolve(null);
        });
      } catch (e) { return null; }
    }

    async function storePdf(pdfId, uint8Array) {
      memoryPdfCache.set(pdfId, uint8Array);
      try {
        const db = await openPdfDB();
        if (!db) return;
        const tx = db.transaction("chap_pdfs", "readwrite");
        tx.objectStore("chap_pdfs").put(uint8Array, pdfId);
      } catch (e) {}
    }

    function getDriveImageUrl(fileId, size = 800) {
      return `https://lh3.googleusercontent.com/d/${fileId}=w${size}`;
    }

    function setBookProgress(pct, text) {
      document.getElementById("book-prog-bar").style.width = pct + "%";
      document.getElementById("book-prog-pct").innerText = Math.round(pct) + "%";
      if (text) document.getElementById("book-prog-text").innerText = text;
    }

    function getReadChapters(bookId) {
      try {
        const data = localStorage.getItem(`read_chaps_${bookId}`);
        return data ? JSON.parse(data) : [];
      } catch (e) { return []; }
    }

    function markChapAsRead(bookId, chapIndex) {
      if (!bookId) return;
      const readList = getReadChapters(bookId);
      if (!readList.includes(chapIndex)) {
        readList.push(chapIndex);
        try {
          localStorage.setItem(`read_chaps_${bookId}`, JSON.stringify(readList));
        } catch (e) {}
      }
    }

    // ==========================================================
    // 1. TẢI KỆ SÁCH SIÊU TỐC: CACHE-FIRST & STAGGERED RENDERING
    // ==========================================================
    function renderSkeletonCards(count = 8) {
      const shelfGrid = document.getElementById("shelf-grid");
      shelfGrid.innerHTML = "";
      for (let i = 0; i < count; i++) {
        const skeleton = document.createElement("div");
        skeleton.className = "skeleton-card";
        skeleton.innerHTML = `
          <div class="skeleton-cover"></div>
          <div class="skeleton-line"></div>
          <div class="skeleton-line short"></div>
        `;
        shelfGrid.appendChild(skeleton);
      }
    }

    function renderBookGrid(books, animate = true) {
      document.getElementById("file-counter").innerText = `Tổng cộng: ${books.length} bộ`;
      const shelfGrid = document.getElementById("shelf-grid");
      shelfGrid.innerHTML = "";

      books.forEach((book, idx) => {
        const card = document.createElement("div");
        card.className = animate ? "book-card book-card-animated" : "book-card";
        
        // Hiệu ứng từng truyện xuất hiện nối tiếp nhau (staggered delay)
        if (animate) {
          card.style.animationDelay = `${Math.min(idx * 40, 800)}ms`;
        }

        const thumbSrc = book.thumbId ? getDriveImageUrl(book.thumbId, 600) : "";

        card.innerHTML = `
          <div class="book-cover">
            ${book.thumbId ? `
              <img id="shelf-thumb-${book.id}"
                   src="${thumbSrc}" 
                   alt="${book.name}" 
                   class="cover-img" 
                   loading="lazy" 
                   onerror="this.style.display='none';" />
            ` : ''}
          </div>
          <div class="book-title" title="${book.name}">${book.name}</div>
          <div class="book-meta">${book.chapCount} Chap</div>
        `;
        card.onclick = () => openBookDetail(book);
        shelfGrid.appendChild(card);
      });
    }

    async function initShelf() {
      // BƯỚC 1: Kiểm tra xem có dữ liệu đã lưu trong localStorage không
      const cached = localStorage.getItem("cached_shelf_books");
      let hasCache = false;

      if (cached) {
        try {
          const books = JSON.parse(cached);
          if (Array.isArray(books) && books.length > 0) {
            hasCache = true;
            // HIỆN NGAY LẬP TỨC (0.05 giây) - KHÔNG ĐỢI DRIVE
            renderBookGrid(books, false);
            document.getElementById("status-tag").innerText = "Đang kiểm tra cập nhật...";
          }
        } catch (e) {}
      }

      // Nếu là lần đầu mở web (chưa có cache), hiện khung xương Skeleton
      if (!hasCache) {
        renderSkeletonCards(8);
        document.getElementById("status-tag").innerText = "Đang kết nối Drive...";
      }

      // BƯỚC 2: Chạy nền ngầm kiểm tra cập nhật từ Google Drive
      fetchBookList(false, hasCache);
    }

    async function fetchBookList(forceRefresh = false, hasCache = false) {
      const statusTag = document.getElementById("status-tag");
      if (forceRefresh) {
        statusTag.innerText = "Đang quét lại Drive...";
        renderSkeletonCards(8);
      }

      try {
        const fetchUrl = forceRefresh 
          ? `${GOOGLE_SCRIPT_URL}?refresh=1&t=${Date.now()}` 
          : `${GOOGLE_SCRIPT_URL}?t=${Date.now()}`;

        const response = await fetch(fetchUrl);
        const res = await response.json();

        if (!res.success) throw new Error(res.error);

        const books = res.books || [];
        const oldCache = localStorage.getItem("cached_shelf_books");
        const newCache = JSON.stringify(books);

        // Lưu vào bộ nhớ cục bộ
        localStorage.setItem("cached_shelf_books", newCache);

        // Nếu dữ liệu có thay đổi hoặc trước đó chưa có cache, vẽ các truyện xuất hiện lần lượt
        if (!hasCache || oldCache !== newCache || forceRefresh) {
          renderBookGrid(books, true);
        }

        statusTag.innerText = "Đã cập nhật mới nhất";

      } catch (err) {
        if (!hasCache) {
          document.getElementById("shelf-grid").innerHTML = `<div style="color:#ef4444; text-align:center; grid-column: 1/-1; padding: 2rem;">Lỗi nạp danh mục: ${err.message}</div>`;
        }
        statusTag.innerText = "Không thể đồng bộ Drive";
      }
    }

    function forceRefreshShelf() {
      fetchBookList(true, false);
    }

    // TẢI FILE PDF & GIẢI MÃ NATIVE SIÊU TỐC
    async function fetchAndCachePdf(pdfId) {
      let cached = await getStoredPdf(pdfId);
      if (cached) return cached;

      if (activeFetches.has(pdfId)) {
        return activeFetches.get(pdfId);
      }

      const fetchPromise = (async () => {
        try {
          const res = await fetch(`${GOOGLE_SCRIPT_URL}?pdfId=${pdfId}`);
          const data = await res.json();
          if (data.success && data.data) {
            const resBlob = await fetch("data:application/pdf;base64," + data.data);
            const arrayBuf = await resBlob.arrayBuffer();
            const uint8 = new Uint8Array(arrayBuf);
            
            await storePdf(pdfId, uint8);
            return uint8;
          }
        } catch (e) {
          console.warn("Lỗi tải PDF:", e);
        } finally {
          activeFetches.delete(pdfId);
        }
        return null;
      })();

      activeFetches.set(pdfId, fetchPromise);
      return fetchPromise;
    }

    async function prefetchSequentially(chaps) {
      for (const chap of chaps) {
        if (!chap) continue;
        const exists = await getStoredPdf(chap.id);
        if (!exists) {
          await fetchAndCachePdf(chap.id);
        }
      }
    }

    // 2. CHI TIẾT TRUYỆN
    async function openBookDetail(book) {
      selectedBook = book;

      document.getElementById("shelf-view").style.display = "none";
      document.getElementById("reader-view").style.display = "none";
      document.getElementById("detail-view").style.display = "flex";
      document.getElementById("main-header").style.display = "flex";

      document.getElementById("detail-book-title").innerText = book.name;
      document.getElementById("detail-chaps-tag").innerText = `${book.chapCount} Chap`;

      const coverImg = document.getElementById("detail-cover-img");
      if (book.thumbId) {
        coverImg.src = getDriveImageUrl(book.thumbId, 800);
        coverImg.style.display = "block";
      } else {
        coverImg.style.display = "none";
      }

      window.scrollTo(0, 0);

      try {
        const res = await fetch(`${GOOGLE_SCRIPT_URL}?folderId=${book.id}&t=${Date.now()}`);
        const data = await res.json();
        if (data.success) {
          bookChapters = data.chaps || [];
          document.getElementById("detail-chaps-tag").innerText = `${bookChapters.length} Chap`;
          
          if (data.thumbId) {
            coverImg.src = getDriveImageUrl(data.thumbId, 800);
            coverImg.style.display = "block";
          }
          renderDetailChapGrid(book.id, bookChapters);

          // Tải trước ngầm tuần tự Chap 1 rồi Chap 2
          prefetchSequentially([bookChapters[0], bookChapters[1]]);
        }
      } catch (e) {
        console.error("Lỗi lấy danh sách chap:", e);
      }
    }

    function renderDetailChapGrid(bookId, chaps) {
      const grid = document.getElementById("detail-chap-grid");
      grid.innerHTML = "";
      const readList = getReadChapters(bookId);

      chaps.forEach((chap, idx) => {
        const isRead = readList.includes(idx);
        const btn = document.createElement("div");
        btn.className = `chap-item ${isRead ? 'read' : 'unread'}`;
        btn.innerHTML = `<div>Chap ${idx + 1}</div>`;
        btn.onclick = () => startReadingChapter(idx);
        grid.appendChild(btn);
      });
    }

    function readFromBeginning() {
      startReadingChapter(0);
    }

    // 3. MỞ ĐỌC DẠNG CUỘN DỌC TỐC ĐỘ CAO
    async function startReadingChapter(chapIdx = 0) {
      if (!selectedBook || !bookChapters[chapIdx]) return;

      const sessionId = ++currentSessionId;
      currentChapIndex = chapIdx;

      resetMobileZoom();
      
      if (pageObserver) pageObserver.disconnect();
      if (scrollTrackerObserver) scrollTrackerObserver.disconnect();

      const chapFile = bookChapters[chapIdx];

      document.getElementById("main-header").style.display = "none";
      document.getElementById("detail-view").style.display = "none";
      document.getElementById("reader-view").style.display = "flex";
      document.getElementById("current-book-name").innerText = selectedBook.name;
      document.getElementById("current-chap-label").innerText = `Chap ${chapIdx + 1}`;

      const overlay = document.getElementById("loading-book-overlay");
      overlay.style.display = "flex";
      setBookProgress(30, `Đang kết nối tải Chap ${chapIdx + 1}...`);

      const wrapper = document.getElementById("scroll-pages-wrapper");
      wrapper.innerHTML = "";
      document.getElementById("end-chap-nav").style.display = "none";
      document.getElementById("reader-scroll-container").scrollTop = 0;

      try {
        setBookProgress(50, "Đang nạp dữ liệu PDF...");
        const pdfBytes = await fetchAndCachePdf(chapFile.id);
        if (sessionId !== currentSessionId) return;
        if (!pdfBytes) throw new Error("Không thể tải file PDF Chap.");

        setBookProgress(85, "Khởi tạo trang đọc...");
        currentPdfDoc = await pdfjsLib.getDocument({ data: pdfBytes }).promise;
        currentNumPages = currentPdfDoc.numPages;

        if (currentNumPages === 0) throw new Error("File PDF rỗng.");

        document.getElementById("current-page").innerText = "1";
        document.getElementById("total-pages").innerText = currentNumPages;

        const page1 = await currentPdfDoc.getPage(1);
        const vp1 = page1.getViewport({ scale: 1.0 });

        for (let p = 1; p <= currentNumPages; p++) {
          const container = document.createElement("div");
          container.className = "pdf-page-container";
          container.dataset.page = p;
          container.dataset.rendered = "false";
          container.style.aspectRatio = `${vp1.width} / ${vp1.height}`;

          const loadingTxt = document.createElement("div");
          loadingTxt.className = "page-loading-skeleton";
          loadingTxt.innerText = `Trang ${p}`;
          container.appendChild(loadingTxt);

          wrapper.appendChild(container);
        }

        pageObserver = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const el = entry.target;
              if (el.dataset.rendered === "false") {
                el.dataset.rendered = "true";
                renderSinglePage(parseInt(el.dataset.page), el);
              }
            }
          });
        }, {
          root: document.getElementById("reader-scroll-container"),
          rootMargin: "500px 0px"
        });

        scrollTrackerObserver = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              document.getElementById("current-page").innerText = entry.target.dataset.page;
            }
          });
        }, {
          root: document.getElementById("reader-scroll-container"),
          threshold: 0.3
        });

        const allContainers = wrapper.querySelectorAll(".pdf-page-container");
        allContainers.forEach(c => {
          pageObserver.observe(c);
          scrollTrackerObserver.observe(c);
        });

        // Vẽ ngay trang 1 rồi tắt overlay
        const firstPageEl = allContainers[0];
        if (firstPageEl) {
          firstPageEl.dataset.rendered = "true";
          await renderSinglePage(1, firstPageEl);
        }

        const btnPrev = document.getElementById("btn-prev-chap");
        const btnNext = document.getElementById("btn-next-chap");
        btnPrev.style.display = (chapIdx > 0) ? "inline-flex" : "none";
        btnNext.style.display = (chapIdx + 1 < bookChapters.length) ? "inline-flex" : "none";
        document.getElementById("end-chap-nav").style.display = "flex";

        markChapAsRead(selectedBook.id, chapIdx);
        overlay.style.display = "none";

        // Tải trước ngầm tuần tự Chap kế tiếp
        prefetchSequentially([bookChapters[chapIdx + 1], bookChapters[chapIdx + 2]]);

      } catch (err) {
        if (sessionId === currentSessionId) {
          alert("Lỗi tải Chap: " + err.message);
          backToDetail();
        }
      }
    }

    async function renderSinglePage(pageNum, container) {
      if (!currentPdfDoc) return;
      try {
        const page = await currentPdfDoc.getPage(pageNum);
        const baseVp = page.getViewport({ scale: 1.0 });

        const dpr = Math.min(window.devicePixelRatio || 1, 1.75);
        const containerWidth = container.clientWidth || 800;
        const scale = (containerWidth / baseVp.width) * dpr;

        const viewport = page.getViewport({ scale: scale });

        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d", { alpha: false });
        
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        canvas.style.width = "100%";
        canvas.style.height = "auto";

        await page.render({
          canvasContext: ctx,
          viewport: viewport
        }).promise;

        container.innerHTML = "";
        container.style.aspectRatio = "";
        container.appendChild(canvas);

      } catch (e) {
        console.error("Lỗi render trang " + pageNum, e);
      }
    }

    // ==========================================
    // 4. ZOOM PC
    // ==========================================
    function applyPcZoom(val) {
      pcZoomPercent = Math.max(60, Math.min(180, parseInt(val)));
      document.getElementById("pc-zoom-slider").value = pcZoomPercent;
      document.getElementById("pc-zoom-val").innerText = pcZoomPercent + "%";
      
      const targetWidth = Math.round(BASE_READER_WIDTH * (pcZoomPercent / 100));
      document.documentElement.style.setProperty('--reader-max-width', `${targetWidth}px`);
    }

    function onPcZoomSlider(val) {
      applyPcZoom(val);
    }

    function stepPcZoom(delta) {
      applyPcZoom(pcZoomPercent + delta);
    }

    function resetPcZoom() {
      applyPcZoom(100);
    }

    // ==========================================
    // 5. PINCH-TO-ZOOM MOBILE
    // ==========================================
    const scrollContainer = document.getElementById("reader-scroll-container");
    const pagesWrapper = document.getElementById("scroll-pages-wrapper");

    function getTouchDistance(t1, t2) {
      return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
    }

    function applyMobileTransform() {
      if (mobileScale <= 1.02) {
        mobileScale = 1;
        mobilePanX = 0;
        mobilePanY = 0;
        pagesWrapper.style.transform = "";
        scrollContainer.style.overflowY = "auto";
      } else {
        pagesWrapper.style.transform = `translate(${mobilePanX}px, ${mobilePanY}px) scale(${mobileScale})`;
        scrollContainer.style.overflowY = "hidden";
      }
    }

    function resetMobileZoom() {
      mobileScale = 1;
      mobilePanX = 0;
      mobilePanY = 0;
      applyMobileTransform();
    }

    scrollContainer.addEventListener("touchstart", (e) => {
      if (e.touches.length === 2) {
        isPinching = true;
        mobileStartDist = getTouchDistance(e.touches[0], e.touches[1]);
        mobileStartScale = mobileScale;
        e.preventDefault();
      } else if (e.touches.length === 1) {
        const now = Date.now();
        if (now - lastTapTime < 300) {
          if (mobileScale > 1.2) {
            resetMobileZoom();
          } else {
            mobileScale = 1.8;
            applyMobileTransform();
          }
          lastTapTime = 0;
          return;
        }
        lastTapTime = now;

        if (mobileScale > 1.02) {
          mobileStartX = e.touches[0].clientX - mobilePanX;
          mobileStartY = e.touches[0].clientY - mobilePanY;
        }
      }
    }, { passive: false });

    scrollContainer.addEventListener("touchmove", (e) => {
      if (e.touches.length === 2 && isPinching) {
        const currentDist = getTouchDistance(e.touches[0], e.touches[1]);
        if (mobileStartDist > 0) {
          const factor = currentDist / mobileStartDist;
          mobileScale = Math.min(3.5, Math.max(1, mobileStartScale * factor));
          applyMobileTransform();
        }
        e.preventDefault();
      } else if (e.touches.length === 1 && mobileScale > 1.02) {
        mobilePanX = e.touches[0].clientX - mobileStartX;
        mobilePanY = e.touches[0].clientY - mobileStartY;
        
        const maxPanX = (pagesWrapper.offsetWidth * (mobileScale - 1)) / 2 + 50;
        mobilePanX = Math.max(-maxPanX, Math.min(maxPanX, mobilePanX));

        applyMobileTransform();
        e.preventDefault();
      }
    }, { passive: false });

    scrollContainer.addEventListener("touchend", (e) => {
      if (e.touches.length < 2) {
        isPinching = false;
      }
      if (mobileScale < 1.05) {
        resetMobileZoom();
      }
    });

    // ==========================================
    // ĐIỀU HƯỚNG & PHÍM TẮT
    // ==========================================
    function scrollToTop() {
      document.getElementById("reader-scroll-container").scrollTo({ top: 0, behavior: "smooth" });
    }

    function prevChapter() {
      if (currentChapIndex > 0) {
        startReadingChapter(currentChapIndex - 1);
      }
    }

    function nextChapter() {
      if (currentChapIndex + 1 < bookChapters.length) {
        startReadingChapter(currentChapIndex + 1);
      }
    }

    function openChapModal() {
      if (!bookChapters.length) return;
      const readList = getReadChapters(selectedBook.id);
      const grid = document.getElementById("modal-chap-grid");
      grid.innerHTML = "";

      bookChapters.forEach((chap, c) => {
        const isRead = readList.includes(c);
        const isActive = (c === currentChapIndex);

        const btn = document.createElement("div");
        btn.className = `chap-item ${isRead ? 'read' : 'unread'} ${isActive ? 'active' : ''}`;
        btn.innerHTML = `<div>Chap ${c + 1}</div>`;
        btn.onclick = () => {
          closeChapModal();
          startReadingChapter(c);
        };
        grid.appendChild(btn);
      });

      document.getElementById("chap-modal").style.display = "flex";
    }

    function closeChapModal() {
      document.getElementById("chap-modal").style.display = "none";
    }

    function backToDetail() {
      currentSessionId++;
      resetMobileZoom();
      if (pageObserver) pageObserver.disconnect();
      if (scrollTrackerObserver) scrollTrackerObserver.disconnect();

      document.getElementById("reader-view").style.display = "none";
      document.getElementById("scroll-pages-wrapper").innerHTML = "";

      if (selectedBook) {
        openBookDetail(selectedBook);
      } else {
        backToShelf();
      }
    }

    function backToShelf() {
      currentSessionId++;
      resetMobileZoom();
      if (pageObserver) pageObserver.disconnect();
      if (scrollTrackerObserver) scrollTrackerObserver.disconnect();

      document.getElementById("reader-view").style.display = "none";
      document.getElementById("detail-view").style.display = "none";
      document.getElementById("shelf-view").style.display = "block";
      document.getElementById("main-header").style.display = "flex";

      document.getElementById("scroll-pages-wrapper").innerHTML = "";
      selectedBook = null;
    }

    window.addEventListener("keydown", (e) => {
      if (document.getElementById("reader-view").style.display === "flex") {
        if (e.key === "ArrowLeft") prevChapter();
        if (e.key === "ArrowRight") nextChapter();
      }
    });

    window.addEventListener("DOMContentLoaded", initShelf);
  </script>
